<!doctype html>
<html lang="fa" dir="rtl" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
    <meta name="theme-color" content="#0b0c0e" />
    <meta name="color-scheme" content="dark light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>ربات‌ساز — استودیو</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #0b0c0e; --panel: #131519; --panel2: #1a1d22; --hair: #262a31; --hair2: #333844;
        --tx: #e7eaef; --mu: #828a99;
        --ac: #57c8c1; --ac2: #57c8c1;                 /* فیروزه‌ای مات — بدون بنفش/گرادیان */
        --ac-soft: color-mix(in srgb, var(--ac) 12%, transparent);
        --ok: #46c98d; --red: #e0685f; --amber: #d7a53f;
        --r: 14px; --r2: 11px; --maxw: 460px;
        --sh: 0 1px 0 rgba(255,255,255,.02), 0 10px 24px -18px rgba(0,0,0,.8);
        --grid: repeating-linear-gradient(0deg, transparent 0 23px, color-mix(in srgb,var(--hair) 45%,transparent) 23px 24px);
        --mono: "JetBrains Mono", ui-monospace, monospace;
      }
      html[data-theme="light"] {
        --bg: #eef0f2; --panel: #ffffff; --panel2: #f3f5f7; --hair: #dfe3e8; --hair2: #cfd5dd;
        --tx: #14171c; --mu: #5f6773;
        --ac: #159e97; --ac2: #159e97; --ac-soft: color-mix(in srgb, var(--ac) 10%, transparent);
        --ok: #0f9d63; --red: #c9483f; --amber: #9a6b12;
        --sh: 0 1px 0 rgba(255,255,255,.5), 0 8px 20px -16px rgba(20,23,28,.25);
      }
      * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
      html, body { background: var(--bg); color: var(--tx); font: 14.5px/1.7 Vazirmatn, system-ui, sans-serif; min-height: 100vh; min-height: 100dvh; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
      button, input, textarea, select { font: inherit; color: inherit; border: 0; outline: 0; background: none; }
      /* رفع باگ زوم خودکار سافاری/iOS: اگر فونت اینپوت زیر ۱۶px باشد، هنگام فوکوس صفحه زوم و بدریخت می‌شود */
      @media (pointer: coarse) { input, textarea, select { font-size: 16px !important; } }
      a { color: inherit; text-decoration: none; }
      svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
      .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }        /* اعداد انگلیسی */
      ::selection { background: var(--ac); color: #04121a; }
      ::-webkit-scrollbar { width: 0; height: 0; }
      #app { max-width: var(--maxw); margin: 0 auto; padding: 12px 14px 116px; }
      .fade { animation: fade .28s cubic-bezier(.2,.7,.2,1); }
      @keyframes fade { from { opacity: 0; transform: translateY(8px); } }

      /* ── primitives ── */
      .bar { display: flex; align-items: center; justify-content: space-between; margin: 6px 2px 16px; gap: 10px; }
      .bar .idn { display: flex; align-items: center; gap: 11px; min-width: 0; }
      .bar small { display: block; color: var(--mu); font-size: 12.5px; }
      .bar b { font-size: 17px; font-weight: 700; display: block; line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      h2 { font-size: 11px; color: var(--mu); font-weight: 700; letter-spacing: .6px; margin: 22px 3px 10px; display: flex; align-items: center; justify-content: space-between; text-transform: uppercase; }
      .lnk { color: var(--ac); font-size: 13px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
      .ava { width: 42px; height: 42px; border-radius: 12px; background: var(--panel2); border: 1px solid var(--hair2); color: var(--tx); display: grid; place-items: center; font-weight: 700; font-size: 17px; flex: none; }
      .av2 { position: relative; width: 42px; height: 42px; border-radius: 12px; background: var(--ac-soft); border: 1px solid var(--hair); display: grid; place-items: center; font-weight: 700; color: var(--ac); flex: none; }
      .av2.grad { background: var(--ac); color: #04121a; border: 0; }
      .live { position: absolute; bottom: -1px; left: -1px; width: 12px; height: 12px; border-radius: 50%; background: var(--mu); border: 3px solid var(--panel); }
      .live.on { background: var(--ok); box-shadow: 0 0 0 4px color-mix(in srgb, var(--ok) 16%, transparent); }
      .pill { font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 999px; }
      .pill.on { color: var(--ok); background: color-mix(in srgb, var(--ok) 13%, transparent); }
      .pill.off { color: var(--mu); background: var(--panel2); }
      .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 47px; padding: 0 18px; border-radius: var(--r2); background: var(--ac); color: #04121a; font-weight: 700; cursor: pointer; width: 100%; transition: transform .1s, opacity .1s; }
      .btn:active { transform: scale(.98); opacity: .92; }
      .btn:disabled { opacity: .45; }
      .btn.line { background: var(--panel); color: var(--tx); border: 1px solid var(--hair2); }
      .btn.red { background: color-mix(in srgb, var(--red) 12%, transparent); color: var(--red); border: 1px solid color-mix(in srgb,var(--red) 30%,transparent); }
      .btn.sm { height: 38px; width: auto; padding: 0 14px; font-size: 13px; }
      .btn svg { width: 18px; height: 18px; }
      .ib { width: 38px; height: 38px; border-radius: 11px; background: var(--panel); border: 1px solid var(--hair); display: grid; place-items: center; cursor: pointer; color: var(--mu); flex: none; transition: .15s; }
      .ib:active { background: var(--panel2); transform: scale(.93); }
      #fab { position: fixed; bottom: calc(max(14px, env(safe-area-inset-bottom)) + 76px); inset-inline-end: max(16px, calc(50vw - var(--maxw)/2 + 14px)); width: 54px; height: 54px; border-radius: 16px; background: var(--ac); color: #04121a; display: grid; place-items: center; cursor: pointer; z-index: 25; transition: transform .15s; box-shadow: 0 10px 24px -12px color-mix(in srgb,var(--ac) 60%,transparent); }
      #fab svg { width: 26px; height: 26px; stroke-width: 2.1; }
      #fab:active { transform: scale(.9); }
      #fab.hide { display: none; }
      #nav { position: fixed; bottom: max(14px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); display: none; gap: 2px; width: min(var(--maxw), calc(100vw - 22px)); background: color-mix(in srgb, var(--panel) 92%, transparent); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid var(--hair); border-radius: 16px; padding: 5px; z-index: 20; box-shadow: var(--sh); }
      #nav button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 0 7px; border-radius: 11px; color: var(--mu); font-size: 11px; font-weight: 600; cursor: pointer; transition: .16s; }
      #nav button svg { width: 21px; height: 21px; }
      #nav button.on { color: var(--ac); background: var(--ac-soft); }
      label { display: block; font-size: 12px; color: var(--mu); font-weight: 600; margin: 14px 3px 6px; }
      .in { width: 100%; background: var(--panel2); border: 1px solid var(--hair); border-radius: var(--r2); padding: 12px 13px; color: var(--tx); transition: .15s; }
      .in:focus { border-color: var(--ac); box-shadow: 0 0 0 3px var(--ac-soft); }
      .in::placeholder { color: var(--mu); opacity: .55; }
      textarea.in { min-height: 96px; resize: vertical; line-height: 1.8; }
      .in.ltr { text-align: left; direction: ltr; }
      .sw { position: relative; width: 48px; height: 28px; border-radius: 14px; background: var(--hair2); cursor: pointer; flex: none; transition: .22s; }
      .sw::after { content: ""; position: absolute; top: 3px; right: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: .22s cubic-bezier(.34,1.3,.64,1); box-shadow: 0 2px 5px rgba(0,0,0,.25); }
      .sw.on { background: var(--ac); }
      .sw.on::after { right: 23px; }
      .seg { display: flex; background: var(--panel); border: 1px solid var(--hair); border-radius: 12px; padding: 4px; margin: 16px 0; gap: 4px; }
      .seg button { flex: 1; height: 38px; border-radius: 9px; color: var(--mu); cursor: pointer; font-weight: 600; font-size: 12.5px; transition: .16s; display: flex; align-items: center; justify-content: center; gap: 6px; }
      .seg button svg { width: 16px; height: 16px; }
      .seg button.on { background: var(--ac-soft); color: var(--ac); }
      .item { display: flex; align-items: center; gap: 12px; padding: 13px; background: var(--panel); border: 1px solid var(--hair); border-radius: var(--r); margin-bottom: 8px; cursor: pointer; transition: border-color .14s, transform .14s; }
      .item:active { border-color: var(--ac); transform: scale(.995); }
      .item.static { cursor: default; }
      .item.static:active { transform: none; }
      .item .g { flex: 1; min-width: 0; }
      .item b { display: block; font-weight: 600; }
      .item small { display: block; color: var(--mu); font-size: 12px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .sq { width: 40px; height: 40px; border-radius: 11px; background: var(--panel2); border: 1px solid var(--hair); display: grid; place-items: center; color: var(--ac); flex: none; }
      .badge { font-size: 10.5px; font-weight: 600; padding: 3px 8px; border-radius: 8px; background: var(--panel2); color: var(--mu); border: 1px solid var(--hair); white-space: nowrap; font-family: var(--mono); }
      .badge.url { color: var(--amber); }
      .badge.on { color: var(--ok); }
      .del { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; color: var(--mu); cursor: pointer; flex: none; }
      .del:active { color: var(--red); background: color-mix(in srgb, var(--red) 12%, transparent); }
      .del.on { color: var(--ac); background: var(--ac-soft); }
      .card { background: var(--panel); border: 1px solid var(--hair); border-radius: var(--r); padding: 15px; box-shadow: var(--sh); }
      #scrim { position: fixed; inset: 0; background: rgba(0,0,0,.62); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); z-index: 40; display: none; justify-content: center; align-items: flex-end; }
      #scrim.on { display: flex; }
      .sheet { width: min(var(--maxw), 100vw); max-height: 92vh; background: var(--bg); border: 1px solid var(--hair); border-bottom: 0; border-radius: 20px 20px 0 0; display: flex; flex-direction: column; animation: up .3s cubic-bezier(.2,.8,.2,1); }
      @keyframes up { from { transform: translateY(40px); opacity: 0; } }
      .sh-h { display: flex; align-items: center; justify-content: space-between; padding: 15px 15px; border-bottom: 1px solid var(--hair); font-weight: 700; }
      .sh-b { padding: 15px; overflow: auto; flex: 1; }
      .sh-f { display: flex; gap: 8px; padding: 12px 15px calc(14px + env(safe-area-inset-bottom)); border-top: 1px solid var(--hair); }
      .pfx { display: flex; align-items: center; direction: ltr; background: var(--panel2); border: 1px solid var(--hair); border-radius: var(--r2); padding: 0 13px; }
      .pfx b { color: var(--mu); font-weight: 700; }
      .pfx input { flex: 1; padding: 12px 0; text-align: left; }
      .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 9px; }
      .chips span { font: 500 12px var(--mono); padding: 5px 11px; border-radius: 999px; background: var(--panel); border: 1px solid var(--hair); color: var(--mu); cursor: pointer; }
      .chips span:active { border-color: var(--ac); color: var(--ac); }
      .pv { background: var(--panel); border: 1px solid var(--hair); border-radius: var(--r); padding: 13px; margin-top: 8px; }
      .bub { background: var(--panel2); border-radius: 13px 13px 13px 5px; padding: 10px 13px; white-space: pre-wrap; word-break: break-word; font-size: 13.5px; line-height: 1.8; max-width: 92%; border: 1px solid var(--hair); }
      .bubrow { display: flex; gap: 5px; margin-top: 6px; max-width: 92%; }
      .bubrow i { flex: 1; text-align: center; font-style: normal; background: var(--ac-soft); border: 1px solid var(--hair); border-radius: 9px; padding: 7px; font-size: 12.5px; color: var(--ac); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .brow { background: var(--panel); border: 1px solid var(--hair); border-radius: var(--r); padding: 10px; margin-bottom: 8px; }
      .brow .r { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
      .brow .r .in { flex: 1; min-width: 0; padding: 9px 11px; }
      .brow .r .id { flex: 0 0 80px; font-size: 12px; }
      .btype { display: flex; background: var(--panel2); border: 1px solid var(--hair); border-radius: 9px; padding: 3px; gap: 2px; }
      .btype button { flex: 1; padding: 6px 8px; border-radius: 7px; font-size: 11.5px; font-weight: 600; color: var(--mu); cursor: pointer; }
      .btype button.on { background: var(--ac); color: #04121a; }
      details.med { margin-top: 14px; background: var(--panel); border: 1px solid var(--hair); border-radius: var(--r); padding: 0 14px; }
      details.med summary { list-style: none; cursor: pointer; padding: 14px 0; font-weight: 600; display: flex; align-items: center; gap: 8px; }
      details.med summary::-webkit-details-marker { display: none; }
      details.med[open] { padding-bottom: 14px; }
      details.med[open] summary { border-bottom: 1px solid var(--hair); margin-bottom: 12px; }
      .kw { display: inline-flex; align-items: center; gap: 5px; font: 500 12px var(--mono); padding: 4px 10px; border-radius: 8px; background: var(--ac-soft); color: var(--ac); border: 1px solid var(--hair); }
      .chart { display: flex; align-items: flex-end; gap: 5px; height: 80px; padding-top: 6px; }
      .chart .col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; }
      .chart .cbar { width: 100%; border-radius: 4px 4px 0 0; background: var(--ac); opacity: .85; min-height: 3px; transition: height .3s; }
      .chart .clab { font-size: 10px; color: var(--mu); font-family: var(--mono); }
      .empty { text-align: center; color: var(--mu); padding: 40px 20px; }
      .empty .ic { width: 58px; height: 58px; margin: 0 auto 14px; border-radius: 18px; background: var(--panel); border: 1px dashed var(--hair2); display: grid; place-items: center; color: var(--ac); }
      .empty .ic svg { width: 28px; height: 28px; }
      .empty b { color: var(--tx); font-weight: 600; font-size: 15px; }
      .bar2 { height: 4px; border-radius: 3px; background: var(--panel2); margin-top: 7px; overflow: hidden; }
      .bar2 i { display: block; height: 100%; background: var(--ac); transition: .3s; }
      #toast { position: fixed; top: 14px; left: 50%; transform: translate(-50%,-80px); background: var(--tx); color: var(--bg); padding: 11px 18px; border-radius: 12px; font-weight: 600; font-size: 13.5px; z-index: 99; transition: .3s cubic-bezier(.2,.8,.2,1); max-width: 90%; box-shadow: var(--sh); }
      #toast.on { transform: translate(-50%,0); }
      #toast.err { background: var(--red); color: #fff; }
      #auth { position: fixed; inset: 0; background: var(--bg); z-index: 60; display: none; overflow: auto; padding: max(48px,10vh) 24px 40px; }
      #auth.on { display: block; }
      #auth > div { max-width: 330px; margin: 0 auto; }
      .mark { width: 54px; height: 54px; border-radius: 15px; background: var(--ac); color: #04121a; display: grid; place-items: center; margin-bottom: 24px; }
      .mark svg { width: 30px; height: 30px; stroke-width: 1.9; }
      .word { position: fixed; top: 20px; right: 20px; font: 600 11px var(--mono); letter-spacing: 2px; color: var(--mu); }
      #theme { display: none; }
      .field { margin-bottom: 12px; }
      .err { color: var(--red); font-size: 12px; margin: 6px 3px 0; min-height: 1px; }
      .err.good { color: var(--ok); }

      /* ── رباتیک: هدرِ خط‌کش‌دار ── */
      .panel-h { position: relative; background: var(--panel); border: 1px solid var(--hair); border-radius: var(--r); padding: 18px 16px; margin-bottom: 18px; overflow: hidden; }
      .panel-h::before { content: ""; position: absolute; inset: 0; background: var(--grid); opacity: .5; -webkit-mask-image: linear-gradient(180deg,#000,transparent); mask-image: linear-gradient(180deg,#000,transparent); pointer-events: none; }
      .panel-h > * { position: relative; }
      .panel-h h1 { font-size: 19px; font-weight: 800; line-height: 1.5; }
      .panel-h p { color: var(--mu); font-size: 13px; margin-top: 4px; }
      .panel-h .tag { display: inline-flex; align-items: center; gap: 6px; font: 600 10.5px var(--mono); letter-spacing: 1px; color: var(--ac); background: var(--ac-soft); border: 1px solid var(--hair); padding: 3px 9px; border-radius: 999px; margin-bottom: 12px; }
      .panel-h .btn { margin-top: 14px; }
      .sk { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: -4px -14px 12px; padding: 4px 14px; }
      .sk::-webkit-scrollbar { display: none; }
      .sk .item { flex: 0 0 auto; margin: 0; padding: 9px 12px; border-radius: 11px; gap: 8px; }
      .sk .item b { font-size: 13px; }
      .strip { display: flex; background: var(--panel); border: 1px solid var(--hair); border-radius: var(--r); overflow: hidden; box-shadow: var(--sh); }
      .strip > div { flex: 1; padding: 14px 4px; text-align: center; }
      .strip > div + div { border-inline-start: 1px solid var(--hair); }
      .strip b { display: block; font: 600 19px/1.2 var(--mono); letter-spacing: -.5px; }
      .strip .ac b { color: var(--ac); }
      .strip span { font-size: 10.5px; color: var(--mu); }
      .bot { display: flex; align-items: center; gap: 12px; padding: 14px; background: var(--panel); border: 1px solid var(--hair); border-radius: var(--r); margin-bottom: 9px; cursor: pointer; box-shadow: var(--sh); transition: transform .14s, border-color .14s; }
      .bot:active { transform: scale(.995); border-color: var(--ac); }
      .bot .g { flex: 1; min-width: 0; }
      .bot b { display: block; font-weight: 600; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .bot small { display: block; color: var(--mu); font-size: 12px; margin-top: 2px; font-family: var(--mono); }

      /* ── کارِخانهٔ مراحل ── */
      .steps { display: flex; flex-direction: column; gap: 0; margin-top: 6px; }
      .step { display: flex; gap: 13px; padding: 14px; border: 1px solid var(--hair); background: var(--panel); border-radius: var(--r); margin-bottom: 9px; position: relative; }
      .step .num { width: 30px; height: 30px; border-radius: 9px; background: var(--panel2); border: 1px solid var(--hair2); color: var(--mu); display: grid; place-items: center; font: 600 14px var(--mono); flex: none; }
      .step.done .num { background: var(--ac); color: #04121a; border: 0; }
      .step.act { border-color: var(--ac); box-shadow: 0 0 0 3px var(--ac-soft); }
      .step .c { flex: 1; min-width: 0; }
      .step .c b { font-size: 14px; display: block; }
      .step .c small { display: block; color: var(--mu); font-size: 12.5px; margin-top: 2px; line-height: 1.6; }
      .step .c .in { margin-top: 10px; }
      .step .foot { margin-top: 10px; display: flex; gap: 8px; }

      /* ── شبکهٔ افزونه‌ها ── */
      .plug { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      .plug .p { position: relative; background: var(--panel); border: 1px solid var(--hair); border-radius: var(--r); padding: 13px; cursor: pointer; overflow: hidden; }
      .plug .p:active { border-color: var(--ac); transform: scale(.99); }
      .plug .p .st { position: absolute; top: 11px; left: 11px; width: 7px; height: 7px; border-radius: 50%; background: var(--hair2); }
      .plug .p.on .st { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb,var(--ok) 20%,transparent); }
      .plug .p .sq { margin-bottom: 8px; width: 36px; height: 36px; }
      .plug .p b { font-size: 13.5px; display: block; }
      .plug .p small { display: block; color: var(--mu); font-size: 11.5px; margin-top: 2px; line-height: 1.5; }

      /* ════ نقشهٔ جریان ربات (Flow Map) ════ */
      .flow-toolbar { display: flex; align-items: center; gap: 6px; margin: 8px 2px 12px; }
      .flow-toolbar .tb-title { font-size: 12.5px; color: var(--mu); flex: 1; min-width: 0; }
      .flow-toolbar .tb-title b { color: var(--tx); font-family: var(--mono); }
      .flow-canvas {
        position: relative; overflow: hidden; height: calc(100vh - 250px); height: calc(100dvh - 250px); min-height: 420px; direction: ltr;
        background:
          radial-gradient(circle at 50% 50%, color-mix(in srgb, var(--ac) 5%, transparent) 0%, transparent 60%),
          var(--bg);
        border: 1px solid var(--hair); border-radius: var(--r); touch-action: none; user-select: none; -webkit-user-select: none;
      }
      .flow-canvas::before {
        content: ""; position: absolute; inset: -200px; pointer-events: none; z-index: 0; opacity: .55;
        background-image:
          linear-gradient(90deg, transparent 23px, color-mix(in srgb, var(--hair) 55%, transparent) 23px 24px),
          linear-gradient(0deg,  transparent 23px, color-mix(in srgb, var(--hair) 55%, transparent) 23px 24px);
        background-size: 24px 24px;
        transform: translate(var(--pdx, 0px), var(--pdy, 0px));
      }
      .flow-world {
        position: absolute; inset: 0; transform: translate(var(--pdx,0), var(--pdy,0)) scale(var(--z, 1));
        transform-origin: 0 0; will-change: transform;
      }
      .flow-svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; overflow: visible; }

      const ic = (k) => `<svg viewBox="0 0 24 24">${I[k] || ""}</svg>`;

      let tt;
      function toast(m, e) { const t = $("toast"); t.textContent = m; t.className = "on" + (e ? " err" : ""); clearTimeout(tt); tt = setTimeout(() => (t.className = ""), 2600); hap(e ? "error" : "success"); }

      /* تأیید مخرب: Telegram WebApp روی iOS پنجرهٔ confirm مرورگر را بلوکه می‌کند و

      const sure = (m, f, okTxt, noTxt) => openConfirm(m, f, okTxt, noTxt);

        sc.classList.add("on");
        const ok = $("cfOk"); if (ok) ok.onclick = () => { closeConfirm(); try { f && f(); } catch (e) { console.error(e); } };
      }

      async function api(p, o = {}) {
        const h = { "Content-Type": "application/json" };
        if (initData) h["X-Init-Data"] = initData;
        if (token) h.Authorization = "Bearer " + token;

        const d = await r.json().catch(() => ({}));

        return d;
      }
      const guard = (f) => async (...a) => { try { return await f(...a); } catch (e) { toast(e.message, 1); } };
      const devId = () => localStorage.device_id || (localStorage.device_id = "dev_" + Date.now() + "_" + Math.random().toString(36).slice(2, 11));

      }
      function toggleTheme() { applyTheme(document.documentElement.getAttribute("data-theme") === "light" ? "dark" : "light"); hap("light"); }

      /* ── احراز هویت ── */
      let reg = {};
      function showAuth(step = "login") {
        $("auth").classList.add("on"); $("nav").style.display = "none"; $("fab").classList.add("hide");
        const B = $("authbox"); const head = `<div class="word">BOTSAZ</div><div class="mark">${ic("logo")}</div>`;
        if (step === "login") B.innerHTML = head + `<h1 style="font-size:22px;font-weight:800">ورود به استودیو</h1><p style="color:var(--mu);margin:6px 0 24px">وارد شو و ربات‌هایت را مدیریت کن.</p><div class="field"><label>نام کاربری</label><input class="in ltr" id="lu" placeholder="username" autocomplete="username"></div><div class="field"><label>رمز عبور</label><div style="position:relative"><input class="in ltr" id="lp" type="password" placeholder="••••••••" autocomplete="current-password" style="padding-left:46px"><span class="del" onclick="pwEye(this)" style="position:absolute;left:6px;top:50%;transform:translateY(-50%)">${ic("eye")}</span></div></div><button class="btn" onclick="doLogin()">ورود</button><button class="btn line" style="margin-top:9px" onclick="showAuth('reg1')">ساخت حساب جدید</button>`;
        else if (step === "reg1") B.innerHTML = head + `<h1 style="font-size:22px;font-weight:800">ثبت‌نام</h1><p style="color:var(--mu);margin:6px 0 24px">آیدی تلگرامت را بده تا کد تأیید بفرستیم.</p><div class="field"><label>آیدی تلگرام</label><input class="in ltr" id="tu" placeholder="@username" value="${esc(reg.tu || "")}"></div><button class="btn" onclick="sendCode()">ارسال کد تأیید</button><button class="btn line" style="margin-top:9px" onclick="showAuth()">بازگشت به ورود</button>`;
        else if (step === "reg2") B.innerHTML = head + `<h1 style="font-size:22px;font-weight:800">تکمیل حساب</h1><p style="color:var(--mu);margin:6px 0 24px">کد ۶ رقمی برای <b dir="ltr">${esc(reg.tu || "")}</b> ارسال شد.</p><div class="field"><label>کد تأیید</label><input class="in" id="rc" inputmode="numeric" maxlength="6" placeholder="000000" style="text-align:center;letter-spacing:10px;direction:ltr;font-family:var(--mono)"></div><div class="field"><label>نام کاربری</label><input class="in ltr" id="ru" placeholder="username"></div><div class="field"><label>رمز عبور</label><input class="in ltr" id="rp" type="password" placeholder="حداقل ۶ کاراکتر" oninput="pwbar(this.value)"><div class="bar2" id="pwBar" style="display:none"><i style="width:0"></i></div></div>${ref ? `<p style="color:var(--mu);font-size:13px;margin:-2px 2px 14px">کد دعوت: <b class="mono">${esc(ref)}</b></p>` : ""}<button class="btn" onclick="doReg()">ساخت حساب</button><button class="btn line" style="margin-top:9px" onclick="sendCode()">ارسال دوباره کد</button>`;
      }
      function pwEye(el) { const i = el.parentElement.querySelector("input"); i.type = i.type === "password" ? "text" : "password"; el.style.color = i.type === "text" ? "var(--ac)" : "var(--mu)"; }
      function pwbar(v) { const bar = $("pwBar"); if (!bar) return; bar.style.display = v ? "block" : "none"; let s = (v.length >= 6 ? 40 : 0) + (v.length >= 10 ? 30 : 0) + (/[0-9]/.test(v) ? 15 : 0) + (/[^A-Za-z0-9]/.test(v) ? 15 : 0); const f = bar.firstElementChild; f.style.width = Math.min(100, s) + "%"; f.style.background = s < 45 ? "var(--red)" : s < 75 ? "var(--amber)" : "var(--ok)"; }
      const doLogin = guard(async () => { const u = $("lu").value.trim(), p = $("lp").value; if (!u || !p) return toast("نام کاربری و رمز را وارد کن", 1); token = (await api("/api/auth/login", { method: "POST", body: { username: u, password: p } })).token; localStorage.authToken = token; boot(true); });
      const sendCode = guard(async () => { const u = ($("tu")?.value || reg.tu || "").trim(); if (u.length < 3) return toast("آیدی تلگرام را درست وارد کن", 1); reg.tu = u; await api("/api/auth/send-code", { method: "POST", body: { telegram_username: u, device_id: devId() } }); toast("کد ارسال شد — تلگرام را چک کن"); showAuth("reg2"); });
      const doReg = guard(async () => { const code = $("rc").value.trim(), username = $("ru").value.trim().toLowerCase(), password = $("rp").value; if (code.length !== 6) return toast("کد باید ۶ رقم باشد", 1); if (username.length < 3) return toast("نام کاربری کوتاه است", 1); if (password.length < 6) return toast("رمز عبور کوتاه است", 1); const d = await api("/api/auth/register", { method: "POST", body: { telegram_username: reg.tu, username, password, verification_code: code, referral_code: ref || null, device_id: devId() } }); token = d.token; localStorage.authToken = token; localStorage.removeItem("pending_referral"); toast(d.message || "ثبت‌نام موفق"); boot(true); });
      function logout() { sure("از حساب خارج می‌شوی؟", async () => { try { token && (await fetch(API + "/api/auth/logout", { method: "POST", headers: { Authorization: "Bearer " + token } })); } catch (e) {} token = ""; user = null; localStorage.removeItem("authToken"); showAuth(); }); }

      /* ── ناوبری جدید: خانه(ساخت) · توسعه · پروفایل ── */
      const TABS = [["home", "خانه", "home"], ["dev", "توسعه", "dev"], ["studio", "نقشه", "map"], ["me", "پروفایل", "user"]];
      function chrome(v) {
        $("auth").classList.remove("on"); $("nav").style.display = "flex";
        $("nav").innerHTML = TABS.map(([k, t, i]) => `<button class="${v === k ? "on" : ""}" onclick="go('${k}')">${ic(i)}${t}</button>`).join("");

      const S = (k) => bots.reduce((t, b) => t + (b.stats?.[k] || 0), 0);
      const empty = (t, s, btn, icon) => `<div class="empty"><div class="ic">${ic(icon || "bot")}</div><b>${t}</b><div style="margin-top:5px">${s}</div>${btn ? `<div style="margin-top:18px">${btn}</div>` : ""}</div>`;

      /* ════ خانه = مسیر آموزشیِ ساخت و فعال‌سازی (Wizard) ════ */

      const vHome = guard(async () => {

        const connected = bots.length > 0;
        const active = bots.some((b) => b.is_running);

        app().className = "";

          <div class="steps">

              <small>${connected ? `@${esc(bots[0].bot_username)} — ${n(bots.length)} ربات فعال در استودیو.` : "توکن ربات را از @BotFather بگیر و همین‌جا وصلش کن."}</small>
              ${connected ? "" : `<div class="in pfx" style="margin-top:10px"><b>@</b><input class="mono ltr" id="tk" placeholder="123456789:AAH…" oninput="th()"></div><div class="err" id="tke"></div><div class="foot"><button class="btn" style="height:42px" id="mk" onclick="mkBot()">${ic("bolt")} اتصال و ساخت</button></div>`}
              </div>

            <div class="step ${connected && !active ? "act" : connected ? "done" : ""}" id="s2">

              ${connected ? `<div class="foot"><button class="btn line" style="height:40px" onclick="quickToggle()">${active ? ic("power") + " خاموش/روشن" : ic("bolt") + " روشن کردن"}</button></div>` : ""}

        app().innerHTML =
          `<div class="panel-h"><span class="tag">● STATION ONLINE</span><h1>ربات تلگرامت را بساز و فعال کن</h1><p>در چهار گام ساده: اتصال، روشن‌کردن، دستورها، افزونه‌ها.</p>${active ? `<button class="btn line" style="margin-top:14px" onclick="go('bot','${bots[0].bot_id}')">${ic("open")} مدیریت ربات</button>` : ""}</div>
           <h2>گام‌های راه‌اندازی</h2>${steps}`;
        requestAnimationFrame(() => app().classList.add("fade"));
      });
      function th() { const v = $("tk").value.trim(), e = $("tke"); if (!v) return (e.textContent = ""); const ok = TOKEN.test(v); e.className = "err" + (ok ? " good" : ""); e.textContent = ok ? "✓ فرمت توکن معتبر است" : "فرمت توکن درست نیست"; }
      const mkBot = guard(async () => { const t = $("tk").value.trim(); if (!TOKEN.test(t)) return toast("توکن نامعتبر است", 1); const b = $("mk"); b.disabled = true; b.textContent = "در حال ساخت…"; try { const r = await api("/api/bots", { method: "POST", body: { token: t } }); toast(r.message || "ربات ساخته شد"); botId = r.bot.bot_id; go("bot", botId); } finally { if ($("mk")) (($("mk").disabled = false), ($("mk").innerHTML = ic("bolt") + " اتصال و ساخت")); } });
      const quickToggle = guard(async () => { const on = !bots[0].is_running; const r = await api(`/api/bots/${bots[0].bot_id}/toggle`, { method: "PATCH", body: { active: on } }); bots[0].is_running = r.is_running; toast(r.is_running ? "ربات روشن شد" : "ربات خاموش شد"); vHome(); });

      /* ════ توسعه = مدیریت ربات‌ها (گرافیکی) ════ */
      const botCard = (b) => `<div class="bot" onclick="go('bot','${b.bot_id}')"><span class="av2 grad">${esc((b.bot_username || "?").slice(0, 1).toUpperCase())}<i class="live ${b.is_running ? "on" : ""}"></i></span><div class="g"><b class="mono">@${esc(b.bot_username || "—")}</b><small>${n(b.stats?.unique_users)} user · ${n(b.stats?.messages_received)} msg</small></div><span class="pill ${b.is_running ? "on" : "off"}">${b.is_running ? "ON" : "OFF"}</span></div>`;
      const vDev = guard(async () => {
        ({ bots } = await api("/api/bots"));
        app().className = "fade";
        if (!bots.length) { app().innerHTML = `<div class="bar"><b style="font-size:20px">توسعهٔ ربات</b></div>` + empty("رباتی نداری", "برای مدیریت و افزودن قابلیت، اول یک ربات بساز.", `<button class="btn sm" style="max-width:220px" onclick="go('home')">${ic("plus")} ساخت ربات</button>`); return; }

           <div class="strip"><div class="ac"><b>${n(S("unique_users"))}</b><span>کل کاربران</span></div><div><b>${n(bots.length)}</b><span>ربات</span></div><div><b>${n(active)}</b><span>فعال</span></div></div>
           <h2>ربات‌ها</h2>` + bots.map(botCard).join("");

      /* ════ جزئیات/مدیریت یک ربات ════ */
      const vBot = guard(async (id) => {
        if (id) { botId = id; /* اگر قبلاً setTab فراخوانده شده باشد، آن را نگه می‌داریم */ }
        bot = (await api("/api/bots/" + botId)).bot;

      function openCfg(key, title, ph, val) {

      /* ── قوانین کلیدواژه (منطق دست‌نخورده) ── */
      function ruleRow(r, i) { const kws = (r.keywords || []).slice(0, 3).map((k) => `<span class="kw">${esc(k)}</span>`).join(" "); const more = (r.keywords || []).length - 3;
        return `<div class="item" onclick="openRule(${i})"><span class="sq">${ic("msg")}</span><div class="g"><b>${kws}${more > 0 ? `<span class="kw">+${n(more)}</span>` : ""}</b><small>${esc((r.response || "").slice(0, 44).replace(/\n/g, " ")) || "فقط رسانه"}</small></div><span class="badge">${({ exact: "دقیق", contains: "شامل", regex: "الگو" })[r.mode] || "شامل"}</span><span class="del" onclick="event.stopPropagation();delRule('${esc(r.id)}')">${ic("trash")}</span></div>`; }
      const delRule = (id) => sure("این قانون حذف شود؟", guard(async () => { rules = (await api(`/api/bots/${botId}/rules/${id}`, { method: "DELETE" })).rules; toast("حذف شد"); tPlug(); }));
      function openRule(i) {
        const r = i < 0 ? {} : rules[i];
        rd = { id: r.id || "", keywords: (r.keywords || []).join(", "), mode: r.mode || "contains", response: r.response || "", m: r.media ? { ...r.media } : { type: "photo", url: "" } };

      const MT = { photo: "تصویر", video: "ویدیو", audio: "صوت", animation: "انیمیشن", document: "فایل" };
      function rulePrev() { const p = $("rpv"); if (!p) return; const kw = rd.keywords.split(",").map((x) => x.trim()).filter(Boolean); p.innerHTML = (rd.m.url ? `<div style="color:var(--mu);font-size:11.5px;margin-bottom:6px">${ic("image")} ${MT[rd.m.type]}</div>` : "") + `<div class="bub">${esc(rd.response) || '<span style="color:var(--mu)">پاسخ…</span>'}</div>` + (kw.length ? `<div style="color:var(--mu);font-size:12px;margin-top:8px">🔑 با پیام‌هایی که ${kw.map((k) => `<span class="kw">${esc(k)}</span>`).join(" ")} دارند جواب می‌دهد</div>` : ""); }
      function drawRule() {
        const top = $("shb")?.scrollTop || 0; const m = rd.m;
        $("sheet").innerHTML = `<div class="sh-h"><span>${rd.id ? "ویرایش قانون" : "قانون جدید"}</span><div class="ib" onclick="closeSheet()">${ic("x")}</div></div>
          <div class="sh-b" id="shb">
            <label>کلیدواژه‌ها (با ویرگول جدا کن)</label><input class="in" placeholder="قیمت, هزینه, تعرفه" value="${esc(rd.keywords)}" oninput="rd.keywords=this.value;rulePrev()">
            <label>نوع تطبیق</label><div class="btype" style="max-width:240px">${[["contains", "شامل"], ["exact", "دقیق"], ["regex", "الگو"]].map(([k, t]) => `<button class="${rd.mode === k ? "on" : ""}" onclick="rd.mode='${k}';drawRule()">${t}</button>`).join("")}</div>
            <label>متن پاسخ</label><textarea class="in" oninput="rd.response=this.value;rulePrev()">${esc(rd.response)}</textarea>
            <label>پیش‌نمایش</label><div class="pv" id="rpv"></div>
            <details class="med" ${m.url ? "open" : ""}><summary>${ic("image")} رسانه (اختیاری)</summary><div style="display:flex;gap:6px;margin-bottom:8px"><select class="in" style="flex:0 0 96px" onchange="rd.m.type=this.value;rulePrev()">${Object.entries(MT).map(([k, t]) => `<option value="${k}" ${m.type === k ? "selected" : ""}>${t}</option>`).join("")}</select><input class="in mono ltr" placeholder="https://…" value="${esc(m.url)}" oninput="rd.m.url=this.value;rulePrev()"></div><input type="file" id="rmf" hidden onchange="upRule(this.files[0])"><button class="btn line sm" onclick="$('rmf').click()">آپلود فایل</button></details>
          </div>
          <div class="sh-f"><button class="btn" onclick="saveRule()">ذخیره قانون</button></div>`;
        rulePrev(); $("shb").scrollTop = top;
      }
      const upRule = guard(async (f) => { if (!f) return; toast("در حال آپلود…"); const u = await _upload(f); rd.m = { type: u.type, url: u.url }; drawRule(); toast("آپلود شد"); });
      const saveRule = guard(async () => {
        const keywords = rd.keywords.split(",").map((x) => x.trim()).filter(Boolean);
        if (!keywords.length) return toast("حداقل یک کلیدواژه بنویس", 1);
        const u = (rd.m.url || "").trim();
        const body = { id: rd.id, keywords, mode: rd.mode, response: rd.response.trim(), media: /^https?:\/\//.test(u) ? { type: rd.m.type, url: u } : null };
        rules = (await api(`/api/bots/${botId}/rules`, { method: "PUT", body })).rules;
        toast("قانون ذخیره شد"); closeSheet(); tPlug();
      });
      const cfgSave = guard(async (key, el) => { const v = $(el).value.trim(); const r = await api(`/api/bots/${botId}/config`, { method: "PATCH", body: { [key]: v } }); bot[key] = r[key]; toast("ذخیره شد"); });
      const setCfg = guard(async (key, val) => { const r = await api(`/api/bots/${botId}/config`, { method: "PATCH", body: { [key]: val } }); bot[key] = r[key]; toast("ذخیره شد"); if (key === "auto_menu" && val) { try { await api(`/api/bots/${botId}/sync-menu`, { method: "POST" }); toast("منو همگام شد"); } catch (e) {} } tCmds(); setTab("plug"); });
      const fjOn = () => { $("sheet").innerHTML = `<div class="sh-h"><span>عضویت اجباری</span><div class="ib" onclick="closeSheet()">${ic("x")}</div></div><div class="sh-b"><label>آیدی کانال</label><input class="in ltr" id="fj" placeholder="@channel" style="direction:ltr"></div><div class="sh-f"><button class="btn" onclick="fjSave()">فعال کردن</button></div>`; $("scrim").classList.add("on"); };
      const fjOff = () => sure("عضویت اجباری غیرفعال شود؟", guard(async () => { await api(`/api/bots/${botId}/force-join`, { method: "PATCH", body: { channel: "" } }); bot.force_join_channel = ""; toast("غیرفعال شد"); tPlug(); }));
      const fjSave = guard(async () => { let c = $("fj").value.trim(); if (!c) return toast("آیدی کانال را وارد کن", 1); if (!/^[@\-0-9]/.test(c)) c = "@" + c; await api(`/api/bots/${botId}/force-join`, { method: "PATCH", body: { channel: c } }); bot.force_join_channel = c; closeSheet(); toast("فعال شد"); tPlug(); });
      const bcast = guard(async () => { const t = $("bc").value.trim(); if (!t) return toast("متن خالی است", 1); if (!bot.is_running) return toast("اول ربات را روشن کن", 1); sure(`به ${n(bot.stats?.unique_users)} کاربر ارسال شود؟`, guard(async () => { const r = await api(`/api/bots/${botId}/broadcast`, { method: "POST", body: { text: t } }); toast(r.message || "در صف ارسال"); closeSheet(); })); });

      /* ══════════════════════════════════════════════════════════════════
         استودیوی جریان (Flow Studio) — بخش تمام‌صفحه و مستقل
         قرارداد: مبدأ سیم = کارتِ پیام‌دهنده، مقصد = محتوای همان پیام
                  (دکمهٔ پاسخ / پیوند / رسانه / گروه).
         داده روی سرور ذخیره می‌شود: GET|PUT /api/bots/<id>/flow
         ══════════════════════════════════════════════════════════════════ */
      const ST_LIM = { nodes: 400, edges: 800, label: 64, text: 4000, url: 500, kw: 20 };
      const ST_KIND = {
        cmd:     { t: "دستور",   ic: "code",  d: "ورودی ربات مثل ‎/start" },
        reply:   { t: "پاسخ",    ic: "msg",   d: "متن و دکمهٔ پیام" },
        group:   { t: "گروه",    ic: "folder", d: "دستهٔ دکمه‌ها و پیوندها" },
        image:   { t: "رسانه",   ic: "image", d: "عکس، ویدیو، صوت، فایل" },
        link:    { t: "پیوند",   ic: "link",  d: "دکمهٔ لینک‌دار" },
        ticket:  { t: "تیکت",    ic: "ticket", d: "دریافت پیام کاربر و alert ادمین" },
        trigger: { t: "کلیدواژه", ic: "spark", d: "پاسخ خودکار به متن کاربر" },
        condition: { t: "شرط",   ic: "branch", d: "مسیر را بر اساس متغیر دو شاخه کن" },
        setvar:  { t: "متغیر",   ic: "var",   d: "روی کاربر یک مقدار ذخیره/تغییر بده" },
      };
      const ST_SEND = { cmd: 1, reply: 1, group: 1, ticket: 1, trigger: 1, condition: 1, setvar: 1 };
      const ST_RECV = { cmd: 1, reply: 1, group: 1, image: 1, link: 1, ticket: 1, trigger: 1, condition: 1, setvar: 1 };
      const VAR_OPS = { eq: "برابر با", neq: "نابرابر با", contains: "شامل", gt: "بزرگ‌تر از", lt: "کوچک‌تر از", exists: "تعریف‌شده", nexists: "تعریف‌نشده" };
      const SET_OPS = { set: "قرار بده", inc: "افزایش بده", dec: "کاهش بده", append: "بچسبان" };
      const isGroup = (nd) => !!nd && nd.kind === "reply" && nd.role === "group";
      const canSend = (nd) => !!nd && (ST_SEND[nd.kind] || isGroup(nd) ? 1 : 0);
      /* گروه هم مبدأ است هم مقصد: به پیام والد وصل می‌شود و عضوهایش را باز می‌کند */
      const canRecv = (nd) => !!nd && ST_RECV[nd.kind] ? 1 : 0;

      let STG = { nodes: [], edges: [], view: { x: 0, y: 0, z: 1 } };   /* هرگز null نمی‌شود */
      let st = { mode: "link", sel: [], hist: [], redo: [], dirty: false, derived: false, timer: 0, ps: null, act: null, pinch: null, editing: null, testIn: "", testCb: "", testHtml: "", saved: "", autosave: true, vdirty: true, pendingParent: null, impJson: "", offline: false, recover: null, mirrorCount: 0 };
      let stIssues = [];
      const stCur = () => STG && st.sel.length === 1 ? STG.nodes.find((n) => n.id === st.sel[0]) : null;
      const nid = () => "n" + Date.now().toString(36).slice(-5) + Math.random().toString(36).slice(2, 5);
      /* تا نقشهٔ محلیِ کامل‌تر (که هنوز روی سرور نرفته) بی‌خبر بازنویسی نشود */
      const stMirror = () => { if (st.recover) return; try { localStorage.setItem("gs_flow_" + botId, JSON.stringify(STG)); } catch (e) {} };
      /* نسخهٔ امنِ هر نقشهٔ جایگزین‌شده */
      const stBak = (g) => { try { if (g && g.nodes && g.nodes.length) localStorage.setItem("gs_flowbak_" + botId, JSON.stringify(g)); } catch (e) {} };
      const stView = (v) => ({ x: Math.round(+(v && v.x) || 0), y: Math.round(+(v && v.y) || 0), z: Math.min(2.4, Math.max(0.35, +(v && v.z) || 1)) });
      /* شناسه باید با قانون سرور بخواند: [A-Za-z0-9_-]{2,24} */
      const stSid = (raw) => {
        let id = String(raw || "").replace(/[^A-Za-z0-9_-]/g, "").slice(0, 24);
        if (id.length < 2) id = "n" + Date.now().toString(36).slice(-6);
        return id;
      };
      const normGraph = (raw) => {
        const g = { nodes: [], edges: [], view: { x: 0, y: 0, z: 1 } };
        const seen = new Set(), map = {};
        for (const nd of (raw && raw.nodes) || []) {
          if (!nd || !nd.id) continue;
          let kind = nd.kind === "reply" && nd.role === "group" ? "group" : nd.kind;
          if (!ST_KIND[kind]) continue;
          let id = stSid(nd.id);
          while (seen.has(id)) id = stSid(id.slice(0, 20) + Math.random().toString(36).slice(2, 5));
          seen.add(id); map[String(nd.id)] = id;
          const c = { id, kind, x: Math.round(+nd.x || 0), y: Math.round(+nd.y || 0) };
          ["name", "description", "text", "caption", "label", "url", "mediaType", "mode", "role", "var", "op", "value"].forEach((k) => { if (nd[k] != null) c[k] = nd[k]; });
          if (Array.isArray(nd.keywords)) c.keywords = nd.keywords.map(String);
          if (Array.isArray(nd.words)) c.words = nd.words.map(String);
          if (kind === "group") { c.kind = "reply"; c.role = "group"; }
          g.nodes.push(c);
        }
        const eset = new Set();
        for (const e of (raw && raw.edges) || []) {
          if (!e) continue;
          const f = map[String(e.from)], t = map[String(e.to)];
          if (!f || !t || f === t) continue;
          const k = f + "\u0000" + t;
          if (eset.has(k)) continue;
          eset.add(k);
          g.edges.push({ from: f, to: t });
        }
        if (raw && raw.view) g.view = stView(raw.view);
        return g;
      };
      const stPos = () => {
        const c = $("fc"), z = STG.view.z || 1;
        const w = c ? (c.clientWidth / 2 - STG.view.x) / z : 120, h = c ? (c.clientHeight / 2 - STG.view.y) / z : 120;
        return { x: Math.round(w - 100 + (STG.nodes.length % 5) * 22), y: Math.round(h - 40 + (STG.nodes.length % 7) * 18) };
      };
      const stAddNode = (kind, at) => {
        const p = at || stPos();
        const nd = { id: nid(), kind, x: p.x, y: p.y };

      }
      const stTitle = (nd) => nd.kind === "cmd" ? "/" + (nd.name || "…") : (nd.label || nd.text || (nd.kind === "image" ? "رسانه" : nd.kind === "link" ? "پیوند" : (nd.kind === "condition" || nd.kind === "setvar") ? (nd.var ? "⚙ " + nd.var : (nd.kind === "condition" ? "شرط" : "متغیر")) : "کارت"));
      function stSetVal(el, key, v) { const e = $(el); if (e) e.value = v; st.editing.nd[key] = v; }
      function stUpdPrev() {
        const E = st.editing; if (!E) return;
        const nd = E.nd;
        const p = $("ePv"); if (!p) return;
        const parent = E.isNew ? st.pendingParent : null;
        const btns = E.isNew ? (parent ? outOf(parent) : []) : outOf(nd.id);
        const cb = btns.filter((x) => x.kind !== "link" && x.kind !== "image");
        const ur = btns.filter((x) => x.kind === "link");
        const md = btns.find((x) => x.kind === "image");
        p.innerHTML = (md ? `<div style="color:var(--mu);font-size:11.5px;margin-bottom:6px">${ic("image")} ${({ photo: "تصویر", video: "ویدیو", audio: "صوت", animation: "انیمیشن", document: "فایل" })[md.mediaType] || "رسانه"}</div>` : "") +
          `<div class="bub">${esc(nd.text || nd.caption || nd.label || "") || '<span style="color:var(--mu)">بی‌متن…</span>'}</div>` +
          (cb.length ? `<div class="bubrow">${cb.map((x) => `<i>${esc(x.label || x.name || x.text || "ادامه")}</i>`).join("")}</div>` : "") +
          ur.map((x) => `<div class="bubrow"><i style="border-color:color-mix(in srgb,var(--amber) 40%,transparent);color:var(--amber)">🔗 ${esc(x.text || "پیوند")}</i></div>`).join("") +
          (nd.kind === "trigger" ? `<div style="color:var(--mu);font-size:12px;margin-top:8px">🔑 با ${(nd.keywords || []).map((k) => `<span class="kw">${esc(k)}</span>`).join(" ") || "—"} فعال می‌شود</div>` : "") +
          (nd.kind === "ticket" && (nd.words || []).length ? `<div style="color:var(--mu);font-size:12px;margin-top:8px">🔒 فقط پیام‌هایی که با ${(nd.words || []).map((w) => `<span class="kw">${esc(w)}</span>`).join(" ")} شروع شوند ثبت می‌شوند</div>` : "") +
          (nd.kind === "condition" ? `<div style="color:var(--mu);font-size:12px;margin-top:8px">🔀 اگر <span class="kw">${esc(nd.var || "…")}</span> ${esc(VAR_OPS[nd.op] || "")} ${esc(nd.value || "")} → مسیر بله، وگرنه مسیر خیر</div>` : "") +
          (nd.kind === "setvar" ? `<div style="color:var(--mu);font-size:12px;margin-top:8px">⚙ ${esc(SET_OPS[nd.op] || "")} <span class="kw">${esc(nd.var || "…")}</span> = ${esc(nd.value || "")} و بی‌صدا ادامه می‌دهد</div>` : "");
      }
      function stImgPrev() { const e = $("ePrev"), nd = st.editing.nd; const u = nd.url || ""; if (e) e.innerHTML = /^https?:\/\//.test(u) ? (nd.mediaType === "photo" ? `<div style="margin-top:12px"><img src="${esc(u)}" style="max-width:100%;border-radius:12px;border:1px solid var(--hair)" onerror="this.replaceWith(Object.assign(document.createElement('i'),{textContent:'پیش‌نمایش در دسترس نیست',style:'color:var(--mu);font-size:12px'}))"/></div>` : `<div style="color:var(--mu);font-size:12px;margin-top:10px">${ic("link")} <span class="mono ltr">${esc(u.slice(0, 70))}</span></div>`) : ""; }
      const stUpFile = guard(async (f) => { if (!f) return; toast("در حال آپلود…"); const d = await _upload(f); st.editing.nd.url = d.url; st.editing.nd.mediaType = d.type; stDrawEdit(); toast("آپلود شد"); });
      function stQuickAdd(fromId) {
        const host = $("sheet");
        const src = nSt(fromId);
        const list = Object.entries(ST_KIND).filter(([k]) => !isGroup(src) || k !== "group");
        host.querySelector(".sh-b").innerHTML = `<p style="color:var(--mu);font-size:13px;margin-bottom:12px">چه چیزی به پیام «${esc(stTitle(src))}» اضافه شود؟</p>
          <div class="qa">${list.map(([k, v]) => `<button data-q="${k}">${ic(v.ic)}<span><b>${v.t}</b><small>${v.d}</small></span></button>`).join("")}</div>`;
        host.querySelector(".sh-f").innerHTML = `<button class="btn line" onclick="stDrawEdit()">بازگشت</button>`;
        host.querySelectorAll("[data-q]").forEach((b) => { b.onclick = () => { hap("light"); st.pendingParent = fromId; stEdit(null, b.dataset.q, fromId); }; });
      }
      function stUnlink(a, b) {
        stDirty(1);
        STG.edges = STG.edges.filter((e) => !(e.from === a && e.to === b));
        stRender(); if (st.editing) stDrawEdit(); toast("اتصال حذف شد");
      }
      function stCloseEditThen(id) { closeSheet(); setTimeout(() => stEdit(id), 140); }
      function stSaveEdit() {
        const E = st.editing; if (!E) return;
        const nd = JSON.parse(JSON.stringify(E.nd));
        if (nd.kind === "cmd") {
          nd.name = (nd.name || "").trim().toLowerCase().replace(/^\//, "").replace(/\s+/g, "_").replace(/[^a-z0-9_]/g, "").slice(0, 32);
          if (!nd.name) return toast("نام دستور را بنویس", 1);
          if (STG.nodes.some((x) => x.kind === "cmd" && x.name === nd.name && x.id !== nd.id)) return toast(`دستور /${nd.name} تکراری است`, 1);
        }
        if (nd.kind === "link") {
          if (!(nd.text || "").trim()) return toast("متن دکمه را بنویس", 1);
          let u = (nd.url || "").trim(); if (!u) return toast("آدرس را بنویس", 1);
          if (!/^https?:\/\//.test(u)) u = "https://" + u;
          nd.url = u.slice(0, 500);
        }
        if (nd.kind === "image") {
          let u = (nd.url || "").trim(); if (!/^https?:\/\//.test(u)) return toast("فایل را آپلود کن یا آدرس معتبر بده", 1);
          nd.url = u.slice(0, 500);
        }
        if (nd.kind === "trigger") {
          nd.keywords = (nd.keywords || []).map((k) => String(k).trim().slice(0, 60)).filter(Boolean).slice(0, ST_LIM.kw);
          if (!nd.keywords.length) return toast("حداقل یک کلیدواژه بنویس", 1);
        }
        if (nd.kind === "ticket") nd.words = (nd.words || []).map((w) => String(w).trim().slice(0, 30)).filter(Boolean).slice(0, 12);
        if (nd.kind === "condition" || nd.kind === "setvar") {
          nd.var = (nd.var || "").trim().replace(/[^A-Za-z0-9_.]/g, "").slice(0, 40);
          if (!nd.var) return toast("نام متغیر را بنویس", 1);
          nd.value = String(nd.value || "").slice(0, 200);
          nd.label = (nd.label || "").slice(0, ST_LIM.label);
        }
        if (nd.kind === "reply" && nd.role !== "group" && (nd.label || "").length > ST_LIM.label) return toast("برچسب دکمه بیش از ۶۴ نویسه", 1);
        if ((nd.text || "").length > ST_LIM.text) return toast("متن بیش از ۴۰۰۰ نویسه است", 1);
        const parent = E.isNew ? st.pendingParent : null;
        if (parent && nSt(parent) && nd.kind === "image" && outOf(parent).some((x) => x.kind === "image")) { st.pendingParent = null; return toast("روی پیام «" + stTitle(nSt(parent)) + "» یک رسانه هست", 1); }
        stDirty(3);
        if (E.isNew) {
          nd.id = nid(); STG.nodes.push(nd);
          if (parent && nSt(parent)) STG.edges.push({ from: parent, to: nd.id });
          st.pendingParent = null;
          st.sel = [nd.id];
        } else {
          const t = nSt(nd.id); if (!t) return;
          Object.keys(nd).forEach((k) => { t[k] = nd[k]; });
          Object.keys(t).forEach((k) => { if (!(k in nd)) delete t[k]; });
        }
        st.editing = null;
        closeSheet(); st.vdirty = true; stRender(); hap("success");
        toast(E.isNew ? "کارت ساخته و وصل شد" : "ذخیره شد");
        if (E.isNew && !parent && !canSend(nd)) toast("حالا از نقطهٔ سبزِ یک کارت به این کارت سیم بکش");
      }
      function stDelFromEdit(id) { st.sel = [id]; st.editing = null; closeSheet(); stDelSel(); }

      /* ── آزمون زنده ── */
      function stTest() {
        const cmdsAvail = STG.nodes.filter((n) => n.kind === "cmd").slice(0, 6);
        $("sheet").innerHTML = `<div class="sh-h"><span>آزمون نقشه</span><div class="ib" onclick="closeSheet()">${ic("x")}</div></div>
          <div class="sh-b">
            <label>چیزی که کاربر می‌فرستد</label>
            <div style="display:flex;gap:6px"><input class="in ltr" id="stIn" value="${esc(st.testIn)}" placeholder="/start یا یک متن" oninput="st.testIn=this.value"><div class="ib" style="width:44px" onclick="stRunTest()">${ic("play")}</div></div>
            <div class="chips" style="margin-top:9px">${cmdsAvail.map((n) => `<span onclick="st.testIn='/'+this.textContent.slice(1);stRunTest()">${"/" + esc(n.name)}</span>`).join("")}${st.testCb ? `<span onclick="stRunTest('cb')">تکرار آخرین دکمه</span>` : ""}</div>
            <div id="stOut" style="margin-top:14px">${st.testHtml || `<p style="color:var(--mu);font-size:12.5px">همین نقشهٔ ذخیره‌نشده روی سرور اجرا می‌شود و دقیقاً همان پیامی که کاربر می‌گیرد را نشان می‌دهد. روی دکمهٔ نتیجه بزن تا مسیر ادامه را ببینی.</p>`}</div>
          </div>`;
        $("scrim").classList.add("on");
      }
      /* شبیه‌ساز محلی موتور (برای حالت سازگار) — هم‌راستا با Flow.render/parts/match_keyword */
      /* حالت آفلاین: شبیه‌سازی سبک شرط/متغیر با یک انبار محلی فقط برای تست */
      const stLocalVars = () => (st.testVars || (st.testVars = {}));
      function stEvalCond(nd) {
        const v = stLocalVars()[nd.var], val = nd.value;
        switch (nd.op) {
          case "exists": return v !== undefined;
          case "nexists": return v === undefined;
          case "contains": return String(v ?? "").includes(String(val ?? ""));
          case "gt": return (+v || 0) > (+val || 0);
          case "lt": return (+v || 0) < (+val || 0);
          case "neq": return String(v ?? "") !== String(val ?? "");
          default: return String(v ?? "") === String(val ?? "");
        }
      }
      function stApplySet(nd) {
        const vars = stLocalVars(); const cur = vars[nd.var];
        if (nd.op === "inc") vars[nd.var] = (+cur || 0) + (+nd.value || 0);
        else if (nd.op === "dec") vars[nd.var] = (+cur || 0) - (+nd.value || 0);
        else if (nd.op === "append") vars[nd.var] = String(cur ?? "") + String(nd.value ?? "");
        else vars[nd.var] = nd.value;
      }
      function stResolveLogic(nd, depth) {
        depth = depth || 0;
        while (nd && (nd.kind === "condition" || nd.kind === "setvar") && depth < 12) {
          depth++;
          const outs = outOf(nd.id);
          if (nd.kind === "setvar") { stApplySet(nd); nd = outs[0] || null; }
          else nd = stEvalCond(nd) ? (outs[0] || null) : (outs[1] || null);
        }
        return nd;
      }
      function stLocalRender(nd) {
        nd = stResolveLogic(nd);
        if (!nd || nd.kind === "link") return null;
        if (nd.kind === "image") {
          if (!nd.url) return null;
          return { node: nd, text: nd.caption || nd.text || "", media: { type: nd.mediaType || "photo", url: nd.url }, buttons: [] };
        }
        const { btns, urls, media } = stParts(nd, 0);
        let cb;
        if (nd.kind === "ticket") {
          cb = [{ text: "🎟 ثبت تیکت", data: `gs:tk:${nd.id}:` }];
          (nd.words || []).forEach((w, i) => cb.push({ text: "🔑 " + String(w).slice(0, 18), data: `gs:tka:${nd.id}:w${i}` }));
        } else {
          cb = btns.map((t) => ({ text: String(t.label || t.name || t.text || "ادامه").split("\n")[0].slice(0, 64) || "ادامه", data: `gs:go:${nd.id}:${t.id}`.slice(0, 64), tgt: t.id }));
        }
        const rows = [];
        urls.forEach((u) => rows.push([{ text: String(u.text || "لینک").slice(0, 64), url: u.url }]));
        for (let i = 0; i < cb.length; i += 3) rows.push(cb.slice(i, i + 3).map((b) => (b.url ? b : { text: b.text, callback_data: b.data })));
        return { node: nd, text: nd.text || (nd.kind === "ticket" ? "پیام خود را بنویسید…" : ""), media: media ? { type: media.mediaType || "photo", url: media.url } : null, buttons: rows, _cb: cb };
      }
      function stLocalTest(inp) {
        inp = String(inp || "").trim();
        if (!inp) return { matched: false };
        if (inp.startsWith("/")) {
          const nm = inp.slice(1).split(/\s+/)[0].toLowerCase();
          const nd = STG.nodes.find((n) => n.kind === "cmd" && (n.name || "").toLowerCase() === nm);
          return nd ? { matched: true, node: { id: nd.id, kind: "cmd", label: nd.name }, result: stLocalRender(nd) } : { matched: false };
        }
        if (inp.startsWith("gs:")) {
          const p = inp.slice(3).split(":");
          const tgt = p[2] ? nSt(p[2]) : null, src = nSt(p[1]);
          const raw = tgt || src;
          const nd = raw ? (stResolveLogic(raw) || raw) : null;
          return nd ? { matched: true, node: { id: nd.id, kind: nd.kind, label: nd.name || nd.label }, result: stLocalRender(raw) } : { matched: false };
        }
        const t = inp.toLowerCase();
        const trg = STG.nodes.find((n) => {
          if (n.kind !== "trigger") return false;
          const mode = n.mode || "contains";
          return (n.keywords || []).some((k) => {
            const s = String(k).toLowerCase();
            if (mode === "exact") return t === s;
            if (mode === "regex") { try { return new RegExp(k, "i").test(inp); } catch (e) { return false; } }
            return t.includes(s);
          });
        });
        return trg ? { matched: true, node: { id: trg.id, kind: "trigger", label: trg.name || trg.label || "کلیدواژه" }, result: stLocalRender(trg) } : { matched: false };
      }
      const stRunTest = guard(async (mode) => {
        let inp = mode === "cb" && st.testCb ? st.testCb : ($("stIn").value || "").trim();
        if (!inp) return toast("ورودی را بنویس", 1);
        let r;
        if (st.offline) {
          r = stLocalTest(inp);
          if (r.matched && r.result) r.node = r.node || { id: r.result.node.id, kind: r.result.node.kind, label: r.result.node.name || r.result.node.label };
        } else {
          try { r = await api(`/api/bots/${botId}/flow/test`, { method: "POST", body: { input: inp, flow: exportGraph(STG) } }); }
          catch (e) { if (/405|404/.test(e.message)) { st.offline = true; stStatus(); r = stLocalTest(inp); } else throw e; }
        }
        st.testIn = mode === "cb" ? st.testIn : inp;
        if (!r.matched) { st.testHtml = `<p style="color:var(--amber);font-size:13px">هیچ کارتی با «${esc(inp)}» مطابقت نکرد${st.offline ? " (پیش‌نمایش محلی)" : ""}</p>`; stTest(); return; }
        const m = r.result || {};
        const nid2 = r.node && r.node.id, nn = nid2 ? nSt(nid2) : null;
        st.testHtml = `<div style="color:var(--mu);font-size:11.5px;margin-bottom:8px" class="mono">${esc(ST_KIND[(nn || {}).kind] ? ST_KIND[(nn || {}).kind].t : r.node.kind)} · ${esc(r.node.label || r.node.id)}</div>` +
          (m.media ? `<div style="color:var(--mu);font-size:11.5px;margin-bottom:6px">${ic("image")} ${esc(m.media.type)} · <span class="mono ltr">${esc((m.media.url || "").slice(-40))}</span></div>` : "") +
          `<div class="bub">${esc(m.text || "…")}</div>` +
          (m.buttons || []).map((row) => `<div class="bubrow">${row.map((b) => `<i ${b.url ? `onclick="window.open('${esc(b.url)}','_blank')"` : `onclick="st.testCb='${esc(b.callback_data)}';stRunTest('cb')"`}>${b.url ? "🔗 " : ""}${esc(b.text)}</i>`).join("")}</div>`).join("") +
          (!m.buttons || !m.buttons.length ? `<div style="color:var(--mu);font-size:12px;margin-top:8px">این پیام دکمه‌ای ندارد.</div>` : "");
        stTest();
      });

      /* ── صندوق تیکت ── */
      const stTickets = guard(async () => {
        let d = { tickets: [], admins: (bot && bot.ticket_admins) || [] }, local = false;
        try { d = await api(`/api/bots/${botId}/tickets`); }
        catch (e) {
          if (!/405|404/.test(e.message)) throw e;
          local = true;
          try { d = JSON.parse(localStorage.getItem("gs_tk_" + botId) || "null") || d; } catch (e2) {}
        }
        const list = d.tickets || [];
        $("sheet").innerHTML = `<div class="sh-h"><span>صندوق تیکت‌ها${local ? " · محلی" : ""}</span><div class="ib" onclick="closeSheet()">${ic("x")}</div></div>
          <div class="sh-b">${local ? `<p style="color:var(--amber);font-size:12.5px;margin-bottom:10px">بک‌اند فعلی مسیر تیکت‌ها را ندارد. برای دریافت واقعی تیکت، gbs.py تازه را مستقر کن.</p>` : ""}
            <label>پذیرنده‌ها (شناسهٔ عددی، با ویرگول)</label>
            <input class="in ltr mono" id="tkAd" value="${esc((d.admins || []).join(", "))}" placeholder="123456789, 987654321">
            <button class="btn line sm" style="width:100%;margin-top:8px" onclick="stSaveAdmins(${local ? 1 : 0})">ذخیرهٔ پذیرنده‌ها</button>
            <label style="margin-top:18px">تیکت‌ها (${n(list.length)})</label>
            ${list.length ? list.map((t) => `<div class="item static" style="align-items:flex-start"><div class="g"><b>${esc(t.name || t.username || "#" + t.uid)} <span class="badge mono">${esc(t.id)}</span></b><small style="white-space:normal;display:block;margin-top:4px">${esc((t.text || "").slice(0, 220))}</small>${t.reply ? `<small style="color:var(--ok);white-space:normal;display:block">پاسخ: ${esc(t.reply.slice(0, 120))}</small>` : ""}<small class="mono" style="margin-top:4px">${new Date((t.t || 0) * 1000).toLocaleString("fa-IR")}</small></div>${t.reply ? "" : `<button class="btn sm line" onclick="stReplyTicket('${esc(t.id)}')">پاسخ</button>`}</div>`).join("") : `<p style="color:var(--mu);font-size:13px">هنوز تیکتی نیامده. یک کارت «تیکت» بساز و به یک دکمه وصل کن.</p>`}
          </div>`;
        $("scrim").classList.add("on");
      });
      const stSaveAdmins = guard(async (local) => {
        const admins = $("tkAd").value.split(/[،,\s]+/).map((x) => x.trim()).filter(Boolean);
        if (local) {
          let o = {}; try { o = JSON.parse(localStorage.getItem("gs_tk_" + botId) || "{}"); } catch (e) {}
          o.admins = admins; o.tickets = o.tickets || [];
          localStorage.setItem("gs_tk_" + botId, JSON.stringify(o));
          return toast("پذیرنده‌ها محلی ذخیره شدند — پس از استقرار بک‌اند تازه، دوباره ذخیره‌شان کن");
        }

      });
      function stReplyTicket(id) {
        $("sheet").innerHTML = `<div class="sh-h"><span>پاسخ تیکت ${esc(id)}</span><div class="ib" onclick="stTickets()">${ic("x")}</div></div>
          <div class="sh-b"><label>متن پاسخ</label><textarea class="in" id="tkR" rows="4" placeholder="پاسخ شما…"></textarea></div>
          <div class="sh-f"><button class="btn" onclick="stSendReply('${esc(id)}')">${ic("send")} ارسال</button></div>`;
      }
      const stSendReply = guard(async (id) => { const t = $("tkR").value.trim(); if (!t) return toast("متن را بنویس", 1); const r = await api(`/api/bots/${botId}/tickets`, { method: "POST", body: { id, reply: t } }); toast(r.message || "ارسال شد"); stTickets(); });

      /* ── منوی بالا / تنظیمات / کمک ── */
      function stMenu() {
        $("sheet").innerHTML = `<div class="sh-h"><span>استودیو — منو</span><div class="ib" onclick="closeSheet()">${ic("x")}</div></div>
          <div class="sh-b">
            ${st.offline ? `<div class="item static" style="background:var(--ac-soft);border-color:transparent;margin-bottom:10px"><span class="sq">${ic("help")}</span><div class="g"><b>حالت سازگار</b><small>بک‌اند فعلی مسیر /flow را ندارد. نقشه محلی می‌ماند و با «اعمال» به صورت دستور نوشته می‌شود. با استقرار gbs.py تازه، تیکت و کلیدواژه هم فعال می‌شوند.</small></div></div>` : ""}

      /* ── بک‌آپ کامل ── */
      async function stLocalBackup() {
        let rules = [];
        try { rules = (await api(`/api/bots/${botId}/rules`)).rules || []; } catch (e) {}
        return {
          version: 3, exported_at: new Date().toISOString(),
          bot_username: (bot && bot.bot_username) || "",
          commands: cmds || {}, flow: exportGraph(STG), rules,
          settings: { welcome_message: bot && bot.welcome_message, unknown_reply: bot && bot.unknown_reply, auto_menu: bot && bot.auto_menu }
        };
      }
      const stExport = guard(async () => {
        let backup;
        try { backup = (await api(`/api/bots/${botId}/backup`)).backup; }
        catch (e) {
          if (!/405|404/.test(e.message)) throw e;
          backup = await stLocalBackup();
          toast("بک‌آپ محلی ساخته شد (بدون تنظیمات سرور)");
        }
        const name = `gramsaaz-${(bot.bot_username || botId).replace(/[^\w.-]/g, "_")}.json`;
        const blob = new Blob([JSON.stringify(backup, null, 2)], { type: "application/json" });
        const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 4000);
        if (!st.offline) toast("فایل بک‌آپ ساخته شد");
      });
      function stImport() {
        $("sheet").innerHTML = `<div class="sh-h"><span>بازگردانی بک‌آپ</span><div class="ib" onclick="closeSheet()">${ic("x")}</div></div>
          <div class="sh-b"><p style="color:var(--mu);font-size:13px">فایل JSON بک‌آپ را انتخاب کن یا محتوایش را بچسبان. نقشه، دستورها، قوانین و تنظیمات بازمی‌گردند.</p>
          <input type="file" id="rsF" accept=".json,application/json" hidden onchange="stReadFile(this.files[0])">
          <button class="btn line" style="margin-top:12px" onclick="$('rsF').click()">${ic("download")} انتخاب فایل</button>
          <label>یا چسباندن JSON</label><textarea class="in ltr mono" id="rsJ" rows="5" style="font-size:11.5px" placeholder='{"version": 3, ...}' oninput="st.impJson=this.value"></textarea></div>

        st.impJson = "";
        $("scrim").classList.add("on");
      }
      function stReadFile(f) { if (!f) return; const r = new FileReader(); r.onload = () => { st.impJson = String(r.result || ""); const t = $("rsJ"); if (t) t.value = st.impJson; toast("فایل خوانده شد"); }; r.readAsText(f); }
      const stDoRestore = guard(async () => {
        const s = (st.impJson || "").trim(); if (!s) return toast("فایل یا JSON را بفرست", 1);
        let o; try { o = JSON.parse(s); } catch (e) { return toast("JSON نامعتبر است", 1); }
        sure("اطلاعات فعلی با بک‌آپ جایگزین شود؟", guard(async () => {
          try {
            const r = await api(`/api/bots/${botId}/restore`, { method: "POST", body: { backup: o } });
            toast(r.message || "بازگردانی شد"); closeSheet(); await vStudio(botId);
          } catch (e) {
            if (!/405|404/.test(e.message)) throw e;
            /* بک‌اند قدیمی: نقشه را محلی بازمی‌گردانیم و دستورها را مستقیم می‌فرستیم */

            stRender();

      /* ── پرش از پنل کلاسیک به کارت مربوطه در استودیو ── */

        await vStudio(botId);
        const nd = STG.nodes.find((x) => x.kind === "cmd" && x.name === name);
        if (nd) { STG.view.z = 1.15; stCenter(nd.id); stEdit(nd.id); }
      });

      /* ── کاربران ── */
      let allUsers = [];
      const tUsers = guard(async () => {
        const d = await api(`/api/bots/${botId}/users`); allUsers = d.users || [];
        $("tb").innerHTML = `<div style="display:flex;align-items:center;gap:10px;margin:2px 2px 12px"><span style="color:var(--mu);font-size:13px" class="mono">${n(allUsers.length)} users</span></div>
          <div class="item static" style="margin-bottom:12px;padding:4px 12px"><span style="color:var(--mu)">${ic("search")}</span><input class="in" placeholder="جست‌وجوی نام، آیدی یا شماره" oninput="fu(this.value)" style="border:0;background:transparent;box-shadow:none;padding:11px 8px"></div>

      });
      function userRow(u) { const nm = u.name || u.username || ("#" + u.uid); const at = u.username ? "@" + u.username : "#" + u.uid; const day = (u.joined || "").slice(0, 10);

           <h2>حذف</h2><div class="card"><p style="color:var(--mu);font-size:13px;margin-bottom:12px">حذف ربات برگشت‌ناپذیر است.</p><button class="btn red" onclick="delBot()">${ic("trash")} حذف ربات</button></div>`;

      });
      function expJson() {

      function impJson() {
        $("sheet").innerHTML = `<div class="sh-h"><span>ورودی JSON دستورها</span><div class="ib" onclick="closeSheet()">${ic("x")}</div></div>

          for (const [name, c] of Object.entries(o)) {
            await api(`/api/bots/${botId}/commands/${name}`, { method: "PUT", body: { response: c.response || "", description: c.description || "", buttons: c.buttons || null, photo: c.photo || null, media: c.media || null } });
