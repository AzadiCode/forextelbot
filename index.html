<!doctype html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>گرام‌ساز — استودیو ساخت ربات</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@33.003/Vazirmatn-font-face.css" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* ════════════════════════════════════════════════════════════════
   نگارخانهٔ طراحی — «گرافیت و کهربا»
   هویت اختصاصی: خنثیِ گرمِ گرافیتی + رنگ اصلی کهربایی. پالت
   استارئاپِ بنفش عمداً تکرار نشده. همه‌چیز RTL-native.
════════════════════════════════════════════════════════════════ */
:root{
  /* spacing scale (4px base) */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s7:32px; --s8:44px;
  /* radius */
  --r-xs:8px; --r-sm:12px; --r-md:16px; --r-lg:22px; --r-pill:999px;
  /* motion */
  --t-fast:150ms; --t:200ms; --t-slow:250ms; --ease:cubic-bezier(.22,.61,.28,1);
  /* type */
  --ff:'Vazirmatn',system-ui,'Segoe UI',sans-serif;
  --fs-cap:11px; --fs-sm:13px; --fs:15px; --fs-lg:17px; --fs-xl:21px; --fs-2xl:28px;
  /* z-index scale */
  --z-nav:20; --z-sticky:30; --z-mask:40; --z-sheet:50; --z-palette:60; --z-toast:70;
  /* layout */
  --rail:60px; --maxw:1080px; --tap:44px;
}
html[data-theme=dark]{
  --bg:#111214; --bg2:#16181b; --surface:#1b1e22; --surface2:#22262b; --elev:#262b31;
  --line:#2f343a; --line2:#3b4148;
  --ink:#eef1f4; --ink2:#b7bdc4; --ink3:#828a93;
  --brand:#ffb020; --brand2:#ff8c1a; --brand-ink:#1a1206; --brand-soft:#ffb0201f;
  --ok:#3fd08a; --ok-soft:#3fd08a1f; --warn:#ffc24b; --danger:#ff6b6b; --danger-soft:#ff6b6b1f;
  --info:#5ac8fa; --shadow:0 20px 50px -22px #000c; --shadow-sm:0 4px 14px -8px #000b;
  --grid:#ffffff08;
}
html[data-theme=light]{
  --bg:#f2f1ee; --bg2:#eae8e3; --surface:#ffffff; --surface2:#f6f5f2; --elev:#fff;
  --line:#e2dfd8; --line2:#d3cfc6;
  --ink:#1c1a16; --ink2:#57534b; --ink3:#8b857a;
  --brand:#b5651d; --brand2:#9a4f13; --brand-ink:#fff; --brand-soft:#b5651d14;
  --ok:#1c8a52; --ok-soft:#1c8a5214; --warn:#a9740a; --danger:#c8392f; --danger-soft:#c8392f14;
  --info:#1c6f9c; --shadow:0 20px 44px -24px #1c1a1655; --shadow-sm:0 3px 12px -8px #1c1a1640;
  --grid:#00000008;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--ff);background:var(--bg);color:var(--ink);font-size:var(--fs);
  line-height:1.7;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,textarea,select{font:inherit;color:inherit;background:none;border:none;outline:none}
button{cursor:pointer}
a{color:var(--brand);text-decoration:none}
svg{display:block;flex:none}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.02em}
::selection{background:var(--brand);color:var(--brand-ink)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px}
.hidden{display:none!important}

/* ── توکن‌های سطح مؤلفه ── */
.stack{display:flex;flex-direction:column;gap:var(--s3)}
.row{display:flex;align-items:center;gap:var(--s3)}
.between{display:flex;align-items:center;justify-content:space-between;gap:var(--s3)}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.tr{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ltr{direction:ltr;text-align:left}
.center{text-align:center}
.dim{color:var(--ink3)} .soft{color:var(--ink2)} .b{font-weight:700}
.cap{font-size:var(--fs-cap);text-transform:uppercase;letter-spacing:.4px;color:var(--ink3);font-weight:700}
.sm{font-size:var(--fs-sm)}
.mono{font-family:ui-monospace,Menlo,monospace;direction:ltr;text-align:left}
.s1{height:var(--s1)}.s2{height:var(--s2)}.s3{height:var(--s3)}.s4{height:var(--s4)}.s5{height:var(--s5)}
.mt-auto{margin-top:auto}

/* ── Card ── */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:var(--s5)}
.card.flat{background:var(--surface2)}
.card.tap{transition:border-color var(--t) var(--ease),transform var(--t) var(--ease)}
.card.tap:active{transform:scale(.995)}
.card.tap:hover{border-color:var(--line2)}
.card.pad-l{padding:var(--s4)}

/* ── Button ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);
  min-height:var(--tap);padding:0 var(--s5);border-radius:var(--r-sm);
  font-weight:700;font-size:var(--fs-sm);border:1px solid var(--line);background:var(--surface2);
  color:var(--ink);transition:transform var(--t-fast) var(--ease),background var(--t-fast),opacity var(--t-fast),border-color var(--t-fast);white-space:nowrap}
.btn:hover{border-color:var(--line2)}
.btn:active{transform:scale(.975)}
.btn svg{width:18px;height:18px}
.btn:disabled{opacity:.45;pointer-events:none}
.btn.brand{background:linear-gradient(160deg,var(--brand),var(--brand2));color:var(--brand-ink);border-color:transparent;box-shadow:var(--shadow-sm)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink2)}
.btn.ghost:hover{background:var(--surface2);color:var(--ink)}
.btn.danger{color:var(--danger);border-color:var(--danger);background:var(--danger-soft)}
.btn.solid{background:var(--ink);color:var(--bg);border-color:transparent}
.btn.sm{min-height:36px;padding:0 var(--s4);font-size:var(--fs-cap);border-radius:var(--r-xs)}
.btn.blk{width:100%}
.btn.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}

.iconbtn{width:var(--tap);height:var(--tap);border-radius:var(--r-sm);display:grid;place-items:center;
  color:var(--ink2);border:1px solid transparent;transition:var(--t-fast) var(--ease)}
.iconbtn:hover{background:var(--surface2);color:var(--ink)}
.iconbtn:active{transform:scale(.9)}
.iconbtn svg{width:20px;height:20px}
.iconbtn.sm{width:36px;height:36px}
.iconbtn.sm svg{width:16px;height:16px}
.iconbtn.dgr{color:var(--danger)}

/* ── Field ── */
.field{display:flex;align-items:center;gap:var(--s3);background:var(--bg2);
  border:1px solid var(--line);border-radius:var(--r-sm);padding:0 var(--s4);min-height:var(--tap);transition:border-color var(--t-fast)}
.field.ta{align-items:flex-start;padding:var(--s3) var(--s4)}
.field:focus-within{border-color:var(--brand)}
.field.bad{border-color:var(--danger)}
.field svg{width:18px;height:18px;color:var(--ink3)}
.field input,.field textarea{width:100%;background:none;font-size:var(--fs-sm);line-height:1.7}
.field textarea{resize:none}
.err{color:var(--danger);font-size:var(--fs-cap);font-weight:600;margin-top:var(--s2);display:flex;gap:6px;align-items:center}
.ok-note{color:var(--ok);font-size:var(--fs-cap);font-weight:600;margin-top:var(--s2)}
.hint{font-size:var(--fs-cap);color:var(--ink3)}

/* ── Switch ── */
.sw{width:46px;height:27px;border-radius:var(--r-pill);background:var(--line2);position:relative;flex:none;transition:var(--t) var(--ease);cursor:pointer}
.sw::after{content:"";position:absolute;top:3px;right:3px;width:21px;height:21px;border-radius:50%;
  background:#fff;box-shadow:0 2px 5px #0007;transition:transform var(--t) var(--ease)}
.sw[aria-checked=true]{background:var(--ok)}
.sw[aria-checked=true]::after{transform:translateX(-19px)}
.sw.sm{width:38px;height:22px}.sw.sm::after{width:16px;height:16px;top:3px;right:3px}
.sw.sm[aria-checked=true]::after{transform:translateX(-16px)}

/* ── Chip / Badge ── */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-cap);font-weight:700;
  padding:4px 10px;border-radius:var(--r-pill);background:var(--surface2);border:1px solid var(--line);color:var(--ink2)}
.chip svg{width:12px;height:12px}
.chip.brand{background:var(--brand-soft);border-color:transparent;color:var(--brand)}
.chip.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.chip.dgr{background:var(--danger-soft);border-color:transparent;color:var(--danger)}
.chip.line{background:transparent}
.chip button{display:grid;place-items:center;width:14px;color:var(--ink3)}

/* ── Badge (count) ── */
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:var(--r-pill);background:var(--brand);
  color:var(--brand-ink);font-size:10px;font-weight:800;display:inline-grid;place-items:center}

/* ── Tabs / Segmented ── */
.tabs{display:flex;gap:var(--s1);overflow-x:auto;padding-bottom:2px}
.tabs button{display:flex;align-items:center;gap:6px;min-height:38px;padding:0 var(--s4);border-radius:var(--r-sm) var(--r-sm) 0 0;
  font-size:var(--fs-sm);font-weight:700;color:var(--ink3);border-bottom:2px solid transparent;white-space:nowrap;transition:var(--t-fast)}
.tabs button svg{width:16px;height:16px}
.tabs button:hover{color:var(--ink2)}
.tabs button[aria-selected=true]{color:var(--brand);border-bottom-color:var(--brand)}
.seg{position:relative;display:inline-flex;background:var(--bg2);border:1px solid var(--line);border-radius:var(--r-sm);padding:4px}
.seg .ind{position:absolute;top:4px;bottom:4px;background:var(--brand);border-radius:var(--r-xs);
  transition:left var(--t-slow) var(--ease),width var(--t-slow) var(--ease);z-index:0}
.seg button{position:relative;z-index:1;min-height:32px;padding:0 var(--s4);border-radius:var(--r-xs);font-size:var(--fs-sm);font-weight:700;color:var(--ink3);transition:color var(--t-fast)}
.seg button[aria-selected=true]{color:var(--brand-ink)}

/* ── Skeleton ── */
.sk{border-radius:var(--r-md);background:linear-gradient(90deg,var(--surface2),var(--surface),var(--surface2));
  background-size:220% 100%;animation:sh 1.25s var(--ease) infinite}
@keyframes sh{from{background-position:130% 0}to{background-position:-130% 0}}
.spinner{width:22px;height:22px;border:2.5px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:sp .7s linear infinite;margin:var(--s7) auto}
@keyframes sp{to{transform:rotate(360deg)}}
.live{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none;animation:beat 2s infinite}
.live.off{background:var(--ink3);animation:none}
@keyframes beat{0%,100%{box-shadow:0 0 0 0 var(--ok-soft)}50%{box-shadow:0 0 0 5px transparent}}

/* ── Empty / Error state ── */
.state{text-align:center;padding:var(--s7) var(--s5);max-width:380px;margin:0 auto}
.state .glyph{width:66px;height:66px;border-radius:20px;display:grid;place-items:center;margin:0 auto var(--s4);
  background:var(--surface2);border:1px solid var(--line);color:var(--brand)}
.state .glyph svg{width:30px;height:30px}
.state h4{font-size:var(--fs-lg);font-weight:800;margin-bottom:var(--s2)}
.state p{font-size:var(--sm);color:var(--ink3);margin-bottom:var(--s5)}
.state.err .glyph{color:var(--danger);border-color:var(--danger)}

/* ── Sheet (bottom) / Dialog ── */
.mask{position:fixed;inset:0;background:#0b0c0e8c;backdrop-filter:blur(4px);z-index:var(--z-mask);opacity:0;pointer-events:none;transition:opacity var(--t-slow)}
.mask.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,100%);width:100%;max-width:var(--maxw);z-index:var(--z-sheet);
  background:var(--surface);border:1px solid var(--line);border-bottom:none;border-radius:var(--r-lg) var(--r-lg) 0 0;
  max-height:94dvh;display:flex;flex-direction:column;box-shadow:var(--shadow);transition:transform var(--t-slow) var(--ease)}
.sheet.on{transform:translate(-50%,0)}
.sheet .grab{width:38px;height:4px;border-radius:3px;background:var(--line2);margin:var(--s3) auto 0}
.sheet header{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--s5)}
.sheet header h3{font-size:var(--fs-lg);font-weight:800}
.sheet .body{overflow-y:auto;padding:0 var(--s5) var(--s5);flex:1}
.sheet footer{display:flex;gap:var(--s3);padding:var(--s4) var(--s5) calc(var(--s5) + env(safe-area-inset-bottom));border-top:1px solid var(--line)}

.dialog{position:fixed;inset:0;display:grid;place-items:center;padding:var(--s5);z-index:var(--z-sheet);
  opacity:0;pointer-events:none;transition:var(--t-slow)}
.dialog.on{opacity:1;pointer-events:auto}
.dialog .box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);
  width:100%;max-width:420px;box-shadow:var(--shadow)}

/* ── Toast ── */
#toast{position:fixed;left:50%;bottom:calc(var(--s8) + env(safe-area-inset-bottom));transform:translate(-50%,14px);
  display:flex;align-items:center;gap:var(--s2);background:var(--elev);color:var(--ink);
  padding:var(--s3) var(--s5);border-radius:var(--r-pill);border:1px solid var(--line2);
  font-size:var(--fs-sm);font-weight:700;z-index:var(--z-toast);opacity:0;pointer-events:none;
  transition:var(--t-slow) var(--ease);box-shadow:var(--shadow);max-width:90vw}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast svg{width:17px;height:17px}
#toast.ok svg{color:var(--ok)} #toast.er svg{color:var(--danger)} #toast.wr svg{color:var(--warn)}

/* ── Tooltip ── */
.tip{position:relative}
.tip::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 8px);right:50%;transform:translateX(50%);
  background:var(--elev);color:var(--ink);border:1px solid var(--line2);border-radius:var(--r-xs);
  padding:5px 9px;font-size:var(--fs-cap);font-weight:600;white-space:nowrap;opacity:0;pointer-events:none;transition:var(--t-fast);z-index:var(--z-palette)}
.tip:hover::after{opacity:1}

/* ── Stepper ── */
.stepper{display:flex;align-items:center;gap:var(--s2)}
.stepper .st{display:flex;align-items:center;gap:var(--s2)}
.stepper .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:var(--fs-cap);font-weight:800;
  border:1.5px solid var(--line2);color:var(--ink3);flex:none;transition:var(--t)}
.stepper .st.on .n,.stepper .st.done .n{background:var(--brand);border-color:transparent;color:var(--brand-ink)}
.stepper .st.done .n{background:var(--ok);color:#08130c}
.stepper .bar{width:26px;height:1.5px;background:var(--line2)}
.stepper .st.on .bar,.stepper .st.done .bar{background:var(--brand)}
.stepper .lbl{font-size:var(--fs-cap);font-weight:700;color:var(--ink3)}
.stepper .st.on .lbl{color:var(--ink)}

/* ── Progress ── */
.pbar{height:6px;border-radius:var(--r-pill);background:var(--bg2);overflow:hidden}
.pbar i{display:block;height:100%;border-radius:var(--r-pill);background:linear-gradient(90deg,var(--brand),var(--brand2));transition:width var(--t-slow) var(--ease)}
.pbar.ok i{background:var(--ok)}

/* ── Chart ── */
.chart{display:flex;align-items:flex-end;gap:var(--s2);height:108px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;justify-content:flex-end;height:100%}
.chart .col i{display:block;width:100%;max-width:26px;border-radius:var(--r-xs) var(--r-xs) 4px 4px;
  background:linear-gradient(var(--brand),var(--brand-soft));min-height:3px;transition:height var(--t-slow) var(--ease)}
.chart .col b{font-size:10px;font-weight:800;color:var(--ink2)}
.chart .col s{font-size:10px;text-decoration:none;color:var(--ink3)}

/* ── DataTable / list rows ── */
.list{display:flex;flex-direction:column}
.list .r{display:flex;align-items:center;gap:var(--s3);min-height:var(--tap);padding:var(--s3) 0;border-bottom:1px solid var(--line)}
.list .r:last-child{border-bottom:none}
.list .r:hover{background:var(--surface2);margin:0 calc(var(--s5) * -1);padding-inline:var(--s5)}

/* ── KPI ── */
.kpi .v{font-size:var(--fs-2xl);font-weight:800;letter-spacing:-.03em;line-height:1.15}
.kpi .k{font-size:var(--fs-cap);color:var(--ink3);font-weight:700}
.kpi .d{font-size:var(--fs-cap);font-weight:700;margin-top:2px}
.kpi .d.up{color:var(--ok)} .kpi .d.dn{color:var(--danger)}

/* ══ App shell ══ */
#root{display:flex;min-height:100dvh}
.rail{position:sticky;top:0;height:100dvh;width:var(--rail);flex:none;display:flex;flex-direction:column;
  align-items:center;gap:var(--s2);padding:var(--s4) 0;background:var(--bg2);border-inline-start:1px solid var(--line);z-index:var(--z-nav)}
.rail .mark{width:36px;height:36px;border-radius:11px;background:linear-gradient(160deg,var(--brand),var(--brand2));
  color:var(--brand-ink);display:grid;place-items:center;margin-bottom:var(--s3);box-shadow:var(--shadow-sm)}
.rail .mark svg{width:19px;height:19px}
.rail button{width:42px;height:42px;border-radius:var(--r-sm);display:grid;place-items:center;color:var(--ink3);position:relative;transition:var(--t-fast) var(--ease)}
.rail button svg{width:21px;height:21px}
.rail button:hover{background:var(--surface);color:var(--ink)}
.rail button.on{background:var(--brand-soft);color:var(--brand)}
.rail button.on::before{content:"";position:absolute;inset-inline-start:calc(var(--s4) * -1 - 1px);top:22%;height:56%;width:3px;border-radius:3px;background:var(--brand)}
.rail .sp{flex:1}
.wrap{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:var(--z-nav);display:flex;align-items:center;gap:var(--s3);
  padding:var(--s3) var(--s5);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);min-height:64px}
.crumb{display:flex;align-items:center;gap:var(--s2);font-size:var(--fs-sm);color:var(--ink3);font-weight:600}
.crumb b{color:var(--ink);font-weight:800;font-size:var(--fs)}
.page{padding:var(--s5);width:100%;max-width:var(--maxw);margin:0 auto}
.page.wide{max-width:none}
.searchbtn{display:flex;align-items:center;gap:var(--s2);min-height:38px;padding:0 var(--s3) 0 var(--s4);border-radius:var(--r-sm);
  border:1px solid var(--line);background:var(--surface);color:var(--ink3);font-size:var(--fs-sm)}
.searchbtn kbd{font-family:var(--ff);font-size:10px;font-weight:700;background:var(--surface2);border:1px solid var(--line);border-radius:5px;padding:1px 6px}
.pagehead{margin-bottom:var(--s5)}
.pagehead h1{font-size:var(--fs-xl);font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:var(--s3)}
.pagehead p{font-size:var(--sm);color:var(--ink3);margin-top:var(--s1)}

/* ── command palette ── */
#pal{position:fixed;inset:0;z-index:var(--z-palette);opacity:0;pointer-events:none;transition:var(--t-fast)}
#pal.on{opacity:1;pointer-events:auto}
#pal .scrim{position:absolute;inset:0;background:#0b0c0eaa;backdrop-filter:blur(5px)}
#pal .box{position:relative;top:12vh;margin:0 auto;width:100%;max-width:520px;background:var(--surface);
  border:1px solid var(--line2);border-radius:var(--r-md);box-shadow:var(--shadow);overflow:hidden;transform:scale(.98);transition:transform var(--t-fast) var(--ease)}
#pal.on .box{transform:none}
#pal .in{display:flex;align-items:center;gap:var(--s3);padding:0 var(--s4);border-bottom:1px solid var(--line);height:54px}
#pal .in svg{width:18px;height:18px;color:var(--ink3)}
#pal .in input{flex:1;font-size:var(--fs)}
#pal .res{max-height:56vh;overflow-y:auto;padding:var(--s2)}
#pal .grp{padding:var(--s3) var(--s3) var(--s1);font-size:10px;font-weight:800;color:var(--ink3);text-transform:uppercase;letter-spacing:.5px}
#pal .it{display:flex;align-items:center;gap:var(--s3);padding:var(--s3);border-radius:var(--r-sm);font-size:var(--fs-sm);font-weight:600;cursor:pointer}
#pal .it svg{width:17px;height:17px;color:var(--ink3)}
#pal .it.sel{background:var(--surface2);box-shadow:inset 2px 0 0 var(--brand)}
#pal .it small{margin-inline-start:auto;font-size:10px;color:var(--ink3);font-weight:700}

/* ── Auth ── */
.auth{display:grid;place-items:center;min-height:100dvh;padding:var(--s6);width:100%;
  background-image:radial-gradient(90% 55% at 50% -5%,var(--brand-soft),transparent 70%)}
.auth .panel{width:100%;max-width:400px}
.auth .mark{width:56px;height:56px;border-radius:18px;background:linear-gradient(160deg,var(--brand),var(--brand2));
  color:var(--brand-ink);display:grid;place-items:center;box-shadow:var(--shadow);margin-bottom:var(--s5)}
.auth .mark svg{width:29px;height:29px}
.auth h1{font-size:var(--fs-2xl);font-weight:800;letter-spacing:-.03em;line-height:1.25}
.auth .tl{color:var(--ink2);font-size:var(--fs-sm);margin-top:var(--s2)}
.auth .card{margin-top:var(--s6);box-shadow:var(--shadow-sm)}

/* ══ Flow Builder ══ */
.fb{display:grid;grid-template-columns:1fr 300px;gap:var(--s4);align-items:start}
@media(max-width:900px){.fb{grid-template-columns:1fr}}
.canvas{position:relative;background-color:var(--bg2);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;border:1px solid var(--line);border-radius:var(--r-md);min-height:420px;padding:var(--s4);overflow:auto}
.node{position:absolute;width:196px;background:var(--surface);border:1px solid var(--line2);border-radius:var(--r-sm);
  box-shadow:var(--shadow-sm);cursor:grab;user-select:none;transition:box-shadow var(--t-fast),border-color var(--t-fast)}
.node:active{cursor:grabbing}
.node.sel{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft),var(--shadow-sm)}
.node.bad{border-color:var(--danger);box-shadow:0 0 0 3px var(--danger-soft)}
.node .nh{display:flex;align-items:center;gap:6px;padding:var(--s2) var(--s3);border-bottom:1px solid var(--line)}
.node .nh svg{width:15px;height:15px}
.node .nh b{font-size:var(--fs-cap);font-weight:800;flex:1}
.node .nh .kill{color:var(--ink3);width:18px;height:18px;display:grid;place-items:center;border-radius:5px}
.node .nh .kill:hover{color:var(--danger);background:var(--danger-soft)}
.node .nb{padding:var(--s2) var(--s3);font-size:var(--fs-cap);color:var(--ink3)}
.node .nb .txt{color:var(--ink2);font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.node .nk{display:flex;flex-wrap:wrap;gap:4px;padding:0 var(--s3) var(--s2)}
.node .nk span{font-size:10px;background:var(--surface2);border:1px solid var(--line);border-radius:5px;padding:1px 6px}
.node.trigger{border-inline-start-width:3px;border-inline-start-color:var(--brand)}
.node.reply{border-inline-start-width:3px;border-inline-start-color:var(--info)}
.node[data-branch]::after{content:"";position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);
  width:14px;height:14px;border-radius:50%;background:var(--surface);border:2px solid var(--line2);transition:var(--t-fast)}
.node[data-branch].linking::after{border-color:var(--brand);background:var(--brand);transform:translateX(-50%) scale(1.2)}
#wires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
#wires path{fill:none;stroke:var(--line2);stroke-width:2;marker-end:url(#arw)}
#wires path.hot{stroke:var(--brand);stroke-dasharray:5 4;animation:dash .5s linear infinite}
@keyframes dash{to{stroke-dashoffset:-9}}
.palette{position:absolute;top:var(--s3);left:var(--s3);z-index:2;display:flex;gap:var(--s1);flex-wrap:wrap;max-width:65%}
.fbp{display:flex;flex-direction:column;gap:var(--s4)}
.preview{background:var(--bg2);border-radius:var(--r-md);padding:var(--s4);min-height:280px;
  background-image:radial-gradient(var(--grid) 1px,transparent 1px);background-size:14px 14px}
.tg-msg{max-width:86%;background:var(--surface);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:var(--s3);margin-bottom:var(--s2);font-size:var(--fs-sm)}
.tg-msg.me{margin-inline-start:auto;border-radius:14px 14px 4px 14px;background:var(--brand-soft);border-color:transparent}
.tg-kb{display:flex;flex-direction:column;gap:4px;margin-top:var(--s2)}
.tg-b{background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:7px;font-size:var(--fs-cap);font-weight:700;text-align:center}
.tg-b.br{color:var(--brand);border-color:var(--brand-soft)}
.issues{display:flex;flex-direction:column;gap:var(--s2);max-height:180px;overflow:auto}
.issue{display:flex;gap:var(--s2);align-items:flex-start;font-size:var(--fs-cap);line-height:1.6;
  padding:var(--s2) var(--s3);border-radius:var(--r-xs);background:var(--danger-soft);color:var(--danger);cursor:pointer;border:1px solid transparent}
.issue:hover{border-color:var(--danger)}
.issue svg{width:14px;height:14px;margin-top:2px;flex:none}

/* ── media grid ── */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:var(--s3)}
.mtile{aspect-ratio:1;border-radius:var(--r-sm);overflow:hidden;border:1px solid var(--line);background:var(--surface2);position:relative}
.mtile img{width:100%;height:100%;object-fit:cover}
.mtile .ty{position:absolute;top:5px;right:5px;font-size:9px;font-weight:800;background:#000a;color:#fff;padding:2px 6px;border-radius:5px}
.mtile .act{position:absolute;inset-inline:0;bottom:0;display:flex;gap:4px;padding:4px;background:linear-gradient(transparent,#000c)}
.mtile .act button{flex:1;font-size:10px;font-weight:700;color:#fff;background:#ffffff22;border-radius:6px;padding:5px 0;backdrop-filter:blur(3px)}

/* ── subscribers ── */
.avatar{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-weight:800;font-size:var(--fs-sm);color:#fff;flex:none;position:relative;overflow:hidden}
.avatar i{position:absolute;inset:0;background:radial-gradient(circle at 72% 12%,#ffffff55,transparent 62%);font-style:normal}

/* ── responsive ── */
@media(max-width:720px){
  :root{--rail:0px}
  #root{display:block;padding-bottom:calc(64px + env(safe-area-inset-bottom))}
  .rail{position:fixed;bottom:0;top:auto;left:0;right:0;height:calc(60px + env(safe-area-inset-bottom));width:100%;
    flex-direction:row;justify-content:space-evenly;border-inline-start:none;border-top:1px solid var(--line);padding:var(--s2) 0 calc(env(safe-area-inset-bottom))}
  .rail .mark,.rail .sp{display:none}
  .rail button{width:auto;flex:1;height:44px}
  .rail button.on::before{display:none}
  .rail button::after{content:attr(data-l);font-family:var(--ff);font-size:9px;font-weight:700;margin-top:1px}
  .rail button{flex-direction:column;gap:1px}
  .topbar{padding:var(--s2) var(--s4);min-height:56px}
  .page{padding:var(--s4)}
  .fb{grid-template-columns:1fr}
  .tip::after{display:none}
}
.fx{display:grid;gap:var(--s4)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:var(--s4)}
@media(max-width:640px){.g2{grid-template-columns:1fr}}
.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:var(--s4)}
.rise{animation:ri var(--t-slow) var(--ease) backwards}
@keyframes ri{from{opacity:0;transform:translateY(10px)}}
.rise>*:nth-child(2){animation-delay:40ms}.rise>*:nth-child(3){animation-delay:80ms}
.rise>*:nth-child(4){animation-delay:120ms}.rise>*:nth-child(n+5){animation-delay:160ms}
</style>
</head>

<div class="mask" id="mask"></div>

/* ════════════════════════════════════════════════════════════════

const UI={
  btn(label,{variant="default",size,icon,block,loading,disabled,tip,id,onclick}={}){

    return b;

  iconbtn(icon,{cls="",tip="",aria=""}={}){const b=E(`<button class="iconbtn ${cls} ${tip?"tip":""}" ${tip?`data-tip="${esc(tip)}"`:""} ${aria?`aria-label="${aria}"`:""}>${I[icon]}</button>`);return b},

  chart(data,{h=108}={}){

    data.forEach(d=>{const col=E(`<div class="col"><b class="num">${d.v?N(d.v):""}</b><i style="height:${Math.max(3,(d.v||0)/mx*(h-34))}px"></i><s>${esc(d.l)}</s></div>`);c.append(col)});
    return c;
  },
  tabs(items,current,onPick){

   state + network (فقط قراردادهای منجمد A)
════════════════════════════════════════════════════════════════ */
const st={token:"",user:null,bots:null,bot:null,route:"dashboard",flow:null,palOpen:false};
async function api(path,{method="GET",body,form}={}){
  const h={};
  if(st.token)h.Authorization="Bearer "+st.token;
  if(tg?.initData)h["X-Init-Data"]=tg.initData;
  const opt={method,headers:h};
  if(form)opt.body=form;
  else if(body!==undefined){h["Content-Type"]="application/json";opt.body=JSON.stringify(body)}
  let r;try{r=await fetch(API+path,opt)}catch(e){throw new Error("ارتباط با سرور برقرار نشد")}
  const d=await r.json().catch(()=>({}));
  if(!r.ok){if(r.status===401&&st.token)logout();throw new Error(d.error||`خطای ${r.status}`)}
  return d;
}

/* ── سازنده (facade) روی قراردادهای A: جریان ← دستورات ── */
/* قلمرو B یک گراف محلی می‌سازد؛ «انتشار» یعنی کامپایل به همان
   payload که هسته در set_command ذخیره می‌کند. هیچ فیلد تازه‌ای به A نمی‌رود. */
const Flow={
  blank(){return{nodes:[
    {id:uid("n"),type:"trigger",name:"start",x:60,y:40,text:"👋 سلام! چطور می‌تونم کمکت کنم؟",buttons:[
      {id:uid("cb"),text:"راهنما",kind:"reply",val:"راهنما"},{id:uid("cb"),text:"تماس با ما",kind:"reply",val:"support"}]},
    {id:uid("n"),type:"reply",name:"help",x:290,y:120,text:"برای شروع از منوی /help استفاده کن."}],
    edges:[],draft:{}}},
  get(){try{const g=JSON.parse(localStorage.flows||"{}");return g}catch(e){return{}}},
  save(g){const a=Flow.get();a[st.bot?.bot_id||"_"]=g;localStorage.flows=JSON.stringify(a)},
  loadBot(id){const a=Flow.get();return a[id]?clone(a[id]):null},
  /* کامپایل: trigger → command، reply ← callbacks */
  compile(g){
    const out={};const byId=Object.fromEntries(g.nodes.map(n=>[n.id,n]));
    g.nodes.filter(n=>n.type==="trigger").forEach(tr=>{
      const name=(tr.name||"start").replace(/^\/+/,"").replace(/\s+/g,"_").toLowerCase()||"start";
      const buttons=tr.buttons&&tr.buttons.length?[tr.buttons.map(b=>b.kind==="url"
        ?{text:b.text,url:b.val||"https://"}:{text:b.text,id:b.id||b.text})]:null;
      const cmd={response:tr.text||"",buttons,description:tr.desc||name};
      out[name]={cmd,callbacks:{}};
      (tr.buttons||[]).forEach(b=>{
        if(b.kind!=="reply")return;
        const target=byId[b.val]||g.nodes.find(n=>n.id===b.val);
        if(target&&target.text)out[name].callbacks[b.id||b.text]=target.text;
      });
    });
    return out;
  },
  /* اعتبارسنجی بصری: خطاهای انسانی با لینک به گره */
  validate(g){
    const bad=new Set(),out=[];
    const names=new Map();
    g.nodes.forEach(n=>{
      if(n.type==="trigger"){
        const nm=(n.name||"").trim().toLowerCase();
        if(!nm){bad.add(n.id);out.push({id:n.id,t:"نام دستور خالی است"})}
        else if(names.has(nm)){bad.add(n.id);bad.add(names.get(nm));out.push({id:n.id,t:`نام /${nm} تکراری است`})}
        else names.set(nm,n.id);
      }
      if(!n.text||!n.text.trim()){bad.add(n.id);out.push({id:n.id,t:"متن پیام خالی است"})}
    });
    const trig=g.nodes.filter(n=>n.type==="trigger");
    if(!trig.length)out.push({id:null,t:"حداقل یک گره شروع (دستور) لازم است"});
    if(!trig.some(n=>(n.name||"").toLowerCase()==="start"))out.push({id:null,t:"گره /start وجود ندارد؛ ربات بی‌پاسخ می‌ماند"});
    const used=new Set();
    trig.forEach(t=>(t.buttons||[]).forEach(b=>{if(b.kind==="reply")used.add(b.val)}));
    g.nodes.filter(n=>n.type==="reply").forEach(r=>{if(!used.has(r.id)){out.push({id:r.id,t:"این پیام به هیچ دکمه‌ای وصل نیست"})}});
    return{bad,out};
  },
  /* انتشار: نوشتن با PUTهای موجود هسته */
  async publish(g){
    const c=Flow.compile(g);const names=Object.keys(c);
    for(const [name,o] of Object.entries(c)){
      await api(`/api/bots/${st.bot.bot_id}/commands/${name}`,{method:"PUT",
        body:{response:o.cmd.response,description:o.cmd.description,buttons:o.cmd.buttons,media:null}});
      for(const [cbid,txt] of Object.entries(o.callbacks)){
        await api(`/api/bots/${st.bot.bot_id}/commands/${name}/callbacks/${encodeURIComponent(cbid)}`,{method:"PUT",body:{response:txt}});
      }
    }
    return names.length;
  },
  /* همگام: خواندن از A و بازسازی گراف */
  async importFromServer(){
    const cmds=(await api(`/api/bots/${st.bot.bot_id}/commands`)).commands||{};
    const ks=Object.keys(cmds);const g=Flow.blank();g.nodes=[];g.edges=[];
    if(!ks.length){g.nodes.push({id:uid("n"),type:"trigger",name:"start",x:60,y:40,text:"سلام!",buttons:[]});return g}
    ks.forEach((k,i)=>{
      const c=cmds[k],rows=Array.isArray(c.buttons)?c.buttons:[];
      const buttons=[];
      rows.flat().forEach(b=>buttons.push({id:b.callback_data||b.id||uid("cb"),text:b.text,
        kind:b.url?"url":"reply",val:b.url||b.callback_data||b.id||b.text}));
      g.nodes.push({id:uid("n"),type:"trigger",name:k,x:60,y:40+i*140,text:c.response||"",
        desc:c.description||"",buttons});
    });
    // پاسخ‌های callback → گره پیام
    const replies=[];
    ks.forEach((k,i)=>{
      const cb=cmds[k].callbacks||{},src=g.nodes[i];
      Object.entries(cb).forEach(([cid,txt],j)=>{
        const node={id:uid("n"),type:"reply",name:cid,x:src.x+300,y:src.y+j*130,text:txt};
        g.nodes.push(node);replies.push([src.id,cid,node.id]);
      });
    });
    replies.forEach(([from,cid,to])=>{
      const s=g.nodes.find(n=>n.id===from);const b=(s.buttons||[]).find(x=>x.id===cid||x.text===cid);
      if(b)b.val=to; else if(s)s.buttons=s.buttons||[];
    });
    return g;
  }
};

function boot(){

/* ریل ناوبری — در دسکتاپ عمودی، در موبایل پایین */
const Rail={
  top(active){
    const r=E(`<nav class="rail"></nav>`);
    r.append(E(`<div class="mark">${I.bolt}</div>`));

        r.append(b)});

      r.append(b2);
    }
    r.append(E(`<div class="sp"></div>`));
    const c=E(`<button class="tip" data-tip="جست‌وجوی فرمان (Ctrl K)" data-pal>${I.cmd}</button>`);r.append(c);
    const me=E(`<button data-go="account" data-l="حساب" class="tip" data-tip="حساب کاربری">${I.user}</button>`);r.append(me);
    return r;
  },
  body(node){
    const m=E(`<main class="page wide"></main>`);
    if(node)m.append(node);return m;
  },
  wire(){
    document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{tap();go(b.dataset.go)});
    document.querySelectorAll("[data-pal]").forEach(b=>b.onclick=palette);
  }
};
function go(route){
  if(route==="bots"){st.bot=null;st.route="bots";boot();return}
  st.route=route;boot();
}
function Router(){
  switch(st.route){
    case "dashboard":return View.dashboard();
    case "flows":return View.flows();
    case "subs":return View.subs();
    case "broadcast":return View.broadcast();
    case "media":return View.media();
    case "settings":return View.settings();
    case "account":return View.account();
    default:return View.dashboard();
  }
}

/* ════════════════════════════════════════════════════════════════
   FlowBuilder — بوم گره‌ای (کاملاً سمت کلاینت)
════════════════════════════════════════════════════════════════ */
const FlowBuilder={
  undo:[],dragging:null,linking:null,
  async mount(){
    const g=Flow.loadBot(st.bot.bot_id)||await Flow.importFromServer();
    st.flow=g;this.undo=[];
    this.renderTools();this.renderNodes();this.renderPanel();this.markDirty(false);
    $("pub")&&($("pub").onclick=this.publish.bind(this));
    $("imp")&&($("imp").onclick=guard(async()=>{st.flow=await Flow.importFromServer();Flow.save(st.flow);this.renderNodes();this.renderPanel();ok("از ربات بازگردانی شد")}));
    $("bk")&&($("bk").onclick=guard(async()=>{Flow.save(st.flow);this.markDirty(false);ok("نسخهٔ محلی ذخیره شد")}));
    $("undo")&&($("undo").onclick=()=>{const p=this.undo.pop();if(p){st.flow=p;this.renderNodes();this.renderPanel();this.undo.length?$("undo").disabled=false:$("undo").disabled=true;tap()}});
  },
  push(){this.undo.push(clone(st.flow));if(this.undo.length>30)this.undo.shift();$("undo")&&($("undo").disabled=false)},
  renderTools(){
    const t=$("tools");if(!t)return;t.innerHTML="";
    [["trigger","دستور","flow"],["reply","پیام","msg"]].forEach(([ty,lbl,ic])=>{
      const b=E(`<button class="btn sm">${I[ic]}${lbl}</button>`);
      b.onclick=()=>{this.push();const n={id:uid("n"),type:ty,name:ty==="trigger"?"":"",x:60+t.children.length*40+Math.random()*40,y:60+Math.random()*160,text:"",buttons:[]};st.flow.nodes.push(n);this.renderNodes();this.select(n.id);tap()};
      t.append(b);
    });
  },
  select(id){
    this.sel=id;this.renderNodes();this.renderPanel();
  },
  renderNodes(){
    const cv=$("cv");if(!cv)return;
    cv.querySelectorAll(".node,#wires,.palette").forEach(n=>n.remove());
    const v=Flow.validate(st.flow);
    // wires
    const svg=E(`<svg id="wires"><defs><marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--line2)"/></marker></defs></svg>`);
    cv.append(svg);
    st.flow.nodes.forEach(n=>{
      const el=E(`<div class="node ${n.type} ${this.sel===n.id?"sel":""} ${v.bad.has(n.id)?"bad":""} ${this.linking===n.id?"linking":""}" data-node="${n.id}" style="left:${n.x}px;top:${n.y}px"></div>`);
      el.setAttribute("data-branch", n.type==="trigger"?"1":"");
      const btns=(n.buttons||[]).map(b=>`<span>${esc(b.text)}</span>`).join("");
      el.innerHTML=`<div class="nh">${n.type==="trigger"?I.bolt:I.msg}<b>${n.type==="trigger"?esc("/"+(n.name||"?")):"پیام"}</b>
        <button class="kill" data-kill="${n.id}">${I.x}</button></div>
        <div class="nb"><div class="txt">${esc(n.text||"متن ندارد")}</div></div>
        ${btns?`<div class="nk">${btns}</div>`:""}`;
      cv.append(el);
      el.onpointerdown=e=>{
        if(e.target.closest(".kill"))return;
        if(e.button)return;
        const x0=e.clientX-n.x,y0=e.clientY-n.y;
        let moved=false;
        const mv=ev=>{
          if(!moved&&Math.abs(ev.clientX-x0)+Math.abs(ev.clientY-y0)<4)return;
          if(!moved){moved=true;this.push();this.sel=n.id;el.classList.add("sel");this.renderPanel()}
          n.x=Math.max(0,ev.clientX-x0);n.y=Math.max(0,ev.clientY-y0);
          el.style.left=n.x+"px";el.style.top=n.y+"px";this.renderWires();
        };
        const up=()=>{
          el.onpointermove=null;el.onpointerup=null;el.onpointercancel=null;
          if(moved){this.markDirty(true);Flow.save(st.flow)}
          else{this.select(n.id)}
        };
        this.sel=n.id;this.renderPanel();
        el.onpointermove=mv;el.onpointerup=up;el.onpointercancel=up;
      };
      el.querySelector("[data-kill]").onclick=e=>{e.stopPropagation();this.push();st.flow.nodes=st.flow.nodes.filter(x=>x.id!==n.id);st.flow.nodes.forEach(x=>(x.buttons||[]).forEach(b=>{if(b.val===n.id)b.val=n.id}));this.renderNodes();this.renderPanel();this.markDirty(true);tap()};
      el.onclick=e=>{if(!e.target.closest(".kill")&&this.linking){e.stopPropagation()}};
    });
  },
  renderWires(){
    const svg=$("wires");if(!svg)return;
    svg.querySelectorAll("path:not(defs path)").forEach(p=>p.remove());
    const pos=Object.fromEntries(st.flow.nodes.map(n=>[n.id,n]));
    st.flow.nodes.forEach(tr=>{
      if(tr.type!=="trigger")return;
      (tr.buttons||[]).forEach(b=>{
        if(b.kind!=="reply")return;const tgt=pos[b.val];if(!tgt)return;
        const a={x:tr.x+196,y:tr.y+34},c={x:tgt.x,y:tgt.y+30};
        const mx=(a.x+c.x)/2;
        svg.append(E(`<path class="w" d="M${a.x} ${a.y} C${mx} ${a.y} ${mx} ${c.y} ${c.x} ${c.y}"/>`));
      });
    });
  },
  renderPanel(){
    const p=$("fbp");if(!p)return;p.innerHTML="";
    const n=st.flow.nodes.find(x=>x.id===this.sel);
    // وضعیت اعتبارسنجی
    const v=Flow.validate(st.flow);
    const iss=E(`<div class="card"><div class="between" style="margin-bottom:var(--s3)">
      <div class="row" style="gap:6px">${I.shield}<b class="sm">اعتبارسنجی</b></div>
      ${v.out.length?UI.chip(`${N(v.out.length)} هشدار`,{variant:"dgr"}):UI.chip("بدون خطا",{variant:"ok"})}</div>
      <div class="issues">${v.out.length?v.out.map(i=>`<div class="issue" data-jump="${i.id||""}">${I.alert}<div>${esc(i.t)}</div></div>`).join(""):`<div class="hint center" style="padding:var(--s4)">ساختار معتبر و آمادهٔ انتشار است ✓</div>`}</div></div>`);
    p.append(iss);
    p.querySelectorAll("[data-jump]").forEach(el=>el.onclick=()=>{if(el.dataset.jump){this.select(el.dataset.jump)}});
    if(!n){p.append(UI.state({icon:"wand",title:"یک گره انتخاب کن",body:"تنظیمات اینجا ظاهر می‌شود."}));return}
    const card=E(`<div class="card stack"></div>`);
    if(n.type==="trigger"){
      const f=UI.field({ph:"start",icon:"msg",rtl:false});f.input.value=n.name||"";
      f.input.oninput=debounce(()=>{n.name=f.input.value.replace(/^\/+/,"").replace(/[^a-z0-9_\u0600-\u06FF]/gi,"").toLowerCase();
        this.refreshNode(n);this.renderWires();this.markDirty(true);Flow.save(st.flow)});
      const d=UI.field({ph:"توضیح منوی تلگرام",icon:"tag"});d.input.value=n.desc||"";d.input.oninput=()=>n.desc=d.input.value;
      card.append(E(`<div class="between"><b class="sm">گرهٔ شروع (دستور)</b>${UI.chip("/"+(n.name||"?"))}</div>`),f,d);
    }else{
      card.append(E(`<div class="between"><b class="sm">گرهٔ پیام</b>${UI.chip("پاسخ دکمه")}</div>`));
    }
    const ta=UI.field({rows:5,ph:"متن پیام… (HTML مجاز)"});ta.input.value=n.text||"";
    ta.input.oninput=debounce(()=>{this.refreshNode(n);this.markDirty(true);Flow.save(st.flow)});
    card.append(E(`<div class="hint row">${I.msg}<span>متن پاسخ</span></div>`),ta);
    if(n.type==="trigger"){
      const kb=E(`<div><div class="between" style="margin-bottom:6px"><span class="hint">${I.grid}دکمه‌ها</span>
        <button class="btn sm ghost" id="ab">+ دکمه</button></div><div class="stack" id="btnlist"></div></div>`);
      card.append(kb);
      const drawK=()=>{const bl=kb.querySelector("#btnlist");bl.innerHTML="";
        (n.buttons||[]).forEach((b,i)=>{
          const r=E(`<div class="card flat pad-l stack"></div>`);
          const t=UI.field({ph:"متن دکمه",icon:"tag"});t.input.value=b.text;t.input.oninput=debounce(()=>{b.text=t.input.value;this.refreshNode(n)});
          const kind=UI.seg([{id:"reply",label:"پاسخ"},{id:"url",label:"لینک"}],b.kind==="url"?"url":"reply",v=>{

/* ════════════════════════════════════════════════════════════════
   Broadcast — زمان‌بندی سمت کلاینت
════════════════════════════════════════════════════════════════ */
const Broadcast={
  mount(){
    const prev=$("bc-prev");if(!prev)return;
    const draw=debounce(()=>{const t=$("bc-txt").value.trim();
      prev.innerHTML="";
      const m=E(`<div class="tg-msg ${t?"":""}">`);m.innerHTML=t?this.sanitize(t):'<span class="hint">پیش‌نمایش اینجا…</span>';
      prev.append(E(`<div class="row" style="justify-content:center;padding:var(--s3) 0"><span class="chip line" style="font-size:9px">پیش‌نمایش حباب تلگرام</span></div>`));
      prev.append(m);},300);
    $("bc-txt").addEventListener("input",draw);draw();
    $("bc-go").onclick=guard(async()=>{
      const txt=$("bc-txt").value.trim();if(!txt){warn("متن را بنویس");return}
      const b=st.bot;const cnt=b.stats?.unique_users||0;
      if(!b.is_running){warn("برای ارسال، ربات را روشن کن");return}
      const at=$("bc-at")?.value;
      if(at&&new Date(at).getTime()>Date.now()){
        const mins=Math.round((new Date(at)-Date.now())/60000);
        if(await confirmBox({title:"زمان‌بندی ارسال؟",body:`پیام پس از حدود ${N(mins)} دقیقه (نزدیک‌ترین زمانِ زمان‌بندی سمت دستگاه) ارسال می‌شود. تا بستنِ مینی‌اپ ربات روشن بماند.`})){
          Broadcast.queue.push({txt,at:+new Date(at),n:cnt});this.persist();ok("در زمان‌بند محلی ثبت شد");return}
      }
      if(!await confirmBox({title:"ارسال همگانی",body:`به ${N(cnt)} مشترک ارسال شود؟`}))return;
      const go=$("bc-go");go.disabled=true;
      const r=await api(`/api/bots/${b.bot_id}/broadcast`,{method:"POST",body:{text:txt}});
      ding();ok(r.message||"در صف ارسال قرار گرفت");$("bc-txt").value="";draw();
      Broadcast.poll(b.bot_id,cnt);go.disabled=false;
    });
    this.resume();
  },
  queue:JSON.parse(localStorage.bcq||"[]"),
  persist(){localStorage.bcq=JSON.stringify(this.queue)},
  resume(){
    const now=Date.now();
    this.queue=this.queue.filter(j=>{
      if(j.at<=now){api(`/api/bots/${st.bot?.bot_id||j.bot}/broadcast`,{method:"POST",body:{text:j.txt}}).catch(()=>{});
        ok("پیام زمان‌بندی‌شده ارسال شد");return false}
      return true;
    });this.persist();
  },
  /* هسته هیچ شناسهٔ پیگیری/وضعیت تحویل برنمی‌گرداند؛ بنابراین
     گزارش تحویل «قابل انجام نیست» — این سازنده صرفاً روند شمارشِ
     تغییراتِ مشترک/پیام از همان daily_stats را به‌صورت زنده نشان می‌دهد. */
  async poll(botId,n0){
    let last=null;
    for(let i=0;i<6;i++){
      await new Promise(r=>setTimeout(r,4000));
      try{const {bot}=await api(`/api/bots/${botId}`);const s=bot.stats?.messages_sent||0;
        const card=$("broadcast-status")||Broadcast.progress(n0,s);last=s;
        const pb=card?.querySelector(".pbar i");if(pb)pb.style.width=Math.min(100,Math.round(s/(n0||1)*100))+"%";
        const tx=card?.querySelector("[data-st]");if(tx)tx.textContent=`${N(Math.min(s,n0))} از ${N(n0)} ارسال‌شده (برآورد)`;
        if(s>=n0){card?.querySelector("[data-st]")?.after(E(`<div class="ok-note">${I.check}تحویل کامل شد</div>`));break}
      }catch(e){break}
    }
  },
  progress(n0,s){
    let c=$("bc-status");if(c)return c;
    c=E(`<div class="card stack" id="bc-status" style="margin-top:var(--s5)"><div class="b sm">پیشرفت ارسال</div>
      <div class="pbar"><i style="width:0%"></i></div><div class="hint" data-st>شروع…</div></div>`);
    $("root").querySelector(".page")?.append(c);return c;
  },
  sanitize(t){return esc(t).replace(/&lt;(\/?(?:b|i|u|s|code|pre|a))(?:\s+([^&]*?))?&gt;/g,(m,tag,attrs)=>{
    if(/^a$/.test(tag.replace("/",""))){const mm=(attrs||"").match(/href=(['"])(.*?)\1/);
      return mm&&/^(https?:|tg:\/\/)/i.test(mm[2])?`<${tag} href="${esc(mm[2])}" rel="noopener">`:`<${tag}>`}
    return `<${tag}>`;})}
};

function upload(cb){
  const f=document.createElement("input");f.type="file";f.accept="image/*,video/*,audio/*,.pdf,.zip";
  f.onchange=guard(async()=>{const file=f.files[0];if(!file)return;
    const btn=$("mup");const old=btn?.innerHTML;if(btn){btn.disabled=true;btn.innerHTML='<span class="spinner" style="margin:0;width:15px;height:15px;border-width:2px"></span>'}
    toast("آپلود…");const fd=new FormData();fd.append("file",file);
    try{const r=await api("/api/upload-media",{method:"POST",form:fd});
      cb({type:r.type||"photo",url:r.url});ding();ok("آپلود شد");
    }finally{if(btn){btn.disabled=false;btn.innerHTML=old}}});
  f.click();
}

function palette(){
  tap();$("pal")?.remove?.();
  const p=E(`<div id="pal" class="on"><div class="scrim"></div><div class="box">
    <div class="in">${I.search}<input placeholder="دنبال چی می‌گردی؟" autocomplete="off"></div><div class="res"></div></div></div>`);
  document.body.append(p);
  const inp=p.querySelector("input"),res=p.querySelector(".res");
  const cmds=[
    {g:"ناوبری",l:"داشبورد",i:"gauge",go:()=>go("dashboard")},
    {g:"ناوبری",l:"سازندهٔ جریان",i:"flow",go:()=>go("flows")},
    {g:"ناوبری",l:"مشترکان",i:"people",go:()=>go("subs")},
    {g:"ناوبری",l:"برادکست",i:"megaphone",go:()=>go("broadcast")},
    {g:"ناوبری",l:"کتابخانهٔ رسانه",i:"image",go:()=>go("media")},
    {g:"ناوبری",l:"تنظیمات",i:"gear",go:()=>go("settings")},
    {g:"ربات‌ها",l:"تغییر / افزودن ربات",i:"grid",go:()=>{st.bot=null;st.route="bots";boot()}},
    {g:"عمل",l:"اتصال ربات جدید",i:"plus",go:newBotSheet},
    {g:"عمل",l:st.bot?.is_running?"متوقف کردن ربات":"راه‌اندازی ربات",i:"zap",go:st.bot?()=>toggle():null},
    {g:"عمل",l:"انتشار جریان در ربات",i:"save",go:st.bot?()=>{go("flows");setTimeout(()=>$("pub")?.click(),400)}:null},
    {g:"ظاهر",l:document.documentElement.dataset.theme==="dark"?"تم روشن":"تم تاریک",i:document.documentElement.dataset.theme==="dark"?"sun":"moon",go:()=>{theme(document.documentElement.dataset.theme==="dark"?"light":"dark");boot()}},
    {g:"حساب",l:"خروج",i:"out",go:()=>logout()},
  ].filter(c=>c.go);
  let sel=0;
  const draw=(q="")=>{
    const list=cmds.filter(c=>c.l.includes(q)||c.g.includes(q));
    res.innerHTML="";let lastG="";sel=Math.min(sel,list.length-1);
    list.forEach((c,idx)=>{
      if(c.g!==lastG){res.append(E(`<div class="grp">${c.g}</div>`));lastG=c.g}
      const it=E(`<div class="it ${idx===sel?"sel":""}">${I[c.i]}<span>${c.l}</span>${idx===sel?E(`<small>↵</small>`):""}</div>`);
      it.onclick=c.go;it.onmouseenter=()=>{sel=idx;draw(q)};res.append(it);
    });
    if(!list.length)res.append(E(`<div class="hint center" style="padding:var(--s6)">موردی نیست</div>`));
    return list;
  };
  draw();
  inp.oninput=()=>{sel=0;draw(inp.value.trim())};
  inp.onkeydown=e=>{
    const list=draw(inp.value.trim());
    if(e.key==="ArrowDown"){e.preventDefault();sel=Math.min(sel+1,list.length-1);draw(inp.value.trim());tap("light")}
    if(e.key==="ArrowUp"){e.preventDefault();sel=Math.max(sel-1,0);draw(inp.value.trim());tap("light")}
    if(e.key==="Enter"){list[sel]?.go?.();close()}
    if(e.key==="Escape")close();
  };
  const close=()=>{p.classList.remove("on");setTimeout(()=>p.remove(),180)};
  p.querySelector(".scrim").onclick=close;
  setTimeout(()=>inp.focus(),60);
}
async function toggle(){
  const r=await api(`/api/bots/${st.bot.bot_id}/toggle`,{method:"PATCH",body:{active:!st.bot.is_running}});
  st.bot.is_running=r.is_running;ok(r.is_running?"روشن شد":"خاموش شد");boot();
}
document.addEventListener("keydown",e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();st.user&&palette()}
  if(e.key==="Escape"){closeSheet();$("dialog").classList.remove("on");$("dialog").innerHTML="";}

        const sd=UI.btn("ارسال کد تأیید",{icon:"send",block:true});
        const vc=UI.field({ph:"کد ۶ رقمی",icon:"check",cls:"hidden"});vc.classList.toggle("hidden",true);
        const go=UI.btn("ساخت حساب",{variant:"brand",icon:"right",block:true});
        sd.onclick=guard(async()=>{const u2=t.input.value.trim().replace("@","");
          if(!u2){warn("یوزرنیم تلگرام لازم است");return}
          sd.disabled=true;
          try{await api("/api/auth/send-code",{method:"POST",body:{telegram_username:u2,device_id:dev()}});
            vc.classList.remove("hidden");vc.input.focus();ok("کد به تلگرام آمد")}finally{sd.disabled=false}});
        go.onclick=guard(async()=>{
          const body={username:u.input.value.trim(),password:p1.input.value,full_name:u.input.value.trim(),
            telegram_username:t.input.value.trim().replace("@",""),verification_code:vc.input.value.trim(),
            device_id:dev(),referral_code:localStorage.ref||""};
          if(!body.username||!body.password||!body.telegram_username||!body.verification_code){warn("همهٔ فیلدها را کامل کن");return}
          const d=await api("/api/auth/register",{method:"POST",body});finish(d);
        });
        f.append(u,p1,t,sd,vc,go);
      }else{
        const u=UI.field({ph:"نام کاربری",icon:"user",auto:"username"});
        const p1=UI.field({ph:"رمز عبور",icon:"lock",type:"password",auto:"current-password"});
        const go=UI.btn("ورود",{variant:"brand",icon:"right",block:true});
        go.onclick=guard(async()=>{
          if(!u.input.value.trim()||!p1.input.value){warn("نام کاربری و رمز لازم است");return}
          const d=await api("/api/auth/login",{method:"POST",body:{username:u.input.value.trim(),password:p1.input.value}});finish(d)});
        if(tg?.initData){
          const tgb=UI.btn("ورود با تلگرام",{icon:"tg",block:true});
          tgb.onclick=guard(async()=>{const d=await api("/api/me");if(!d.uid)throw new Error("دسترسی رد شد");
            st.user=d;await loadBots();boot();});
          f.append(u,p1,go,tgb);
        }else f.append(u,p1,go);
      }
      return f;
    };
    sw.append(form());p.append(sw);
    p.append(E(`<p class="hint center" style="margin-top:var(--s5)">با ادامه، قوانین پلتفرم می‌پذیرد.</p>`));
    return w;
  }
};
async function finish(d){
  if(!d.token)throw new Error("توکن دریافت نشد");
  st.token=d.token;localStorage.authToken=d.token;st.user=d.user;localStorage.removeItem("ref");
  ding();ok("خوش آمدی 👋");await loadBots();
  st.bot=null;st.route="bots";boot();
}
function logout(call=true){
  if(call&&st.token)api("/api/auth/logout",{method:"POST"}).catch(()=>{});
  st.token="";st.user=null;st.bot=null;st.bots=null;st.route="bots";Auth.mode="login";localStorage.removeItem("authToken");boot();
}
async function loadBots(){const {bots}=await api("/api/bots");st.bots=bots||[]}

/* ── theme ── */
function theme(t){document.documentElement.dataset.theme=t;localStorage.theme=t;
  const c=t==="dark"?"#111214":"#f2f1ee";
  try{tg?.setHeaderColor?.(c);tg?.applyTheme?.()}catch(e){}}
theme(localStorage.theme||tg?.colorScheme||"dark");

/* ── boot ── */
(async function start(){
  try{tg?.ready?.();tg?.expand?.()}catch(e){}
  const ref=new URLSearchParams(location.search).get("ref");if(ref)localStorage.ref=ref;
  if(tg?.initData){
    try{const d=await api("/api/me");if(d.token){st.token=d.token;localStorage.authToken=d.token}
      st.user=d;await loadBots();boot();return}catch(e){}
  }
  const t=localStorage.authToken;
  if(t){st.token=t;try{st.user=await api("/api/auth/me");await loadBots();boot();return}catch(e){localStorage.removeItem("authToken")}}
  boot();
})();
</script>
</body>
</html>
