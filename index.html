<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
    />
    <meta name="theme-color" content="#0e0f11" />
    <title>GramSaz</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&family=Inter:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0e0f11;
        --card: #151719;
        --card2: #1b1e21;
        --line: #25282c;
        --tx: #e9e8e3;
        --mu: #80848b;
        --ac: #d4ff3f;
        --acx: #12140a;
        --red: #ff6161;
        --ok: #3ddc97;
        --r: 14px;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        background: var(--bg);
        color: var(--tx);
        font:
          14px/1.6 Vazirmatn,
          system-ui,
          sans-serif;
        min-height: 100vh;
      }
      button,
      input,
      textarea,
      select {
        font: inherit;
        color: inherit;
        border: 0;
        outline: 0;
        background: none;
      }
      svg {
        width: 18px;
        height: 18px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex: none;
      }
      #view {
        max-width: 560px;
        margin: 0 auto;
        padding: 18px 16px 100px;
        animation: fade 0.2s;
      }
      @keyframes fade {
        from {
          opacity: 0;
        }
      }
      h1 {
        font-size: 21px;
        font-weight: 700;
      }
      h2 {
        font-size: 12px;
        color: var(--mu);
        font-weight: 500;
        margin: 22px 2px 8px;
      }
      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 16px;
      }
      .sub {
        color: var(--mu);
        font-size: 12.5px;
      }
      .num,
      .tag,
      .chips span,
      .av {
        font-family: Inter, Vazirmatn, sans-serif;
        font-variant-numeric: tabular-nums;
      }
      .sec {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: 14px 0 8px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: var(--r);
        padding: 14px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 11px 12px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: var(--r);
        margin-bottom: 6px;
        cursor: pointer;
      }
      .row:active {
        background: var(--card2);
      }
      .row .g {
        flex: 1;
        min-width: 0;
      }
      .row b {
        display: block;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .row small {
        display: block;
        color: var(--mu);
        font-size: 12px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .av {
        position: relative;
        width: 36px;
        height: 36px;
        border-radius: 11px;
        background: var(--card2);
        display: grid;
        place-items: center;
        font-size: 14px;
        font-weight: 600;
        color: var(--ac);
        flex: none;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #555a61;
        flex: none;
      }
      .dot.on {
        background: var(--ok);
      }
      .av .dot {
        position: absolute;
        bottom: -2px;
        left: -2px;
        border: 2px solid var(--card);
        box-sizing: content-box;
      }
      .kpis {
        display: grid;
        grid-template-columns: repeat(var(--c, 4), 1fr);
        gap: 1px;
        background: var(--line);
        border: 1px solid var(--line);
        border-radius: var(--r);
        overflow: hidden;
      }
      .kpis > div {
        background: var(--card);
        padding: 11px 4px;
        text-align: center;
      }
      .kpis b {
        display: block;
        font:
          700 18px/1.3 Inter,
          Vazirmatn,
          sans-serif;
        letter-spacing: -0.3px;
      }
      .kpis span {
        font-size: 11px;
        color: var(--mu);
      }
      .kpis .ac b {
        color: var(--ac);
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        height: 44px;
        padding: 0 18px;
        border-radius: 12px;
        background: var(--ac);
        color: var(--acx);
        font-weight: 600;
        cursor: pointer;
        width: 100%;
      }
      .btn:active {
        opacity: 0.85;
      }
      .btn:disabled {
        opacity: 0.5;
      }
      .btn.s {
        background: var(--card2);
        color: var(--tx);
        border: 1px solid var(--line);
      }
      .btn.d {
        background: #ff61611a;
        color: var(--red);
      }
      .btn.sm {
        height: 34px;
        width: auto;
        padding: 0 12px;
        font-size: 13px;
        border-radius: 10px;
      }
      .ib {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        background: var(--card);
        border: 1px solid var(--line);
        display: grid;
        place-items: center;
        cursor: pointer;
        flex: none;
        color: var(--mu);
      }
      .ib.d {
        color: var(--red);
        background: #ff61611a;
        border-color: transparent;
      }
      .mini {
        width: 30px;
        height: 30px;
        border-radius: 8px;
        display: grid;
        place-items: center;
        color: var(--mu);
        background: var(--card);
        cursor: pointer;
        flex: none;
      }
      .mini svg {
        width: 16px;
        height: 16px;
      }
      .mini.on {
        color: var(--ac);
      }
      .mini:active {
        color: var(--red);
      }
      .in {
        width: 100%;
        background: var(--card2);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px 12px;
        margin-bottom: 8px;
      }
      .in:focus {
        border-color: #59642c;
      }
      textarea.in {
        min-height: 96px;
        resize: vertical;
      }
      .in[dir="ltr"] {
        text-align: left;
      }
      label {
        display: block;
        font-size: 12px;
        color: var(--mu);
        margin: 0 2px 5px;
      }
      .seg {
        display: flex;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 3px;
        margin: 14px 0;
      }
      .seg button {
        flex: 1;
        height: 34px;
        border-radius: 9px;
        color: var(--mu);
        cursor: pointer;
      }
      .seg button.on {
        background: var(--card2);
        color: var(--ac);
        font-weight: 600;
      }
      .sw {
        position: relative;
        width: 40px;
        height: 24px;
        border-radius: 12px;
        background: var(--line);
        cursor: pointer;
        flex: none;
        transition: 0.2s;
      }
      .sw::after {
        content: "";
        position: absolute;
        top: 3px;
        right: 3px;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #aaa;
        transition: 0.2s;
      }
      .sw.on {
        background: var(--ac);
      }
      .sw.on::after {
        right: 19px;
        background: var(--acx);
      }
      .plug {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: var(--r);
        margin-bottom: 8px;
        overflow: hidden;
      }
      .plug .h {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        cursor: pointer;
      }
      .plug .ic {
        width: 32px;
        height: 32px;
        border-radius: 10px;
        background: var(--card2);
        display: grid;
        place-items: center;
        color: var(--ac);
      }
      .plug .g {
        flex: 1;
        min-width: 0;
      }
      .plug b {
        display: block;
        font-weight: 600;
        font-size: 13.5px;
        line-height: 1.4;
      }
      .plug small {
        color: var(--mu);
        font-size: 11.5px;
      }
      .plug .chev {
        color: var(--mu);
        transition: 0.2s;
      }
      .plug.open .chev {
        transform: rotate(180deg);
      }
      .plug .bd {
        display: none;
        padding: 12px;
        border-top: 1px solid var(--line);
      }
      .plug.open .bd {
        display: block;
      }
      .tag {
        font-size: 11px;
        padding: 1px 8px;
        border-radius: 8px;
        background: var(--card2);
        color: var(--mu);
      }
      .tabbar {
        position: fixed;
        bottom: max(12px, env(safe-area-inset-bottom));
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 2px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 4px;
        z-index: 20;
      }
      .tabbar button {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1px;
        width: 64px;
        padding: 7px 0;
        border-radius: 14px;
        color: var(--mu);
        font-size: 11px;
        cursor: pointer;
      }
      .tabbar button.on {
        background: var(--ac);
        color: var(--acx);
        font-weight: 600;
      }
      .sheet-bg {
        position: fixed;
        inset: 0;
        background: #000b;
        z-index: 40;
        display: none;
        align-items: flex-end;
      }
      .sheet-bg.on {
        display: flex;
      }
      .sheet {
        width: 100%;
        max-width: 560px;
        margin: 0 auto;
        background: var(--bg);
        border: 1px solid var(--line);
        border-bottom: 0;
        border-radius: 20px 20px 0 0;
        display: flex;
        flex-direction: column;
        max-height: 92vh;
        animation: up 0.2s;
      }
      @keyframes up {
        from {
          transform: translateY(30px);
          opacity: 0;
        }
      }
      .sh-h {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 16px;
        border-bottom: 1px solid var(--line);
        font-weight: 600;
      }
      .sh-b {
        padding: 14px 16px;
        overflow: auto;
        flex: 1;
      }
      .sh-f {
        display: flex;
        gap: 8px;
        padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
        border-top: 1px solid var(--line);
      }
      .pfx {
        display: flex;
        align-items: center;
        direction: ltr;
        background: var(--card2);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 0 12px;
        margin-bottom: 8px;
      }
      .pfx span {
        color: var(--mu);
        margin-right: 2px;
      }
      .pfx input {
        flex: 1;
        padding: 10px 0;
      }
      .chips {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-bottom: 12px;
      }
      .chips span {
        font-size: 12px;
        padding: 2px 10px;
        border-radius: 20px;
        background: var(--card2);
        border: 1px solid var(--line);
        color: var(--mu);
        cursor: pointer;
      }
      .pv {
        background: #0a0b0c;
        border: 1px dashed var(--line);
        border-radius: 12px;
        padding: 12px;
        margin-bottom: 6px;
      }
      .bub {
        background: var(--card2);
        border-radius: 12px 12px 12px 4px;
        padding: 8px 12px;
        white-space: pre-wrap;
        word-break: break-word;
        font-size: 13.5px;
        max-width: 92%;
      }
      .mchip {
        font-size: 11px;
        color: var(--mu);
        margin-bottom: 4px;
      }
      .pb {
        display: flex;
        gap: 4px;
        margin-top: 4px;
        max-width: 92%;
      }
      .pb i {
        flex: 1;
        text-align: center;
        background: #262a2f;
        border-radius: 8px;
        padding: 4px;
        font-style: normal;
        font-size: 12.5px;
        color: #c9d1da;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .brow {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 8px;
        margin-bottom: 8px;
      }
      .bc {
        display: flex;
        gap: 6px;
        align-items: center;
        margin-bottom: 6px;
      }
      .bc .in {
        margin: 0;
        flex: 1;
        min-width: 0;
        padding: 8px 10px;
      }
      .bc .id {
        flex: 0 0 78px;
        font-size: 12px;
      }
      .lnk {
        font-size: 12px;
        color: var(--ac);
        cursor: pointer;
      }
      .med {
        margin: 14px 0;
      }
      .med summary {
        cursor: pointer;
        color: var(--mu);
        font-size: 12px;
        margin-bottom: 8px;
      }
      .empty {
        text-align: center;
        color: var(--mu);
        padding: 36px 20px;
      }
      .empty-ic {
        width: 48px;
        height: 48px;
        margin: 0 auto 12px;
        border-radius: 14px;
        background: var(--card);
        border: 1px dashed var(--line);
        display: grid;
        place-items: center;
      }
      .skel {
        border-radius: var(--r);
        background: linear-gradient(90deg, var(--card) 25%, var(--card2) 50%, var(--card) 75%);
        background-size: 200% 100%;
        animation: sh 1.2s infinite linear;
      }
      @keyframes sh {
        to {
          background-position: -200% 0;
        }
      }
      #toast {
        position: fixed;
        top: 14px;
        left: 50%;
        transform: translate(-50%, -90px);
        background: var(--tx);
        color: var(--bg);
        padding: 9px 16px;
        border-radius: 12px;
        font-weight: 500;
        z-index: 99;
        transition: 0.3s;
        max-width: 90%;
      }
      #toast.on {
        transform: translate(-50%, 0);
      }
      #toast.err {
        background: var(--red);
        color: #fff;
      }
      #auth {
        position: fixed;
        inset: 0;
        background: var(--bg);
        z-index: 60;
        display: none;
        overflow: auto;
        padding: 60px 20px;
      }
      #auth.on {
        display: block;
      }
      #auth > div {
        max-width: 400px;
        margin: 0 auto;
      }
      .logo {
        width: 52px;
        height: 52px;
        border-radius: 16px;
        background: var(--ac);
        color: var(--acx);
        display: grid;
        place-items: center;
        margin-bottom: 20px;
      }
      .logo svg {
        width: 26px;
        height: 26px;
      }
      .bar {
        height: 5px;
        border-radius: 3px;
        background: var(--card2);
        margin-top: 5px;
        overflow: hidden;
      }
      .bar i {
        display: block;
        height: 100%;
        background: var(--ac);
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="auth"><div id="authbox"></div></div>
    <div id="view"></div>
    <nav class="tabbar" id="tabs"></nav>
    <div class="sheet-bg" id="sbg" onclick="if (event.target === this) closeSheet();">
      <div class="sheet" id="sheet"></div>
    </div>
    <div id="toast"></div>

    <script>
      const API = "https://forextelbot-9jwt.onrender.com",
        WEBAPP = "https://botsazgram.onrender.com";
      const tg = window.Telegram?.WebApp;
      let initData = "";
      if (tg) {
        tg.ready();
        tg.expand();
        try {
          tg.setHeaderColor("#0e0f11");
          tg.setBackgroundColor("#0e0f11");
        } catch (e) {}
      }
      let token = localStorage.getItem("authToken") || "",
        user = null,
        bots = [],
        bot = null,
        cmds = {},
        ed = null,
        tab = "cmds";
      const ref =
        new URLSearchParams(location.search).get("ref") || localStorage.getItem("pending_referral") || "";
      if (ref) localStorage.setItem("pending_referral", ref);
      const $ = (id) => document.getElementById(id),
        n = (x) => (+x || 0).toLocaleString("en-US");
      const esc = (s) =>
        String(s ?? "").replace(
          /[&<>"']/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c],
        );
      const I = {
        x: '<path d="M6 6l12 12M18 6L6 18"/>',
        down: '<path d="M6 9l6 6 6-6"/>',
        msg: '<path d="M4 5h16v11H9l-5 4z"/>',
        home: '<path d="M3 11l9-8 9 8M5 10v10h14V10"/>',
        bot: '<rect x="4" y="8" width="16" height="12" rx="3"/><path d="M12 4v4M9 13v2M15 13v2"/>',
        plus: '<path d="M12 5v14M5 12h14"/>',
        user: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
        back: '<path d="M9 6l6 6-6 6"/>',
        trash: '<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
        plug: '<path d="M9 3v5M15 3v5M6 8h12v3a6 6 0 01-12 0zM12 17v4"/>',
        send: '<path d="M21 3L3 10l7 3 3 7z"/>',
        lock: '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/>',
        logo: '<path d="M4 12l16-8-4 16-4-6z"/>',
        shield: '<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>',
        copy: '<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 012-2h9"/>',
      };
      const ic = (k) => `<svg viewBox="0 0 24 24">${I[k]}</svg>`;
      let tt;
      const toast = (m, e) => {
        const t = $("toast");
        t.textContent = m;
        t.className = "on" + (e ? " err" : "");
        clearTimeout(tt);
        tt = setTimeout(() => (t.className = ""), 2600);
      };
      const sure = (m, f) => (tg?.showConfirm ? tg.showConfirm(m, (ok) => ok && f()) : confirm(m) && f());

      async function api(p, o = {}) {
        const h = { "Content-Type": "application/json" };
        if (initData) h["X-Init-Data"] = initData;
        if (token) h.Authorization = "Bearer " + token;
        const r = await fetch(API + p, {
          ...o,
          headers: h,
          body: o.body ? JSON.stringify(o.body) : undefined,
        });
        const d = await r.json().catch(() => ({}));
        if (!r.ok) {
          if (r.status === 401 && token) {
            token = "";
            localStorage.removeItem("authToken");
            showAuth();
          }
          throw new Error(d.detail || d.error || "خطای " + r.status);
        }
        return d;
      }
      const guard =
        (f) =>
        async (...a) => {
          try {
            return await f(...a);
          } catch (e) {
            toast(e.message, 1);
          }
        };
      const devId = () =>
        localStorage.device_id ||
        (localStorage.device_id = "dev_" + Date.now() + "_" + Math.random().toString(36).slice(2, 11));

      /* ───────── Auth ───────── */
      let reg = {};
      function showAuth(step = "login") {
        $("auth").classList.add("on");
        $("tabs").style.display = "none";
        $("view").style.display = "none";
        const head = `<div class="logo">${ic("logo")}</div>`;
        const B = $("authbox");
        if (step === "login")
          B.innerHTML =
            head +
            `<h1>ورود به گرام‌ساز</h1><p class="sub" style="margin:6px 0 22px">ربات تلگرامی خودت را بدون کدنویسی بساز.</p>
  <label>نام کاربری</label><input class="in" id="lu" dir="ltr" autocomplete="username">
  <label>رمز عبور</label><input class="in" id="lp" type="password" dir="ltr" autocomplete="current-password">
  <button class="btn" onclick="doLogin()">ورود</button>
  <button class="btn s" style="margin-top:8px" onclick="showAuth('reg1')">حساب ندارم، ثبت‌نام</button>`;
        if (step === "reg1")
          B.innerHTML =
            head +
            `<h1>ساخت حساب</h1><p class="sub" style="margin:6px 0 22px">ابتدا آیدی تلگرامت را وارد کن تا کد تأیید بفرستیم.</p>
  <label>آیدی تلگرام</label><input class="in" id="tu" dir="ltr" placeholder="@username">
  <button class="btn" onclick="sendCode()">ارسال کد تأیید</button>
  <button class="btn s" style="margin-top:8px" onclick="showAuth()">بازگشت</button>`;
        if (step === "reg2")
          B.innerHTML =
            head +
            `<h1>تأیید و تکمیل</h1><p class="sub" style="margin:6px 0 22px">کد ۶ رقمی از ربات تلگرام برایت ارسال شد.</p>
  <label>کد تأیید</label><input class="in" id="rc" dir="ltr" inputmode="numeric" maxlength="6">
  <label>نام کاربری</label><input class="in" id="ru" dir="ltr" autocomplete="username">
  <label>رمز عبور</label><input class="in" id="rp" type="password" dir="ltr" autocomplete="new-password">
  ${ref ? `<p class="sub" style="margin-bottom:10px">کد دعوت: <b dir="ltr">${esc(ref)}</b></p>` : ""}
  <button class="btn" onclick="doReg()">ساخت حساب</button>

 <label>متن پاسخ</label><textarea class="in" oninput="ed.response=this.value;updPrev()">${esc(ed.response)}</textarea>

 ${orph.length ? `<label>پاسخ‌های بدون دکمه</label>${orph.map((id) => `<div class="row" style="cursor:default;padding:8px 10px"><div class="g"><b dir="ltr" style="text-align:right;font-size:12px">${esc(id)}</b><small>${esc(ed.cb[id])}</small></div><span class="mini" onclick="cbDel('${esc(id)}')">${ic("trash")}</span></div>`).join("")}` : ""}
 </div>

      const cbDel = guard(async (id) => {
        await api(cbUrl(id), { method: "DELETE" });
        delete ed.cb[id];
        drawCmd();
        toast("حذف شد");
        tCmds();
      });

      /* ───────── Profile / Referral / Admin ───────── */
      const vMe = guard(async () => {
        const nm = user.full_name || user.username || String(user.uid);
        $("view").innerHTML =
          head("پروفایل", "") +
          `<div class="card" style="display:flex;align-items:center;gap:12px"><div class="av" style="width:44px;height:44px;border-radius:50%">${esc(nm.charAt(0))}</div><div><b>${esc(nm)}</b><div class="sub num" dir="ltr">#${user.uid}</div></div></div><div id="rf"></div>
 ${user.is_admin ? `<div class="row" style="margin-top:10px" onclick="go('admin')"><span style="color:var(--ac)">${ic("shield")}</span><div class="g"><b>آمار کل سیستم</b><small>مخصوص مدیر</small></div></div>` : ""}
 <button class="btn d" style="margin-top:14px" onclick="logout()">خروج از حساب</button>`;
        try {
          const r = await api("/api/coins/referral"),
            link = `${WEBAPP}?ref=${r.referral_code || ""}`;
          $("rf").innerHTML =
            '<div style="height:10px"></div>' +
            kpis(
              [
                [r.coins, "سکه", 1],
                [r.referral_count, "دعوت موفق"],
              ],
              2,
            ) +
            `<h2>لینک دعوت · هر دعوت ۱۰۰ سکه</h2><div class="bc"><input class="in" id="rl" dir="ltr" readonly value="${esc(link)}"><div class="ib" onclick="navigator.clipboard.writeText($('rl').value).then(()=>toast('کپی شد'))">${ic("copy")}</div></div>`;
        } catch (e) {}
      });
      const vAdmin = guard(async () => {
        $("view").innerHTML = skel;
        const d = await api("/api/admin/full-stats"),
          o = d.overview || {};
        const list = (t, a, f) => `<h2>${t}</h2>` + ((a || []).length ? a.map(f).join("") : empty("—"));
        const g = (d.daily_growth || []).slice(-7),
          m = Math.max(...g.map((x) => x.new_users), 1);
        $("view").innerHTML =
          head("آمار سیستم", "") +
          kpis([
            [o.total_users, "کاربر", 1],
            [o.total_registered, "ثبت‌نام"],
            [o.total_bots, "ربات"],
            [o.total_active_bots, "فعال"],
          ]) +
          '<div style="height:8px"></div>' +
          kpis([
            [o.total_messages_received, "دریافتی"],
            [o.total_messages_sent, "ارسالی"],
            [o.total_coins, "سکه"],
            [o.total_referrals, "رفرال"],
          ]) +
          (g.length
            ? `<h2>رشد ۷ روز اخیر</h2><div class="card">${g.map((x) => `<div style="display:flex;justify-content:space-between;font-size:12px"><span class="num" dir="ltr">${esc(x.date)}</span><b class="num">${n(x.new_users)}</b></div><div class="bar"><i style="width:${(x.new_users / m) * 100}%"></i></div>`).join('<div style="height:8px"></div>')}</div>`
            : "") +
          list(
            "برترین ربات‌ها",
            d.top_bots,
            (b) =>
              `<div class="row" style="cursor:default"><span class="dot ${b.is_active ? "on" : ""}"></span><div class="g"><b dir="ltr" style="text-align:right">@${esc(b.username || "—")}</b><small>${esc(b.owner_name || "")} · <span class="num">${n(b.users)}</span> کاربر · <span class="num">${n(b.messages)}</span> پیام</small></div></div>`,
          ) +
          list(
            "برترین کاربران",
            d.top_users,
            (u) =>
              `<div class="row" style="cursor:default"><div class="g"><b>${esc(u.name !== "—" ? u.name : u.username || u.telegram_username || "—")}</b><small><span class="num">${n(u.bots_count)}</span> ربات · <span class="num">${n(u.referrals)}</span> رفرال</small></div><span class="tag">${n(u.coins)} 🪙</span></div>`,
          ) +
          list(
            "برترین دعوت‌کننده‌ها",
            d.top_referrers,
            (r) =>
              `<div class="row" style="cursor:default"><div class="g"><b>${esc(r.name)}</b><small dir="ltr" style="text-align:right">@${esc(r.username || "—")}</small></div><span class="tag">${n(r.referral_count)}</span></div>`,
          );
      });

      /* ───────── Boot ───────── */
      async function boot() {
        if (tg?.initData) initData = tg.initData;
        if (!initData && !token) return showAuth();
        try {
          user = await api(initData ? "/api/me" : "/api/auth/me");
          go("home");
        } catch (e) {
          if (!token && !initData) return;
          toast("خطا در اتصال: " + e.message, 1);
          if (/401|نامعتبر/.test(e.message)) showAuth();
        }
      }
      boot();
    </script>
  </body>
</html>
