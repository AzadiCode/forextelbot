<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
    />
    <meta name="theme-color" content="#0d0f12" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f4f6f7" media="(prefers-color-scheme: light)" />
    <meta name="description" content="گرام‌ساز — ربات تلگرامی خودت را بدون کدنویسی بساز." />
    <title>GramSaz · ربات‌ساز</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=Inter:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ─────────  Design tokens  ───────── */
      :root {
        --brand: #cdfb3c;
        --brand-ink: #10140a;
        --brand-soft: rgba(205, 251, 60, 0.14);
        --ok: #34d399;
        --warn: #fbbf24;
        --danger: #fb6b6b;
        --info: #5aa9ff;

        --bg: #0d0f12;
        --bg-elev: #14171b;
        --surface: #171b20;
        --surface-2: #1e232a;
        --line: #262c34;
        --line-soft: #1f242b;
        --tx: #eceef0;
        --tx-mu: #8b939e;
        --tx-dim: #5f6772;
        --shadow: 0 18px 40px -18px rgba(0, 0, 0, 0.65);
        --r-sm: 10px;
        --r: 14px;
        --r-lg: 20px;
        --r-xl: 26px;
      }
      html[data-theme="light"] {
        --brand: #4b7c00;
        --brand-ink: #ffffff;
        --brand-soft: rgba(75, 124, 0, 0.1);
        --ok: #0f9d6f;
        --warn: #b7791f;
        --danger: #d94b4b;
        --info: #2f7de0;

        --bg: #f4f6f7;
        --bg-elev: #ffffff;
        --surface: #ffffff;
        --surface-2: #eef1f3;
        --line: #dde2e6;
        --line-soft: #e7ebee;
        --tx: #14181c;
        --tx-mu: #5c6570;
        --tx-dim: #949ca6;
        --shadow: 0 18px 40px -22px rgba(20, 30, 40, 0.25);
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        background: var(--bg);
        color: var(--tx);
        font:
          15px/1.65 Vazirmatn,
          system-ui,
          sans-serif;
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
      }
      body {
        background-image: radial-gradient(120% 80% at 100% -10%, var(--brand-soft), transparent 55%);
        background-attachment: fixed;
      }
      button,
      input,
      textarea,
      select {
        font: inherit;
        color: inherit;
        border: 0;
        outline: 0;
        background: none;
      }
      a {
        color: inherit;
      }
      svg {
        width: 20px;
        height: 20px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex: none;
      }
      .num,
      .mono,
      .av,
      .tag {
        font-family: Inter, Vazirmatn, sans-serif;
        font-variant-numeric: tabular-nums;
      }
      ::selection {
        background: var(--brand);
        color: var(--brand-ink);
      }

      /* ─────────  Layout  ───────── */
      #view {
        max-width: 540px;
        margin: 0 auto;
        padding: 14px 15px 112px;
        animation: fade 0.22s ease;
      }
      @keyframes fade {
        from {
          opacity: 0;
          transform: translateY(4px);
        }
      }
      h1 {
        font-size: 22px;
        font-weight: 800;
        letter-spacing: -0.2px;
      }
      h2 {
        font-size: 12px;
        color: var(--tx-mu);
        font-weight: 700;
        margin: 24px 3px 9px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .sub {
        color: var(--tx-mu);
        font-size: 13px;
      }
      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin: 4px 0 16px;
      }
      .sec {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: 14px 0 8px;
      }

      /* ─────────  Components  ───────── */
      .card {
        background: var(--surface);
        border: 1px solid var(--line-soft);
        border-radius: var(--r-lg);
        padding: 15px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px;
        background: var(--surface);
        border: 1px solid var(--line-soft);
        border-radius: var(--r);
        margin-bottom: 8px;
        cursor: pointer;
        transition: 0.15s;
      }
      .row:active {
        transform: scale(0.99);
        background: var(--surface-2);
      }
      .row .g {
        flex: 1;
        min-width: 0;
      }
      .row b {
        display: block;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .row small {
        display: block;
        color: var(--tx-mu);
        font-size: 12.5px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        margin-top: 1px;
      }
      .av {
        position: relative;
        width: 40px;
        height: 40px;
        border-radius: 12px;
        background: linear-gradient(150deg, var(--surface-2), var(--surface));
        border: 1px solid var(--line);
        display: grid;
        place-items: center;
        font-size: 15px;
        font-weight: 700;
        color: var(--brand);
        flex: none;
      }
      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--tx-dim);
        flex: none;
      }
      .dot.on {
        background: var(--ok);
        box-shadow: 0 0 0 3px rgba(52, 211, 153, 0.18);
      }
      .av .dot {
        position: absolute;
        bottom: -2px;
        left: -2px;
        border: 2px solid var(--surface);
        box-sizing: content-box;
      }
      .kpis {
        display: grid;
        grid-template-columns: repeat(var(--c, 4), 1fr);
        gap: 8px;
      }
      .kpis > div {
        background: var(--surface);
        border: 1px solid var(--line-soft);
        border-radius: var(--r);
        padding: 12px 6px;
        text-align: center;
      }
      .kpis b {
        display: block;
        font: 800 19px/1.25 Inter, Vazirmatn, sans-serif;
        letter-spacing: -0.5px;
      }
      .kpis span {
        font-size: 11px;
        color: var(--tx-mu);
      }
      .kpis .ac b {
        color: var(--brand);
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        height: 46px;
        padding: 0 18px;
        border-radius: 13px;
        background: var(--brand);
        color: var(--brand-ink);
        font-weight: 700;
        cursor: pointer;
        width: 100%;
        transition: 0.15s;
      }
      .btn:active {
        transform: scale(0.98);
        filter: brightness(0.94);
      }
      .btn:disabled {
        opacity: 0.55;
        cursor: default;
      }
      .btn.ghost {
        background: var(--surface);
        color: var(--tx);
        border: 1px solid var(--line);
      }
      .btn.danger {
        background: rgba(251, 107, 107, 0.12);
        color: var(--danger);
        border: 1px solid transparent;
      }
      .btn.sm {
        height: 36px;
        width: auto;
        padding: 0 13px;
        font-size: 13px;
        border-radius: 11px;
      }
      .btn svg {
        width: 17px;
        height: 17px;
      }
      .ib {
        width: 40px;
        height: 40px;
        border-radius: 12px;
        background: var(--surface);
        border: 1px solid var(--line);
        display: grid;
        place-items: center;
        cursor: pointer;
        flex: none;
        color: var(--tx-mu);
        transition: 0.15s;
      }
      .ib:active {
        background: var(--surface-2);
        transform: scale(0.94);
      }
      .ib.d {
        color: var(--danger);
        background: rgba(251, 107, 107, 0.1);
        border-color: transparent;
      }
      .mini {
        width: 32px;
        height: 32px;
        border-radius: 9px;
        display: grid;
        place-items: center;
        color: var(--tx-mu);
        background: var(--surface-2);
        cursor: pointer;
        flex: none;
      }
      .mini svg {
        width: 17px;
        height: 17px;
      }
      .mini.on {
        color: var(--brand);
      }
      .in {
        width: 100%;
        background: var(--surface-2);
        border: 1px solid var(--line);
        border-radius: 11px;
        padding: 11px 13px;
        margin-bottom: 10px;
        color: var(--tx);
        transition: 0.15s;
      }
      .in:focus {
        border-color: var(--brand);
        box-shadow: 0 0 0 3px var(--brand-soft);
      }
      .in::placeholder {
        color: var(--tx-dim);
      }
      textarea.in {
        min-height: 104px;
        resize: vertical;
        line-height: 1.7;
      }
      .in[dir="ltr"] {
        text-align: left;
      }
      label {
        display: block;
        font-size: 12.5px;
        color: var(--tx-mu);
        font-weight: 600;
        margin: 0 3px 6px;
      }
      .seg {
        display: flex;
        background: var(--surface);
        border: 1px solid var(--line-soft);
        border-radius: 13px;
        padding: 4px;
        margin: 16px 0;
        gap: 4px;
      }
      .seg button {
        flex: 1;
        height: 38px;
        border-radius: 10px;
        color: var(--tx-mu);
        cursor: pointer;
        font-weight: 600;
        font-size: 13.5px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }
      .seg button svg {
        width: 16px;
        height: 16px;
      }
      .seg button.on {
        background: var(--surface-2);
        color: var(--brand);
        box-shadow: inset 0 0 0 1px var(--line);
      }
      .sw {
        position: relative;
        width: 44px;
        height: 26px;
        border-radius: 13px;
        background: var(--line);
        cursor: pointer;
        flex: none;
        transition: 0.22s;
      }
      .sw::after {
        content: "";
        position: absolute;
        top: 3px;
        right: 3px;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: #fff;
        transition: 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      .sw.on {
        background: var(--brand);
      }
      .sw.on::after {
        right: 21px;
      }
      .plug {
        background: var(--surface);
        border: 1px solid var(--line-soft);
        border-radius: var(--r-lg);
        margin-bottom: 10px;
        overflow: hidden;
      }
      .plug .h {
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 13px;
        cursor: pointer;
      }
      .plug .ic {
        width: 38px;
        height: 38px;
        border-radius: 11px;
        background: var(--surface-2);
        display: grid;
        place-items: center;
        color: var(--brand);
        flex: none;
      }
      .plug .g {
        flex: 1;
        min-width: 0;
      }
      .plug .g b {
        display: block;
        font-weight: 600;
      }
      .plug .g small {
        display: block;
        color: var(--tx-mu);
        font-size: 12px;
      }
      .chev {
        color: var(--tx-dim);
        transition: 0.2s;
      }
      .plug.open .chev {
        transform: rotate(180deg);
      }
      .plug .bd {
        display: none;
        padding: 14px;
        border-top: 1px solid var(--line-soft);
        background: var(--bg-elev);
      }
      .plug.open .bd {
        display: block;
      }
      .tag {
        font-size: 11px;
        padding: 2px 9px;
        border-radius: 9px;
        background: var(--surface-2);
        color: var(--tx-mu);
        font-weight: 600;
        white-space: nowrap;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 12px;
        font-weight: 600;
        padding: 3px 10px;
        border-radius: 999px;
      }
      .pill.on {
        background: rgba(52, 211, 153, 0.14);
        color: var(--ok);
      }
      .pill.off {
        background: var(--surface-2);
        color: var(--tx-mu);
      }
      .tabbar {
        position: fixed;
        bottom: max(12px, env(safe-area-inset-bottom));
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 3px;
        background: color-mix(in srgb, var(--surface) 88%, transparent);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 5px;
        z-index: 20;
        box-shadow: var(--shadow);
      }
      .tabbar button {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        width: 66px;
        padding: 8px 0;
        border-radius: 15px;
        color: var(--tx-mu);
        font-size: 11px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.18s;
      }
      .tabbar button.on {
        background: var(--brand);
        color: var(--brand-ink);
      }
      .sheet-bg {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.55);
        backdrop-filter: blur(3px);
        z-index: 40;
        display: none;
        align-items: flex-end;
        justify-content: center;
      }
      .sheet-bg.on {
        display: flex;
      }
      .sheet {
        width: 100%;
        max-width: 540px;
        background: var(--bg);
        border: 1px solid var(--line);
        border-bottom: 0;
        border-radius: var(--r-xl) var(--r-xl) 0 0;
        display: flex;
        flex-direction: column;
        max-height: 92vh;
        animation: up 0.26s cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      @keyframes up {
        from {
          transform: translateY(40px);
          opacity: 0;
        }
      }
      .sh-h {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 14px 16px;
        border-bottom: 1px solid var(--line);
        font-weight: 700;
        position: relative;
      }
      .sh-h::before {
        content: "";
        position: absolute;
        top: 7px;
        left: 50%;
        transform: translateX(-50%);
        width: 38px;
        height: 4px;
        border-radius: 4px;
        background: var(--line);
      }
      .sh-b {
        padding: 16px;
        overflow: auto;
        flex: 1;
      }
      .sh-f {
        display: flex;
        gap: 8px;
        padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
        border-top: 1px solid var(--line);
        background: var(--bg-elev);
      }
      .pfx {
        display: flex;
        align-items: center;
        direction: ltr;
        background: var(--surface-2);
        border: 1px solid var(--line);
        border-radius: 11px;
        padding: 0 13px;
        margin-bottom: 10px;
      }
      .pfx span {
        color: var(--tx-mu);
        margin-right: 2px;
        font-weight: 700;
      }
      .pfx input {
        flex: 1;
        padding: 11px 0;
      }
      .chips {
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
        margin-bottom: 14px;
      }
      .chips span {
        font-size: 12.5px;
        padding: 4px 12px;
        border-radius: 999px;
        background: var(--surface);
        border: 1px solid var(--line);
        color: var(--tx-mu);
        cursor: pointer;
        font-family: Inter, Vazirmatn, sans-serif;
      }
      .chips span:active {
        border-color: var(--brand);
        color: var(--brand);
      }
      .pv {
        background: var(--bg-elev);
        border: 1px dashed var(--line);
        border-radius: 14px;
        padding: 14px;
        margin-bottom: 6px;
      }
      .bub {
        background: var(--surface-2);
        border-radius: 14px 14px 14px 4px;
        padding: 10px 13px;
        white-space: pre-wrap;
        word-break: break-word;
        font-size: 14px;
        max-width: 92%;
        line-height: 1.7;
      }
      .mchip {
        font-size: 11.5px;
        color: var(--tx-mu);
        margin-bottom: 5px;
      }
      .pb {
        display: flex;
        gap: 5px;
        margin-top: 6px;
        max-width: 92%;
      }
      .pb i {
        flex: 1;
        text-align: center;
        background: linear-gradient(180deg, var(--surface-2), var(--surface));
        border: 1px solid var(--line);
        border-radius: 9px;
        padding: 6px;
        font-style: normal;
        font-size: 12.5px;
        font-weight: 600;
        color: var(--brand);
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .brow {
        background: var(--surface);
        border: 1px solid var(--line-soft);
        border-radius: 14px;
        padding: 10px;
        margin-bottom: 8px;
      }
      .bc {
        display: flex;
        gap: 7px;
        align-items: center;
        margin-bottom: 7px;
      }
      .bc .in {
        margin: 0;
        flex: 1;
        min-width: 0;
        padding: 9px 11px;
      }
      .bc .id {
        flex: 0 0 82px;
        font-size: 12px;
      }
      .lnk {
        font-size: 12.5px;
        color: var(--brand);
        cursor: pointer;
        font-weight: 700;
      }
      .med {
        margin: 14px 0;
        background: var(--surface);
        border: 1px solid var(--line-soft);
        border-radius: 14px;
        padding: 12px;
      }
      .med summary {
        cursor: pointer;
        color: var(--tx);
        font-size: 13.5px;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .med summary svg {
        width: 16px;
        height: 16px;
      }
      .med[open] summary {
        margin-bottom: 12px;
      }
      .empty {
        text-align: center;
        color: var(--tx-mu);
        padding: 46px 20px;
      }
      .empty-ic {
        width: 62px;
        height: 62px;
        margin: 0 auto 16px;
        border-radius: 18px;
        background: var(--surface);
        border: 1px dashed var(--line);
        display: grid;
        place-items: center;
        color: var(--brand);
      }
      .empty-ic svg {
        width: 28px;
        height: 28px;
      }
      .skel {
        border-radius: var(--r);
        background: linear-gradient(90deg, var(--surface) 25%, var(--surface-2) 50%, var(--surface) 75%);
        background-size: 200% 100%;
        animation: sh 1.3s infinite linear;
      }
      @keyframes sh {
        to {
          background-position: -200% 0;
        }
      }
      #toast {
        position: fixed;
        top: 14px;
        left: 50%;
        transform: translate(-50%, -90px);
        background: var(--tx);
        color: var(--bg);
        padding: 11px 18px;
        border-radius: 14px;
        font-weight: 600;
        z-index: 99;
        transition: 0.32s cubic-bezier(0.2, 0.8, 0.2, 1);
        max-width: 90%;
        box-shadow: var(--shadow);
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13.5px;
      }
      #toast.on {
        transform: translate(-50%, 0);
      }
      #toast.err {
        background: var(--danger);
        color: #fff;
      }
      #toast.ok {
        background: var(--brand);
        color: var(--brand-ink);
      }
      #auth {
        position: fixed;
        inset: 0;
        background: var(--bg);
        z-index: 60;
        display: none;
        overflow: auto;
        padding: max(48px, 10vh) 22px 40px;
      }
      #auth.on {
        display: block;
      }
      #auth > div {
        max-width: 380px;
        margin: 0 auto;
      }
      .logo {
        width: 60px;
        height: 60px;
        border-radius: 18px;
        background: var(--brand);
        color: var(--brand-ink);
        display: grid;
        place-items: center;
        margin-bottom: 20px;
        box-shadow: var(--shadow);
      }
      .logo svg {
        width: 30px;
        height: 30px;
        stroke-width: 1.9;
      }
      .brand-name {
        font-family: Inter, Vazirmatn, sans-serif;
        font-weight: 800;
        font-size: 13px;
        letter-spacing: 2px;
        color: var(--tx-mu);
        text-transform: uppercase;
      }
      .bar {
        height: 6px;
        border-radius: 4px;
        background: var(--surface-2);
        margin-top: 5px;
        overflow: hidden;
      }
      .bar i {
        display: block;
        height: 100%;
        background: var(--brand);
        border-radius: 4px;
      }
      .hint {
        background: var(--brand-soft);
        border: 1px solid var(--line-soft);
        border-radius: 14px;
        padding: 13px 14px;
        font-size: 13px;
        color: var(--tx);
        line-height: 1.8;
        margin-bottom: 14px;
      }
      .steps {
        counter-reset: s;
        display: grid;
        gap: 10px;
      }
      .step {
        display: flex;
        gap: 11px;
        align-items: flex-start;
        font-size: 13.5px;
        color: var(--tx);
      }
      .step::before {
        counter-increment: s;
        content: counter(s);
        flex: none;
        width: 24px;
        height: 24px;
        border-radius: 8px;
        background: var(--surface-2);
        border: 1px solid var(--line);
        color: var(--brand);
        font-weight: 700;
        font-size: 13px;
        display: grid;
        place-items: center;
        font-family: Inter, sans-serif;
      }
      .grid2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .field-err {
        color: var(--danger);
        font-size: 12px;
        margin: -6px 3px 8px;
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="auth"><div id="authbox"></div></div>
    <div id="view"></div>
    <nav class="tabbar" id="tabs"></nav>
    <div class="sheet-bg" id="sbg" onclick="if (event.target === this) closeSheet();">
      <div class="sheet" id="sheet"></div>
    </div>
    <div id="toast"></div>

    <script>
      "use strict";
      /* ─────────  Config  ───────── */
      const API = "https://forextelbot-9jwt.onrender.com";
      const WEBAPP = "https://botsazgram.onrender.com";
      const tg = window.Telegram?.WebApp || null;
      let initData = "";

      /* ─────────  State  ───────── */
      let token = localStorage.getItem("authToken") || "";
      let user = null;
      let bots = [];
      let bot = null;
      let cmds = {};
      let ed = null;
      let tab = "cmds";
      let botQuery = "";
      let cmdQuery = "";

      const tgRef = new URLSearchParams(location.search).get("ref") || "";
      const ref = tgRef || localStorage.getItem("pending_referral") || "";
      if (ref) localStorage.setItem("pending_referral", ref);

      /* ─────────  Helpers  ───────── */
      const $ = (id) => document.getElementById(id);
      const n = (x) => (+x || 0).toLocaleString("en-US");
      const faNum = (x) => (+x || 0).toLocaleString("fa-IR");
      const esc = (s) =>
        String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
      const debounce = (fn, ms = 200) => {
        let t;
        return (...a) => {
          clearTimeout(t);
          t = setTimeout(() => fn(...a), ms);
        };
      };

      const I = {
        x: '<path d="M6 6l12 12M18 6L6 18"/>',
        down: '<path d="M6 9l6 6 6-6"/>',
        msg: '<path d="M4 5h16v11H9l-5 4z"/>',
        home: '<path d="M3 11l9-8 9 8M5 10v10h14V10"/>',
        bot: '<rect x="4" y="8" width="16" height="12" rx="3"/><path d="M12 4v4M9 13v2M15 13v2"/>',
        plus: '<path d="M12 5v14M5 12h14"/>',
        user: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
        back: '<path d="M9 6l6 6-6 6"/>',
        trash: '<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
        plug: '<path d="M9 3v5M15 3v5M6 8h12v3a6 6 0 01-12 0zM12 17v4"/>',
        send: '<path d="M21 3L3 10l7 3 3 7z"/>',
        lock: '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/>',
        logo: '<path d="M4 12l16-8-4 16-4-6z"/>',
        shield: '<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>',
        copy: '<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 012-2h9"/>',
        search: '<circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/>',
        bolt: '<path d="M13 2L4 14h6l-1 8 9-12h-6z"/>',
        chart: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
        power: '<path d="M12 3v9M6.6 6.6a8 8 0 1010.8 0"/>',
        settings:
          '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.6 1.6 0 00-2.7 1.1V21a2 2 0 11-4 0v-.2a1.6 1.6 0 00-2.7-1.1l-.1.1a2 2 0 11-2.8-2.8l.1-.1A1.6 1.6 0 004.6 15H4a2 2 0 110-4h.2a1.6 1.6 0 001.1-2.7l-.1-.1a2 2 0 112.8-2.8l.1.1A1.6 1.6 0 0011 4.6V4a2 2 0 114 0v.2a1.6 1.6 0 002.7 1.1l.1-.1a2 2 0 112.8 2.8l-.1.1a1.6 1.6 0 00-1.1 2.7H21a2 2 0 110 4h-.2a1.6 1.6 0 00-1.4 1z"/>',
        external: '<path d="M14 4h6v6M20 4l-8 8M18 14v5a1 1 0 01-1 1H5a1 1 0 01-1-1V7a1 1 0 011-1h5"/>',
        link: '<path d="M10 13a5 5 0 007 0l2-2a5 5 0 00-7-7l-1 1M14 11a5 5 0 00-7 0l-2 2a5 5 0 007 7l1-1"/>',
        moon: '<path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/>',
        sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
        image: '<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="M21 16l-5-5L5 20"/>',
        broadcast: '<path d="M3 11v2a1 1 0 001 1h2l4 4V6L6 10H4a1 1 0 00-1 1z"/><path d="M15 8a5 5 0 010 8M18 5a9 9 0 010 14"/>',
        wand: '<path d="M15 4V2M15 10V8M12 6h-2M18 6h-2M4 20l9-9M13.5 6.5l2 2"/>',
        code: '<path d="M8 6l-6 6 6 6M16 6l6 6-6 6"/>',
        grid: '<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',
        coin: '<circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.5 9.5h4a1.5 1.5 0 010 3h-3a1.5 1.5 0 000 3h4"/>',
        gift: '<rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M5 12v9h14v-9M12 8S10 3 7.5 3 5 8 8 8M12 8s2-5 4.5-5S19 8 16 8"/>',
      };
      const ic = (k) => `<svg viewBox="0 0 24 24">${I[k] || ""}</svg>`;

      let tt;
      function toast(m, kind = "") {
        const t = $("toast");
        t.textContent = m;
        t.className = "on" + (kind ? " " + kind : "");
        clearTimeout(tt);
        tt = setTimeout(() => (t.className = ""), 2600);
        haptic(kind === "err" ? "error" : kind === "ok" ? "success" : "light");
      }
      const sure = (m, f) =>
        tg?.showConfirm
          ? tg.showConfirm(m, (res) => res === "ok" && f())
          : confirm(m) && f();
      function haptic(type) {
        try {
          const H = tg?.HapticFeedback;
          if (!H) return;
          if (["light", "medium", "heavy", "rigid", "soft"].includes(type)) H.impactOccurred(type);
          else H.notificationOccurred(type);
        } catch (e) {}
      }

      async function api(p, o = {}) {
        const h = { "Content-Type": "application/json" };
        if (initData) h["X-Init-Data"] = initData;
        if (token) h.Authorization = "Bearer " + token;
        const r = await fetch(API + p, {
          ...o,
          headers: { ...h, ...(o.headers || {}) },
          body: o.body ? JSON.stringify(o.body) : undefined,
        });
        const d = await r.json().catch(() => ({}));
        if (!r.ok) {
          if (r.status === 401 && token) {
            token = "";
            localStorage.removeItem("authToken");
            showAuth();
          }
          throw new Error(d.detail || d.error || "خطای اتصال (" + r.status + ")");
        }
        return d;
      }
      const guard =
        (f) =>
        async (...a) => {
          try {
            return await f(...a);
          } catch (e) {
            toast(e.message, "err");
          }
        };
      const devId = () =>
        localStorage.device_id ||
        (localStorage.device_id = "dev_" + Date.now() + "_" + Math.random().toString(36).slice(2, 11));

      /* ─────────  Theme  ───────── */
      function applyTheme(t) {
        document.documentElement.setAttribute("data-theme", t);
        localStorage.setItem("gs_theme", t);
        try {
          const bg = t === "light" ? "#f4f6f7" : "#0d0f12";
          tg?.setHeaderColor?.(bg);
          tg?.setBackgroundColor?.(bg);
          const m = document.querySelector('meta[name="theme-color"]:not([media])') || (() => {
            const x = document.createElement("meta");
            x.name = "theme-color";
            document.head.appendChild(x);
            return x;
          })();
          m.content = bg;
        } catch (e) {}
      }
      function toggleTheme() {
        const cur = document.documentElement.getAttribute("data-theme") === "light" ? "dark" : "light";
        applyTheme(cur);
        renderThemeBtn();
      }
      function renderThemeBtn() {
        const b = $("themeBtn");
        if (b) b.innerHTML = ic(document.documentElement.getAttribute("data-theme") === "light" ? "moon" : "sun");
      }

      /* ─────────  Auth  ───────── */
      let reg = {};
      function showAuth(step = "login") {
        $("auth").classList.add("on");
        $("tabs").style.display = "none";
        $("view").style.display = "none";
        const brand = `<div class="logo">${ic("logo")}</div><div class="brand-name">GramSaz</div>`;
        const B = $("authbox");
        const themeBtn = `<button class="ib" id="themeBtn" onclick="toggleTheme()" style="position:fixed;top:16px;left:16px">${ic("moon")}</button>`;
        if (step === "login")
          B.innerHTML =
            brand +
            `<h1 style="margin-top:14px">ورود به گرام‌ساز</h1>
             <p class="sub" style="margin:6px 0 24px">ربات تلگرامی خودت را بدون کدنویسی بساز و مدیریت کن.</p>
             <label>نام کاربری</label><input class="in" id="lu" dir="ltr" autocomplete="username" placeholder="username">
             <label>رمز عبور</label><input class="in" id="lp" type="password" dir="ltr" autocomplete="current-password" placeholder="••••••••">
             <button class="btn" onclick="doLogin()">ورود</button>
             <button class="btn ghost" style="margin-top:9px" onclick="showAuth('reg1')">حساب ندارم، ثبت‌نام می‌کنم</button>` +
            themeBtn;
        else if (step === "reg1")
          B.innerHTML =
            brand +
            `<h1 style="margin-top:14px">ساخت حساب</h1>
             <p class="sub" style="margin:6px 0 24px">ابتدا آیدی تلگرامت را وارد کن تا کد تأیید ۶ رقمی برایت ارسال شود.</p>
             <label>آیدی تلگرام</label><input class="in" id="tu" dir="ltr" placeholder="@username" value="${esc(reg.tu || "")}">
             <button class="btn" onclick="sendCode()">ارسال کد تأیید</button>
             <button class="btn ghost" style="margin-top:9px" onclick="showAuth()">بازگشت به ورود</button>` +
            themeBtn;
        else if (step === "reg2")
          B.innerHTML =
            brand +
            `<h1 style="margin-top:14px">تأیید و تکمیل حساب</h1>
             <p class="sub" style="margin:6px 0 24px">کد ۶ رقمی از ربات تلگرام برای <b dir="ltr">${esc(reg.tu || "")}</b> ارسال شد.</p>
             <label>کد تأیید</label><input class="in" id="rc" dir="ltr" inputmode="numeric" maxlength="6" placeholder="۱۲۳۴۵۶" style="letter-spacing:8px;text-align:center">
             <label>نام کاربری</label><input class="in" id="ru" dir="ltr" autocomplete="username" placeholder="username">
             <label>رمز عبور</label><input class="in" id="rp" type="password" dir="ltr" autocomplete="new-password" placeholder="حداقل ۶ کاراکتر" oninput="pwStrength(this.value)">
             <div class="bar" id="pwBar" style="display:none;margin:-4px 0 12px"><i style="width:0"></i></div>
             ${ref ? `<p class="sub" style="margin-bottom:12px">کد دعوت: <b class="mono" dir="ltr">${esc(ref)}</b></p>` : ""}
             <button class="btn" onclick="doReg()">ساخت حساب</button>
             <button class="btn ghost" style="margin-top:9px" onclick="sendCode()">ارسال دوباره کد</button>` +
            themeBtn;
        renderThemeBtn();
      }
      function pwStrength(v) {
        const bar = $("pwBar");
        if (!bar) return;
        bar.style.display = v ? "block" : "none";
        let s = 0;
        if (v.length >= 6) s += 34;
        if (v.length >= 10) s += 20;
        if (/[A-Z]/.test(v) || /[a-z]/.test(v) && /\d/.test(v)) s += 20;
        if (/[^A-Za-z0-9]/.test(v)) s += 26;
        s = Math.min(100, s);
        const fill = bar.firstElementChild;
        fill.style.width = s + "%";
        fill.style.background = s < 40 ? "var(--danger)" : s < 70 ? "var(--warn)" : "var(--ok)";
      }
      const doLogin = guard(async () => {
        const u = $("lu").value.trim();
        const p = $("lp").value;
        if (!u || !p) return toast("نام کاربری و رمز را وارد کن", "err");
        const d = await api("/api/auth/login", { method: "POST", body: { username: u, password: p } });
        token = d.token;
        localStorage.authToken = token;
        boot(true);
      });
      const sendCode = guard(async () => {
        const u = ($("tu")?.value || reg.tu || "").trim();
        if (u.length < 3) return toast("آیدی تلگرام را درست وارد کن", "err");
        reg.tu = u;
        await api("/api/auth/send-code", { method: "POST", body: { telegram_username: u, device_id: devId() } });
        toast("کد ارسال شد، تلگرام را چک کن", "ok");
        showAuth("reg2");
      });
      const doReg = guard(async () => {
        const code = $("rc").value.trim();
        const username = $("ru").value.trim().toLowerCase();
        const password = $("rp").value;
        if (code.length !== 6) return toast("کد باید ۶ رقم باشد", "err");
        if (username.length < 3) return toast("نام کاربری حداقل ۳ کاراکتر", "err");
        if (password.length < 6) return toast("رمز عبور حداقل ۶ کاراکتر", "err");
        const d = await api("/api/auth/register", {
          method: "POST",
          body: {
            telegram_username: reg.tu,
            username,
            password,
            verification_code: code,
            referral_code: ref || null,
            device_id: devId(),
          },
        });
        token = d.token;
        localStorage.authToken = token;
        localStorage.removeItem("pending_referral");
        toast(d.message || "خوش آمدی به گرام‌ساز", "ok");
        boot(true);
      });
      function logout() {
        sure("از حساب خارج می‌شوی؟", async () => {
          try {
            token &&
              (await fetch(API + "/api/auth/logout", {
                method: "POST",
                headers: { Authorization: "Bearer " + token },
              }));
          } catch (e) {}
          token = "";
          localStorage.removeItem("authToken");
          user = null;
          bots = [];
          showAuth();
        });
      }

      /* ─────────  Shell / Router  ───────── */
      const TABS = [
        ["home", "خانه", "home"],
        ["bots", "ربات‌ها", "bot"],
        ["new", "ساخت", "plus"],
        ["me", "پروفایل", "user"],
      ];
      function go(v, a) {
        $("auth").classList.remove("on");
        $("view").style.display = "";
        $("tabs").style.display = "flex";
        $("tabs").innerHTML = TABS.map(
          ([k, t, i]) =>
            `<button class="${v === k || (v === "bot" && k === "bots") || (v === "admin" && k === "me") ? "on" : ""}" onclick="go('${k}')" aria-label="${t}">${ic(i)}${t}</button>`,
        ).join("");
        scrollTo(0, 0);
        haptic("light");
        ({ home: vHome, bots: vBots, new: vNew, bot: vBot, me: vMe, admin: vAdmin })[v](a);
      }
      const head = (t, s, r = "") =>
        `<div class="top"><div style="min-width:0"><h1>${t}</h1>${s ? `<div class="sub">${s}</div>` : ""}</div>${r}</div>`;
      const botRow = (b) =>
        `<div class="row" onclick="go('bot','${b.bot_id}')">
           <span class="av">${esc((b.bot_username || "?")[0].toUpperCase())}<i class="dot ${b.is_running ? "on" : ""}"></i></span>
           <div class="g"><b class="mono" dir="ltr" style="text-align:right">@${esc(b.bot_username || "—")}</b>
           <small><span class="num">${faNum(b.stats?.unique_users)}</span> کاربر · <span class="num">${faNum(b.stats?.messages_received)}</span> پیام</small></div>
           <span class="pill ${b.is_running ? "on" : "off"}">${b.is_running ? "فعال" : "خاموش"}</span>
         </div>`;
      const empty = (t, sub, b = "") =>
        `<div class="empty"><div class="empty-ic">${ic("bot")}</div><b style="font-size:15px;color:var(--tx)">${t}</b>${sub ? `<div class="sub" style="margin-top:4px">${sub}</div>` : ""}${b ? `<div style="margin-top:16px">${b}</div>` : ""}</div>`;
      const skel = `<div class="skel" style="height:78px;margin-bottom:10px"></div><div class="skel" style="height:64px;margin-bottom:8px"></div><div class="skel" style="height:64px"></div>`;
      const kpis = (a, c = a.length) =>
        `<div class="kpis" style="--c:${c}">${a.map(([v, t, h]) => `<div class="${h ? "ac" : ""}"><b>${faNum(v)}</b><span>${t}</span></div>`).join("")}</div>`;
      const S = (k) => bots.reduce((t, b) => t + (b.stats?.[k] || 0), 0);

      const vHome = guard(async () => {
        $("view").innerHTML = skel;
        ({ bots } = await api("/api/bots"));
        const act = bots.filter((b) => b.is_running).length;
        const hour = new Date().getHours();
        const greet = hour < 12 ? "صبح بخیر" : hour < 18 ? "ظهر بخیر" : "شب بخیر";
        $("view").innerHTML =
          `<div class="top"><div style="min-width:0"><div class="sub">${greet} 👋</div><h1>${esc((user.full_name || user.username || "").split(" ")[0])}</h1></div>
           <button class="ib" id="themeBtn" onclick="toggleTheme()"></button></div>` +
          kpis([
            [S("unique_users"), "کل کاربران", 1],
            [bots.length, "ربات"],
            [act, "روشن"],
            [S("messages_received"), "پیام"],
          ]) +
          `<div class="sec"><h2 style="margin:22px 3px 0">دسترسی سریع</h2></div>
           <div class="grid2">
             <div class="row" style="margin:0;flex-direction:column;align-items:flex-start;gap:8px;padding:15px" onclick="go('new')">
               <span class="plug" style="width:38px;height:38px;border-radius:11px;background:var(--surface-2);display:grid;place-items:center;color:var(--brand);border:0;margin:0">${ic("plus")}</span>
               <div><b>ساخت ربات</b><small>با توکن BotFather</small></div>
             </div>
             <div class="row" style="margin:0;flex-direction:column;align-items:flex-start;gap:8px;padding:15px" onclick="go('bots')">
               <span style="width:38px;height:38px;border-radius:11px;background:var(--surface-2);display:grid;place-items:center;color:var(--brand)">${ic("grid")}</span>
               <div><b>ربات‌های من</b><small><span class="num">${faNum(bots.length)}</span> ربات</small></div>
             </div>
           </div>` +
          `<div class="sec"><h2 style="margin:20px 3px 0">ربات‌های اخیر</h2>${bots.length ? `<span class="lnk" onclick="go('bots')">همه</span>` : ""}</div>` +
          (bots.length
            ? bots.slice(0, 4).map(botRow).join("")
            : empty(
                "هنوز رباتی نساخته‌ای",
                "در سه قدم ساده با BotFather رباتت را بساز.",
                `<button class="btn" style="max-width:240px" onclick="go('new')">${ic("plus")} ساخت اولین ربات</button>`,
              ));
        renderThemeBtn();
      });

      const vBots = guard(async () => {
        $("view").innerHTML = skel;
        ({ bots } = await api("/api/bots"));
        botQuery = "";
        $("view").innerHTML =
          head("ربات‌ها", `<span class="num">${faNum(bots.length)}</span> ربات`, `<div class="ib" onclick="go('new')">${ic("plus")}</div>`) +
          (bots.length
            ? `<div class="bc"><span style="color:var(--tx-dim)">${ic("search")}</span><input class="in" id="bq" dir="rtl" placeholder="جست‌وجوی ربات..." oninput="filterBots(this.value)" style="border:0;background:transparent;margin:0;padding:8px 0"></div><div id="blist">${bots.map(botRow).join("")}</div>`
            : empty(
                "رباتی نداری",
                "اولین رباتت را همین حالا بساز.",
                `<button class="btn" style="max-width:240px" onclick="go('new')">${ic("plus")} ساخت ربات</button>`,
              ));
      });
      const filterBots = (q) => {
        const t = q.trim().toLowerCase();
        const list = bots.filter(
          (b) => !t || (b.bot_username || "").toLowerCase().includes(t.replace("@", "")),
        );
        $("blist").innerHTML = list.length
          ? list.map(botRow).join("")
          : `<div class="empty" style="padding:26px"><div class="sub">موردی یافت نشد.</div></div>`;
      };

      function vNew() {
        $("view").innerHTML =
          head("ربات جدید", "در ۳ گام ساده") +
          `<div class="card" style="margin-bottom:14px"><div class="steps">
            <div class="step">در تلگرام به <a href="https://t.me/BotFather" style="color:var(--brand);font-weight:700" target="_blank" rel="noopener">@BotFather</a> پیام بده.</div>
            <div class="step">دستور <b class="mono" dir="ltr">/newbot</b> را بفرست و نام و کاربری ربات را انتخاب کن.</div>
            <div class="step">توکنی که می‌گیری را در کادر پایین بچسبان.</div>
          </div></div>
          <label>توکن ربات</label>

           ${user.is_admin ? `<div class="row" onclick="go('admin')"><span style="color:var(--brand)">${ic("shield")}</span><div class="g"><b>آمار کل سیستم</b><small>پنل مدیریت</small></div></div>` : ""}
           <div class="row" onclick="go('bots')"><span style="color:var(--brand)">${ic("bot")}</span><div class="g"><b>ربات‌های من</b><small><span class="num">${bots.length}</span> ربات</small></div></div>
           <button class="btn danger" style="margin-top:16px" onclick="logout()">${ic("x")} خروج از حساب</button>
           <p class="sub" style="text-align:center;margin-top:18px">GramSaz · نسخه وب‌اپ ۲</p>`;
        $("themeTag").textContent = document.documentElement.getAttribute("data-theme") === "light" ? "روشن" : "تاریک";
        try {
          const r = await api("/api/coins/referral");
          const link = `${WEBAPP}?ref=${r.referral_code || ""}`;
          $("rf").innerHTML =
            kpis(
              [
                [r.coins, "سکه", 1],
                [r.referral_count, "دعوت موفق"],
              ],
              2,
            ) +
            `<h2>کد دعوت · هر دعوت ۱۰۰ سکه</h2>
             <div class="bc" style="margin-bottom:0"><input class="in mono" id="rl" dir="ltr" readonly value="${esc(link)}" style="margin:0"><button class="ib" onclick="navigator.clipboard.writeText($('rl').value).then(()=>toast('کپی شد','ok'))">${ic("copy")}</button></div>`;
        } catch (e) {
          $("rf").innerHTML = "";
        }
      });

      const vAdmin = guard(async () => {
        $("view").innerHTML = skel;
        const d = await api("/api/admin/full-stats");
        const o = d.overview || {};
        const list = (t, a, f) => `<h2>${t}</h2>` + ((a || []).length ? a.map(f).join("") : `<div class="sub" style="padding:6px 4px">—</div>`);
        const g = (d.daily_growth || []).slice(-7);
        const mx = Math.max(...g.map((x) => x.new_users), 1);
        $("view").innerHTML =
          head(
            "آمار سیستم",
            "نمای کلی",
            `<div class="ib" onclick="go('me')">${ic("back")}</div>`,
          ) +
          kpis([
            [o.total_users, "کاربر", 1],
            [o.total_registered, "ثبت‌نام"],
            [o.total_bots, "ربات"],
            [o.total_active_bots, "فعال"],
          ]) +
          '<div style="height:10px"></div>' +
          kpis([
            [o.total_messages_received, "دریافتی"],
            [o.total_messages_sent, "ارسالی"],
            [o.total_coins, "سکه"],
            [o.total_referrals, "دعوت"],
          ]) +
          (g.length
            ? `<h2>رشد ۷ روز اخیر</h2><div class="card">${g
                .map(
                  (x) =>
                    `<div style="display:flex;justify-content:space-between;font-size:12.5px"><span class="num mono" dir="ltr">${esc(x.date)}</span><b class="num">${faNum(x.new_users)} کاربر</b></div><div class="bar"><i style="width:${(x.new_users / mx) * 100}%"></i></div>`,
                )
                .join('<div style="height:9px"></div>')}</div>`
            : "") +
          list(
            "برترین ربات‌ها",
            d.top_bots,
            (b) =>
              `<div class="row" style="cursor:default"><span class="dot ${b.is_active ? "on" : ""}"></span><div class="g"><b class="mono" dir="ltr" style="text-align:right">@${esc(b.username || "—")}</b><small>${esc(b.owner_name || "")} · <span class="num">${faNum(b.users)}</span> کاربر · <span class="num">${faNum(b.messages)}</span> پیام</small></div></div>`,
          ) +
          list(
            "برترین کاربران",
            d.top_users,
            (u) =>
              `<div class="row" style="cursor:default"><div class="g"><b>${esc(u.name !== "—" ? u.name : u.username || u.telegram_username || "—")}</b><small><span class="num">${faNum(u.bots_count)}</span> ربات · <span class="num">${faNum(u.referrals)}</span> دعوت</small></div><span class="tag">${faNum(u.coins)} سکه</span></div>`,
          ) +
          list(
            "برترین دعوت‌کننده‌ها",
            d.top_referrers,
            (r) =>
              `<div class="row" style="cursor:default"><span class="av">${esc((r.name || "?").charAt(0))}</span><div class="g"><b>${esc(r.name)}</b><small class="mono" dir="ltr" style="text-align:right">@${esc(r.username || "—")}</small></div><span class="tag">${faNum(r.referral_count)} دعوت</span></div>`,
          );
      });

      /* ─────────  Boot  ───────── */
      async function boot(manual) {
        if (tg?.initData) initData = tg.initData;
        if (!initData && !token) return showAuth();
        try {
          user = await api(initData && !manual ? "/api/me" : token ? "/api/auth/me" : "/api/me");
          go("home");
        } catch (e) {
          if (!token && !initData) return;
          toast("خطا در اتصال: " + e.message, "err");
          if (/401|نامعتبر|unauthor/i.test(e.message)) showAuth();
        }
      }

      /* init Telegram + theme */
      if (tg) {
        tg.ready();
        tg.expand();
        try {
          tg.applyHeaderColor?.("bg_color");
        } catch (e) {}
      }
      const savedTheme =
        localStorage.getItem("gs_theme") ||
        (tg?.colorScheme === "light" ? "light" : "dark");
      applyTheme(savedTheme);
      boot(false);
    </script>
  </body>
</html>
