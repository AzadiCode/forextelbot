<!doctype html>
<html lang="fa" dir="rtl" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
    <meta name="theme-color" content="#0b0c0e" />
    <meta name="color-scheme" content="dark light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>ربات‌ساز — استودیو</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #0b0c0e; --panel: #131519; --panel2: #1a1d22; --hair: #262a31; --hair2: #333844;
        --tx: #e7eaef; --mu: #828a99;
        --ac: #57c8c1; --ac2: #57c8c1;                 /* فیروزه‌ای مات — بدون بنفش/گرادیان */
        --ac-soft: color-mix(in srgb, var(--ac) 12%, transparent);
        --ok: #46c98d; --red: #e0685f; --amber: #d7a53f;
        --r: 14px; --r2: 11px; --maxw: 460px;
        --sh: 0 1px 0 rgba(255,255,255,.02), 0 10px 24px -18px rgba(0,0,0,.8);
        --grid: repeating-linear-gradient(0deg, transparent 0 23px, color-mix(in srgb,var(--hair) 45%,transparent) 23px 24px);
        --mono: "JetBrains Mono", ui-monospace, monospace;
      }
      html[data-theme="light"] {
        --bg: #eef0f2; --panel: #ffffff; --panel2: #f3f5f7; --hair: #dfe3e8; --hair2: #cfd5dd;
        --tx: #14171c; --mu: #5f6773;
        --ac: #159e97; --ac2: #159e97; --ac-soft: color-mix(in srgb, var(--ac) 10%, transparent);
        --ok: #0f9d63; --red: #c9483f; --amber: #9a6b12;
        --sh: 0 1px 0 rgba(255,255,255,.5), 0 8px 20px -16px rgba(20,23,28,.25);
      }
      * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
      html, body { background: var(--bg); color: var(--tx); font: 14.5px/1.7 Vazirmatn, system-ui, sans-serif; min-height: 100vh; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
      button, input, textarea, select { font: inherit; color: inherit; border: 0; outline: 0; background: none; }
      a { color: inherit; text-decoration: none; }
      svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
      .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }        /* اعداد انگلیسی */
      ::selection { background: var(--ac); color: #04121a; }
      ::-webkit-scrollbar { width: 0; height: 0; }
      #app { max-width: var(--maxw); margin: 0 auto; padding: 12px 14px 116px; }
      .fade { animation: fade .28s cubic-bezier(.2,.7,.2,1); }
      @keyframes fade { from { opacity: 0; transform: translateY(8px); } }

      /* ── primitives ── */
      .bar { display: flex; align-items: center; justify-content: space-between; margin: 6px 2px 16px; gap: 10px; }
      .bar .idn { display: flex; align-items: center; gap: 11px; min-width: 0; }
      .bar small { display: block; color: var(--mu); font-size: 12.5px; }
      .bar b { font-size: 17px; font-weight: 700; display: block; line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      h2 { font-size: 11px; color: var(--mu); font-weight: 700; letter-spacing: .6px; margin: 22px 3px 10px; display: flex; align-items: center; justify-content: space-between; text-transform: uppercase; }
      .lnk { color: var(--ac); font-size: 13px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
      .ava { width: 42px; height: 42px; border-radius: 12px; background: var(--panel2); border: 1px solid var(--hair2); color: var(--tx); display: grid; place-items: center; font-weight: 700; font-size: 17px; flex: none; }
      .av2 { position: relative; width: 42px; height: 42px; border-radius: 12px; background: var(--ac-soft); border: 1px solid var(--hair); display: grid; place-items: center; font-weight: 700; color: var(--ac); flex: none; }
      .av2.grad { background: var(--ac); color: #04121a; border: 0; }
      .live { position: absolute; bottom: -1px; left: -1px; width: 12px; height: 12px; border-radius: 50%; background: var(--mu); border: 3px solid var(--panel); }
      .live.on { background: var(--ok); box-shadow: 0 0 0 4px color-mix(in srgb, var(--ok) 16%, transparent); }
      .pill { font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 999px; }
      .pill.on { color: var(--ok); background: color-mix(in srgb, var(--ok) 13%, transparent); }
      .pill.off { color: var(--mu); background: var(--panel2); }
      .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 47px; padding: 0 18px; border-radius: var(--r2); background: var(--ac); color: #04121a; font-weight: 700; cursor: pointer; width: 100%; transition: transform .1s, opacity .1s; }
      .btn:active { transform: scale(.98); opacity: .92; }
      .btn:disabled { opacity: .45; }
      .btn.line { background: var(--panel); color: var(--tx); border: 1px solid var(--hair2); }
      .btn.red { background: color-mix(in srgb, var(--red) 12%, transparent); color: var(--red); border: 1px solid color-mix(in srgb,var(--red) 30%,transparent); }
      .btn.sm { height: 38px; width: auto; padding: 0 14px; font-size: 13px; }
      .btn svg { width: 18px; height: 18px; }
      .ib { width: 38px; height: 38px; border-radius: 11px; background: var(--panel); border: 1px solid var(--hair); display: grid; place-items: center; cursor: pointer; color: var(--mu); flex: none; transition: .15s; }
      .ib:active { background: var(--panel2); transform: scale(.93); }
      #fab { position: fixed; bottom: calc(max(14px, env(safe-area-inset-bottom)) + 76px); inset-inline-end: max(16px, calc(50vw - var(--maxw)/2 + 14px)); width: 54px; height: 54px; border-radius: 16px; background: var(--ac); color: #04121a; display: grid; place-items: center; cursor: pointer; z-index: 25; transition: transform .15s; box-shadow: 0 10px 24px -12px color-mix(in srgb,var(--ac) 60%,transparent); }
      #fab svg { width: 26px; height: 26px; stroke-width: 2.1; }
      #fab:active { transform: scale(.9); }
      #fab.hide { display: none; }
      #nav { position: fixed; bottom: max(14px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); display: none; gap: 2px; width: min(var(--maxw), calc(100vw - 22px)); background: color-mix(in srgb, var(--panel) 92%, transparent); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid var(--hair); border-radius: 16px; padding: 5px; z-index: 20; box-shadow: var(--sh); }
      #nav button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 0 7px; border-radius: 11px; color: var(--mu); font-size: 11px; font-weight: 600; cursor: pointer; transition: .16s; }
      #nav button svg { width: 21px; height: 21px; }
      #nav button.on { color: var(--ac); background: var(--ac-soft); }
      label { display: block; font-size: 12px; color: var(--mu); font-weight: 600; margin: 14px 3px 6px; }
      .in { width: 100%; background: var(--panel2); border: 1px solid var(--hair); border-radius: var(--r2); padding: 12px 13px; color: var(--tx); transition: .15s; }
      .in:focus { border-color: var(--ac); box-shadow: 0 0 0 3px var(--ac-soft); }
      .in::placeholder { color: var(--mu); opacity: .55; }
      textarea.in { min-height: 96px; resize: vertical; line-height: 1.8; }
      .in.ltr { text-align: left; direction: ltr; }
      .sw { position: relative; width: 48px; height: 28px; border-radius: 14px; background: var(--hair2); cursor: pointer; flex: none; transition: .22s; }
      .sw::after { content: ""; position: absolute; top: 3px; right: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: .22s cubic-bezier(.34,1.3,.64,1); box-shadow: 0 2px 5px rgba(0,0,0,.25); }
      .sw.on { background: var(--ac); }
      .sw.on::after { right: 23px; }
      .seg { display: flex; background: var(--panel); border: 1px solid var(--hair); border-radius: 12px; padding: 4px; margin: 16px 0; gap: 4px; }
      .seg button { flex: 1; height: 38px; border-radius: 9px; color: var(--mu); cursor: pointer; font-weight: 600; font-size: 12.5px; transition: .16s; display: flex; align-items: center; justify-content: center; gap: 6px; }
      .seg button svg { width: 16px; height: 16px; }
      .seg button.on { background: var(--ac-soft); color: var(--ac); }
      .item { display: flex; align-items: center; gap: 12px; padding: 13px; background: var(--panel); border: 1px solid var(--hair); border-radius: var(--r); margin-bottom: 8px; cursor: pointer; transition: border-color .14s, transform .14s; }
      .item:active { border-color: var(--ac); transform: scale(.995); }
      .item.static { cursor: default; }
      .item.static:active { transform: none; }
      .item .g { flex: 1; min-width: 0; }
      .item b { display: block; font-weight: 600; }
      .item small { display: block; color: var(--mu); font-size: 12px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .sq { width: 40px; height: 40px; border-radius: 11px; background: var(--panel2); border: 1px solid var(--hair); display: grid; place-items: center; color: var(--ac); flex: none; }
      .badge { font-size: 10.5px; font-weight: 600; padding: 3px 8px; border-radius: 8px; background: var(--panel2); color: var(--mu); border: 1px solid var(--hair); white-space: nowrap; font-family: var(--mono); }
      .badge.url { color: var(--amber); }
      .badge.on { color: var(--ok); }
      .del { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; color: var(--mu); cursor: pointer; flex: none; }
      .del:active { color: var(--red); background: color-mix(in srgb, var(--red) 12%, transparent); }
      .del.on { color: var(--ac); background: var(--ac-soft); }
      .card { background: var(--panel); border: 1px solid var(--hair); border-radius: var(--r); padding: 15px; box-shadow: var(--sh); }
      #scrim { position: fixed; inset: 0; background: rgba(0,0,0,.62); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); z-index: 40; display: none; justify-content: center; align-items: flex-end; }
      #scrim.on { display: flex; }
      .sheet { width: min(var(--maxw), 100vw); max-height: 92vh; background: var(--bg); border: 1px solid var(--hair); border-bottom: 0; border-radius: 20px 20px 0 0; display: flex; flex-direction: column; animation: up .3s cubic-bezier(.2,.8,.2,1); }
      @keyframes up { from { transform: translateY(40px); opacity: 0; } }
      .sh-h { display: flex; align-items: center; justify-content: space-between; padding: 15px 15px; border-bottom: 1px solid var(--hair); font-weight: 700; }
      .sh-b { padding: 15px; overflow: auto; flex: 1; }
      .sh-f { display: flex; gap: 8px; padding: 12px 15px calc(14px + env(safe-area-inset-bottom)); border-top: 1px solid var(--hair); }
      .pfx { display: flex; align-items: center; direction: ltr; background: var(--panel2); border: 1px solid var(--hair); border-radius: var(--r2); padding: 0 13px; }
      .pfx b { color: var(--mu); font-weight: 700; }
      .pfx input { flex: 1; padding: 12px 0; text-align: left; }
      .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 9px; }
      .chips span { font: 500 12px var(--mono); padding: 5px 11px; border-radius: 999px; background: var(--panel); border: 1px solid var(--hair); color: var(--mu); cursor: pointer; }
      .chips span:active { border-color: var(--ac); color: var(--ac); }
      .pv { background: var(--panel); border: 1px solid var(--hair); border-radius: var(--r); padding: 13px; margin-top: 8px; }
      .bub { background: var(--panel2); border-radius: 13px 13px 13px 5px; padding: 10px 13px; white-space: pre-wrap; word-break: break-word; font-size: 13.5px; line-height: 1.8; max-width: 92%; border: 1px solid var(--hair); }
      .bubrow { display: flex; gap: 5px; margin-top: 6px; max-width: 92%; }
      .bubrow i { flex: 1; text-align: center; font-style: normal; background: var(--ac-soft); border: 1px solid var(--hair); border-radius: 9px; padding: 7px; font-size: 12.5px; color: var(--ac); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .brow { background: var(--panel); border: 1px solid var(--hair); border-radius: var(--r); padding: 10px; margin-bottom: 8px; }
      .brow .r { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
      .brow .r .in { flex: 1; min-width: 0; padding: 9px 11px; }
      .brow .r .id { flex: 0 0 80px; font-size: 12px; }
      .btype { display: flex; background: var(--panel2); border: 1px solid var(--hair); border-radius: 9px; padding: 3px; gap: 2px; }
      .btype button { flex: 1; padding: 6px 8px; border-radius: 7px; font-size: 11.5px; font-weight: 600; color: var(--mu); cursor: pointer; }
      .btype button.on { background: var(--ac); color: #04121a; }
      details.med { margin-top: 14px; background: var(--panel); border: 1px solid var(--hair); border-radius: var(--r); padding: 0 14px; }
      details.med summary { list-style: none; cursor: pointer; padding: 14px 0; font-weight: 600; display: flex; align-items: center; gap: 8px; }
      details.med summary::-webkit-details-marker { display: none; }
      details.med[open] { padding-bottom: 14px; }
      details.med[open] summary { border-bottom: 1px solid var(--hair); margin-bottom: 12px; }
      .kw { display: inline-flex; align-items: center; gap: 5px; font: 500 12px var(--mono); padding: 4px 10px; border-radius: 8px; background: var(--ac-soft); color: var(--ac); border: 1px solid var(--hair); }
      .chart { display: flex; align-items: flex-end; gap: 5px; height: 80px; padding-top: 6px; }
      .chart .col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; }
      .chart .cbar { width: 100%; border-radius: 4px 4px 0 0; background: var(--ac); opacity: .85; min-height: 3px; transition: height .3s; }
      .chart .clab { font-size: 10px; color: var(--mu); font-family: var(--mono); }
      .empty { text-align: center; color: var(--mu); padding: 40px 20px; }
      .empty .ic { width: 58px; height: 58px; margin: 0 auto 14px; border-radius: 18px; background: var(--panel); border: 1px dashed var(--hair2); display: grid; place-items: center; color: var(--ac); }
      .empty .ic svg { width: 28px; height: 28px; }
      .empty b { color: var(--tx); font-weight: 600; font-size: 15px; }
      .bar2 { height: 4px; border-radius: 3px; background: var(--panel2); margin-top: 7px; overflow: hidden; }
      .bar2 i { display: block; height: 100%; background: var(--ac); transition: .3s; }
      #toast { position: fixed; top: 14px; left: 50%; transform: translate(-50%,-80px); background: var(--tx); color: var(--bg); padding: 11px 18px; border-radius: 12px; font-weight: 600; font-size: 13.5px; z-index: 99; transition: .3s cubic-bezier(.2,.8,.2,1); max-width: 90%; box-shadow: var(--sh); }
      #toast.on { transform: translate(-50%,0); }
      #toast.err { background: var(--red); color: #fff; }
      #auth { position: fixed; inset: 0; background: var(--bg); z-index: 60; display: none; overflow: auto; padding: max(48px,10vh) 24px 40px; }
      #auth.on { display: block; }
      #auth > div { max-width: 330px; margin: 0 auto; }
      .mark { width: 54px; height: 54px; border-radius: 15px; background: var(--ac); color: #04121a; display: grid; place-items: center; margin-bottom: 24px; }
      .mark svg { width: 30px; height: 30px; stroke-width: 1.9; }
      .word { position: fixed; top: 20px; right: 20px; font: 600 11px var(--mono); letter-spacing: 2px; color: var(--mu); }
      #theme { position: fixed; top: 15px; left: 15px; width: 40px; height: 40px; border-radius: 12px; background: var(--panel); border: 1px solid var(--hair); display: grid; place-items: center; cursor: pointer; color: var(--mu); z-index: 70; }
      .field { margin-bottom: 12px; }
      .err { color: var(--red); font-size: 12px; margin: 6px 3px 0; min-height: 1px; }
      .err.good { color: var(--ok); }

      /* ── رباتیک: هدرِ خط‌کش‌دار ── */
      .panel-h { position: relative; background: var(--panel); border: 1px solid var(--hair); border-radius: var(--r); padding: 18px 16px; margin-bottom: 18px; overflow: hidden; }
      .panel-h::before { content: ""; position: absolute; inset: 0; background: var(--grid); opacity: .5; -webkit-mask-image: linear-gradient(180deg,#000,transparent); mask-image: linear-gradient(180deg,#000,transparent); pointer-events: none; }
      .panel-h > * { position: relative; }
      .panel-h h1 { font-size: 19px; font-weight: 800; line-height: 1.5; }
      .panel-h p { color: var(--mu); font-size: 13px; margin-top: 4px; }
      .panel-h .tag { display: inline-flex; align-items: center; gap: 6px; font: 600 10.5px var(--mono); letter-spacing: 1px; color: var(--ac); background: var(--ac-soft); border: 1px solid var(--hair); padding: 3px 9px; border-radius: 999px; margin-bottom: 12px; }
      .panel-h .btn { margin-top: 14px; }
      .sk { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: -4px -14px 12px; padding: 4px 14px; }
      .sk::-webkit-scrollbar { display: none; }
      .sk .item { flex: 0 0 auto; margin: 0; padding: 9px 12px; border-radius: 11px; gap: 8px; }
      .sk .item b { font-size: 13px; }
      .strip { display: flex; background: var(--panel); border: 1px solid var(--hair); border-radius: var(--r); overflow: hidden; box-shadow: var(--sh); }
      .strip > div { flex: 1; padding: 14px 4px; text-align: center; }
      .strip > div + div { border-inline-start: 1px solid var(--hair); }
      .strip b { display: block; font: 600 19px/1.2 var(--mono); letter-spacing: -.5px; }
      .strip .ac b { color: var(--ac); }
      .strip span { font-size: 10.5px; color: var(--mu); }
      .bot { display: flex; align-items: center; gap: 12px; padding: 14px; background: var(--panel); border: 1px solid var(--hair); border-radius: var(--r); margin-bottom: 9px; cursor: pointer; box-shadow: var(--sh); transition: transform .14s, border-color .14s; }
      .bot:active { transform: scale(.995); border-color: var(--ac); }
      .bot .g { flex: 1; min-width: 0; }
      .bot b { display: block; font-weight: 600; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .bot small { display: block; color: var(--mu); font-size: 12px; margin-top: 2px; font-family: var(--mono); }

      /* ── کارِخانهٔ مراحل ── */
      .steps { display: flex; flex-direction: column; gap: 0; margin-top: 6px; }
      .step { display: flex; gap: 13px; padding: 14px; border: 1px solid var(--hair); background: var(--panel); border-radius: var(--r); margin-bottom: 9px; position: relative; }
      .step .num { width: 30px; height: 30px; border-radius: 9px; background: var(--panel2); border: 1px solid var(--hair2); color: var(--mu); display: grid; place-items: center; font: 600 14px var(--mono); flex: none; }
      .step.done .num { background: var(--ac); color: #04121a; border: 0; }
      .step.act { border-color: var(--ac); box-shadow: 0 0 0 3px var(--ac-soft); }
      .step .c { flex: 1; min-width: 0; }
      .step .c b { font-size: 14px; display: block; }
      .step .c small { display: block; color: var(--mu); font-size: 12.5px; margin-top: 2px; line-height: 1.6; }
      .step .c .in { margin-top: 10px; }
      .step .foot { margin-top: 10px; display: flex; gap: 8px; }

      /* ── شبکهٔ افزونه‌ها ── */
      .plug { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      .plug .p { position: relative; background: var(--panel); border: 1px solid var(--hair); border-radius: var(--r); padding: 13px; cursor: pointer; overflow: hidden; }
      .plug .p:active { border-color: var(--ac); transform: scale(.99); }
      .plug .p .st { position: absolute; top: 11px; left: 11px; width: 7px; height: 7px; border-radius: 50%; background: var(--hair2); }
      .plug .p.on .st { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb,var(--ok) 20%,transparent); }
      .plug .p .sq { margin-bottom: 8px; width: 36px; height: 36px; }
      .plug .p b { font-size: 13.5px; display: block; }
      .plug .p small { display: block; color: var(--mu); font-size: 11.5px; margin-top: 2px; line-height: 1.5; }

      /* ════ نقشهٔ جریان ربات (Flow Map) ════ */
      .flow-toolbar { display: flex; align-items: center; gap: 6px; margin: 8px 2px 12px; }
      .flow-toolbar .tb-title { font-size: 12.5px; color: var(--mu); flex: 1; min-width: 0; }
      .flow-toolbar .tb-title b { color: var(--tx); font-family: var(--mono); }
      .flow-canvas {
        position: relative; overflow: hidden; height: calc(100vh - 250px); min-height: 420px; direction: ltr;
        background:
          radial-gradient(circle at 50% 50%, color-mix(in srgb, var(--ac) 5%, transparent) 0%, transparent 60%),
          var(--bg);
        border: 1px solid var(--hair); border-radius: var(--r); touch-action: none; user-select: none; -webkit-user-select: none;
      }
      .flow-canvas::before {
        content: ""; position: absolute; inset: -200px; pointer-events: none; z-index: 0; opacity: .55;
        background-image:
          linear-gradient(90deg, transparent 23px, color-mix(in srgb, var(--hair) 55%, transparent) 23px 24px),
          linear-gradient(0deg,  transparent 23px, color-mix(in srgb, var(--hair) 55%, transparent) 23px 24px);
        background-size: 24px 24px;
        transform: translate(var(--pdx, 0px), var(--pdy, 0px));
      }
      .flow-world {
        position: absolute; inset: 0; transform: translate(var(--pdx,0), var(--pdy,0)) scale(var(--z, 1));
        transform-origin: 0 0; will-change: transform;
      }
      .flow-svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; overflow: visible; }
      .flow-svg path.wire { fill: none; stroke: var(--hair2); stroke-width: 2; }

      .flow-svg path.wire.draft { stroke: var(--ac); stroke-dasharray: 5 4; }
      .node {
        position: absolute; left: 0; top: 0; width: 200px; min-height: 74px; z-index: 2; direction: rtl;

      .node.on, .node:active { border-color: var(--ac); box-shadow: 0 10px 24px -14px color-mix(in srgb, var(--ac) 60%, transparent), 0 0 0 3px color-mix(in srgb, var(--ac) 18%, transparent); }

      .node .nt { color: var(--mu); font-size: 11.5px; line-height: 1.5; max-height: 48px; overflow: hidden; padding-inline-start: 30px; margin-bottom: 6px; }
      .node .nb { display: flex; align-items: center; justify-content: space-between; padding-inline-start: 30px; }
      .node .nb .acts { display: flex; gap: 4px; }
      .node .nib { width: 26px; height: 26px; border-radius: 8px; background: var(--panel2); border: 1px solid var(--hair); color: var(--mu); display: grid; place-items: center; cursor: pointer; }
      .node .nib.on { color: var(--ac); border-color: var(--ac); background: color-mix(in srgb, var(--ac) 14%, transparent); }
      .node .nib svg { width: 14px; height: 14px; }
      .node .nib:active { transform: scale(.93); }
      .node .nicon { width: 24px; height: 24px; border-radius: 8px; display: grid; place-items: center; flex: none; }
      .node.cmd .nicon { background: color-mix(in srgb, var(--ac) 18%, transparent); color: var(--ac); }
      .node.img .nicon { background: color-mix(in srgb, #d97706 18%, transparent); color: #d97706; }
      .node.ticket .nicon { background: color-mix(in srgb, #ef4444 18%, transparent); color: #ef4444; }
      .node.url  .nicon { background: color-mix(in srgb, #10b981 18%, transparent); color: #10b981; }
      .node .in, .node textarea.in { font-size: 12px; padding: 6px 8px; }
      .node.wide { width: 260px; }
      .port { position: absolute; width: 16px; height: 16px; border-radius: 50%; background: var(--bg); border: 2.5px solid var(--hair2); top: 50%; margin-top: -8px; cursor: crosshair; z-index: 4; transition: border-color .15s, background .15s, box-shadow .15s; }
      .port::after { content: ""; position: absolute; inset: -10px; }        /* enlarge touch target */
      .port.out { right: -9px; }
      .port.in  { left: -9px; }
      .port:hover, .port.on { border-color: var(--ac); background: var(--ac); box-shadow: 0 0 0 4px color-mix(in srgb, var(--ac) 25%, transparent); }
      .port.src { border-color: var(--ac); background: var(--ac); }
      .flow-empty { position: absolute; inset: 20% 10% auto; text-align: center; color: var(--mu); pointer-events: none; }
      .flow-empty .big { font-size: 40px; color: var(--hair2); }
      .flow-hint { position: absolute; inset: auto 8px 8px 8px; text-align: center; color: var(--mu); font-size: 11.5px; pointer-events: none; }
      .flow-hint kbd { font-family: var(--mono); background: var(--panel2); border: 1px solid var(--hair); padding: 1px 6px; border-radius: 4px; font-size: 10.5px; }
      .flow-palette { display: flex; gap: 6px; overflow-x: auto; padding: 4px 2px 10px; }
      .flow-palette button { flex: none; display: flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 999px; background: var(--panel); border: 1px solid var(--hair); color: var(--tx); font-size: 12px; font-weight: 600; cursor: pointer; transition: .15s; }
      .flow-palette button:active { transform: scale(.95); background: var(--panel2); border-color: var(--ac); color: var(--ac); }
      .flow-palette button svg { width: 14px; height: 14px; }

      @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

    <script>
      "use strict";
      /* ── ربات‌ساز — استودیو. پوستهٔ جدید روی همان منطق/قراردادهای پنل قبلی. ── */
      const API = "https://forextelbot-9jwt.onrender.com";

      const tg = window.Telegram?.WebApp || null;
      let initData = "";
      let token = localStorage.getItem("authToken") || "";
      let user = null, bots = [], bot = null, cmds = {}, rules = [], ed = null, rd = null, tab = "cmds", botId = null;
      const ref = new URLSearchParams(location.search).get("ref") || localStorage.getItem("pending_referral") || "";
      if (ref) localStorage.setItem("pending_referral", ref);

      const $ = (id) => document.getElementById(id);
      const app = () => $("app");
      const n = (x) => String(+x || 0);                                  /* اعداد انگلیسی */
      const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
      const I = {
        x: '<path d="M6 6l12 12M18 6L6 18"/>', down: '<path d="M6 9l6 6 6-6"/>', msg: '<path d="M4 5h16v11H9l-5 4z"/>',
        home: '<path d="M3 11l9-8 9 8M5 10v10h14V10"/>', bot: '<rect x="4" y="8" width="16" height="12" rx="3"/><path d="M12 4v4M9 13v2M15 13v2"/>',
        plus: '<path d="M12 5v14M5 12h14"/>', user: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>', users: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.5 3-5.5 6.5-5.5s6.5 2 6.5 5.5M16 5a3.5 3.5 0 010 7M17.5 14.5c2.5.5 4 2.5 4 5"/>',
        back: '<path d="M9 6l6 6-6 6"/>', next: '<path d="M15 6l-6 6 6 6"/>', trash: '<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
        plug: '<path d="M9 3v5M15 3v5M6 8h12v3a6 6 0 01-12 0zM12 17v4"/>', send: '<path d="M21 3L3 10l7 3 3 7z"/>',
        lock: '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/>', logo: '<path d="M4 12l16-8-4 16-4-6z"/>',
        shield: '<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>', copy: '<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 012-2h9"/>',
        bolt: '<path d="M13 2L4 14h6l-1 8 9-12h-6z"/>', code: '<path d="M8 6l-6 6 6 6M16 6l6 6-6 6"/>', search: '<circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/>',
        gear: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.6 1.6 0 00-2.7 1.1V21a2 2 0 11-4 0v-.2A1.6 1.6 0 004.5 19.7l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.6 1.6 0 001.1-2.7H2a2 2 0 110-4h.2a1.6 1.6 0 001.1-2.7l-.1-.1a2 2 0 112.8-2.8l.1.1a1.6 1.6 0 002.7-1.1V2a2 2 0 114 0v.2a1.6 1.6 0 002.7 1.1l.1-.1a2 2 0 112.8 2.8l-.1.1a1.6 1.6 0 00-1.1 2.7H22a2 2 0 110 4h-.2a1.6 1.6 0 00-1.4 1z"/>',
        open: '<path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 01-1 1H5a1 1 0 01-1-1V7a1 1 0 011-1h5"/>', moon: '<path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/>',
        sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M5 5l1.4 1.4M17.6 17.6L19 19M2 12h2M20 12h2M5 19l1.4-1.4M17.6 6.4L19 5"/>',
        image: '<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="M21 16l-5-5L5 20"/>',
        cast: '<path d="M2 16a6 6 0 016 6M2 12a10 10 0 0110 10M2 8a14 14 0 0114 14"/><circle cx="3" cy="21" r="1"/>',
        coin: '<circle cx="12" cy="12" r="9"/><path d="M12 7v10M9 9.5h4a1.5 1.5 0 010 3h-3a1.5 1.5 0 000 3h4"/>',
        logout: '<path d="M15 4h3a2 2 0 012 2v12a2 2 0 01-2 2h-3M10 17l5-5-5-5M15 12H3"/>',
        wave: '<path d="M18 11V6a2 2 0 00-4 0M14 10V4a2 2 0 00-4 0v2M10 10.5V6a2 2 0 00-4 0v8"/><path d="M18 8a2 2 0 014 0v6a8 8 0 01-8 8h-2c-2.8 0-4.5-.9-6-2.4L4 18"/>',
        help: '<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 014 2c0 1.5-2 2-2 3M12 17h.01"/>',
        link: '<path d="M10 13a5 5 0 007 0l2-2a5 5 0 00-7-7l-1 1M14 11a5 5 0 00-7 0l-2 2a5 5 0 007 7l1-1"/>',
        sync: '<path d="M4 4v6h6M20 20v-6h-6M20 8a8 8 0 00-14-3M4 16a8 8 0 0014 3"/>',
        spark: '<path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/>',
        eye: '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/>',
        dev: '<path d="M12 2l3 3-3 3-3-3z"/><path d="M5 12l3 3-3 3M19 12l-3 3 3 3"/>', check: '<path d="M4 12l5 5 11-11"/>',
        chart: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>', download: '<path d="M12 3v12M7 11l5 4 5-4M5 21h14"/>', power: '<path d="M12 3v9M6.4 6.4a8 8 0 1011.2 0"/>',
        map: '<rect x="3" y="4" width="7" height="6" rx="1.6"/><rect x="14" y="4" width="7" height="6" rx="1.6"/><rect x="8.5" y="15" width="7" height="6" rx="1.6"/><path d="M6.5 10v2.5a2 2 0 002 2h1.5M17.5 10v2.5a2 2 0 01-2 2h-1.5"/>',
        ticket: '<path d="M3 9V6.5A1.5 1.5 0 014.5 5h15A1.5 1.5 0 0121 6.5V9a3 3 0 000 6v2.5a1.5 1.5 0 01-1.5 1.5h-15A1.5 1.5 0 013 17.5V15a3 3 0 000-6z"/><path d="M13 8v8"/>',
        zoomin: '<circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4M11 8v6M8 11h6"/>', zoomout: '<circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4M8 11h6"/>',
        fit: '<path d="M4 9V5a1 1 0 011-1h4M15 4h4a1 1 0 011 1v4M20 15v4a1 1 0 01-1 1h-4M9 20H5a1 1 0 01-1-1v-4"/>', center: '<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.5"/>'
      };

      const ic = (k) => `<svg viewBox="0 0 24 24">${I[k] || ""}</svg>`;

      let tt;
      function toast(m, e) { const t = $("toast"); t.textContent = m; t.className = "on" + (e ? " err" : ""); clearTimeout(tt); tt = setTimeout(() => (t.className = ""), 2600); hap(e ? "error" : "success"); }
      function hap(t) { try { const H = tg?.HapticFeedback; if (!H) return; ["light","medium","heavy","rigid","soft"].includes(t) ? H.impactOccurred(t) : H.notificationOccurred(t); } catch (e) {} }
      const sure = (m, f) => (tg?.showConfirm ? tg.showConfirm(m, (r) => r === "ok" && f()) : confirm(m) && f());

      async function api(p, o = {}) {
        const h = { "Content-Type": "application/json" };
        if (initData) h["X-Init-Data"] = initData;
        if (token) h.Authorization = "Bearer " + token;
        const r = await fetch(API + p, { ...o, headers: { ...h, ...(o.headers || {}) }, body: o.body ? JSON.stringify(o.body) : undefined });
        const d = await r.json().catch(() => ({}));
        if (!r.ok) {
          if (r.status === 401 && token) { token = ""; localStorage.removeItem("authToken"); showAuth(); }
          throw new Error(d.detail || d.error || "خطای اتصال (" + r.status + ")");
        }
        return d;
      }
      const guard = (f) => async (...a) => { try { return await f(...a); } catch (e) { toast(e.message, 1); } };
      const devId = () => localStorage.device_id || (localStorage.device_id = "dev_" + Date.now() + "_" + Math.random().toString(36).slice(2, 11));

      function applyTheme(t) {
        document.documentElement.setAttribute("data-theme", t); localStorage.setItem("gs_theme", t);
        $("theme").innerHTML = ic(t === "light" ? "moon" : "sun");
        const c = t === "light" ? "#eef0f2" : "#0b0c0e";
        document.querySelector('meta[name="theme-color"]').content = c;
        try { tg?.setHeaderColor?.(c); tg?.setBackgroundColor?.(c); } catch (e) {}
      }
      function toggleTheme() { applyTheme(document.documentElement.getAttribute("data-theme") === "light" ? "dark" : "light"); hap("light"); }

      /* ── احراز هویت ── */
      let reg = {};
      function showAuth(step = "login") {
        $("auth").classList.add("on"); $("nav").style.display = "none"; $("fab").classList.add("hide");
        const B = $("authbox"); const head = `<div class="word">BOTSAZ</div><div class="mark">${ic("logo")}</div>`;
        if (step === "login") B.innerHTML = head + `<h1 style="font-size:22px;font-weight:800">ورود به استودیو</h1><p style="color:var(--mu);margin:6px 0 24px">وارد شو و ربات‌هایت را مدیریت کن.</p><div class="field"><label>نام کاربری</label><input class="in ltr" id="lu" placeholder="username" autocomplete="username"></div><div class="field"><label>رمز عبور</label><div style="position:relative"><input class="in ltr" id="lp" type="password" placeholder="••••••••" autocomplete="current-password" style="padding-left:46px"><span class="del" onclick="pwEye(this)" style="position:absolute;left:6px;top:50%;transform:translateY(-50%)">${ic("eye")}</span></div></div><button class="btn" onclick="doLogin()">ورود</button><button class="btn line" style="margin-top:9px" onclick="showAuth('reg1')">ساخت حساب جدید</button>`;
        else if (step === "reg1") B.innerHTML = head + `<h1 style="font-size:22px;font-weight:800">ثبت‌نام</h1><p style="color:var(--mu);margin:6px 0 24px">آیدی تلگرامت را بده تا کد تأیید بفرستیم.</p><div class="field"><label>آیدی تلگرام</label><input class="in ltr" id="tu" placeholder="@username" value="${esc(reg.tu || "")}"></div><button class="btn" onclick="sendCode()">ارسال کد تأیید</button><button class="btn line" style="margin-top:9px" onclick="showAuth()">بازگشت به ورود</button>`;
        else if (step === "reg2") B.innerHTML = head + `<h1 style="font-size:22px;font-weight:800">تکمیل حساب</h1><p style="color:var(--mu);margin:6px 0 24px">کد ۶ رقمی برای <b dir="ltr">${esc(reg.tu || "")}</b> ارسال شد.</p><div class="field"><label>کد تأیید</label><input class="in" id="rc" inputmode="numeric" maxlength="6" placeholder="000000" style="text-align:center;letter-spacing:10px;direction:ltr;font-family:var(--mono)"></div><div class="field"><label>نام کاربری</label><input class="in ltr" id="ru" placeholder="username"></div><div class="field"><label>رمز عبور</label><input class="in ltr" id="rp" type="password" placeholder="حداقل ۶ کاراکتر" oninput="pwbar(this.value)"><div class="bar2" id="pwBar" style="display:none"><i style="width:0"></i></div></div>${ref ? `<p style="color:var(--mu);font-size:13px;margin:-2px 2px 14px">کد دعوت: <b class="mono">${esc(ref)}</b></p>` : ""}<button class="btn" onclick="doReg()">ساخت حساب</button><button class="btn line" style="margin-top:9px" onclick="sendCode()">ارسال دوباره کد</button>`;
      }
      function pwEye(el) { const i = el.parentElement.querySelector("input"); i.type = i.type === "password" ? "text" : "password"; el.style.color = i.type === "text" ? "var(--ac)" : "var(--mu)"; }
      function pwbar(v) { const bar = $("pwBar"); if (!bar) return; bar.style.display = v ? "block" : "none"; let s = (v.length >= 6 ? 40 : 0) + (v.length >= 10 ? 30 : 0) + (/[0-9]/.test(v) ? 15 : 0) + (/[^A-Za-z0-9]/.test(v) ? 15 : 0); const f = bar.firstElementChild; f.style.width = Math.min(100, s) + "%"; f.style.background = s < 45 ? "var(--red)" : s < 75 ? "var(--amber)" : "var(--ok)"; }
      const doLogin = guard(async () => { const u = $("lu").value.trim(), p = $("lp").value; if (!u || !p) return toast("نام کاربری و رمز را وارد کن", 1); token = (await api("/api/auth/login", { method: "POST", body: { username: u, password: p } })).token; localStorage.authToken = token; boot(true); });
      const sendCode = guard(async () => { const u = ($("tu")?.value || reg.tu || "").trim(); if (u.length < 3) return toast("آیدی تلگرام را درست وارد کن", 1); reg.tu = u; await api("/api/auth/send-code", { method: "POST", body: { telegram_username: u, device_id: devId() } }); toast("کد ارسال شد — تلگرام را چک کن"); showAuth("reg2"); });
      const doReg = guard(async () => { const code = $("rc").value.trim(), username = $("ru").value.trim().toLowerCase(), password = $("rp").value; if (code.length !== 6) return toast("کد باید ۶ رقم باشد", 1); if (username.length < 3) return toast("نام کاربری کوتاه است", 1); if (password.length < 6) return toast("رمز عبور کوتاه است", 1); const d = await api("/api/auth/register", { method: "POST", body: { telegram_username: reg.tu, username, password, verification_code: code, referral_code: ref || null, device_id: devId() } }); token = d.token; localStorage.authToken = token; localStorage.removeItem("pending_referral"); toast(d.message || "ثبت‌نام موفق"); boot(true); });
      function logout() { sure("از حساب خارج می‌شوی؟", async () => { try { token && (await fetch(API + "/api/auth/logout", { method: "POST", headers: { Authorization: "Bearer " + token } })); } catch (e) {} token = ""; user = null; localStorage.removeItem("authToken"); showAuth(); }); }

      /* ── ناوبری جدید: خانه(ساخت) · توسعه · پروفایل ── */
      const TABS = [["home", "خانه", "home"], ["dev", "توسعه", "dev"], ["me", "پروفایل", "user"]];
      function chrome(v) {
        $("auth").classList.remove("on"); $("nav").style.display = "flex";
        $("nav").innerHTML = TABS.map(([k, t, i]) => `<button class="${v === k ? "on" : ""}" onclick="go('${k}')">${ic(i)}${t}</button>`).join("");

      function go(v, a) { chrome(v); scrollTo(0, 0); hap("light"); ({ home: vHome, bot: vBot, dev: vDev, me: vMe, admin: vAdmin })[v](a); }
      const S = (k) => bots.reduce((t, b) => t + (b.stats?.[k] || 0), 0);
      const empty = (t, s, btn, icon) => `<div class="empty"><div class="ic">${ic(icon || "bot")}</div><b>${t}</b><div style="margin-top:5px">${s}</div>${btn ? `<div style="margin-top:18px">${btn}</div>` : ""}</div>`;

      /* ════ خانه = مسیر آموزشیِ ساخت و فعال‌سازی (Wizard) ════ */
      const TOKEN = /^\d{8,12}:[A-Za-z0-9_-]{30,}$/;
      const vHome = guard(async () => {
        ({ bots } = await api("/api/bots"));
        const connected = bots.length > 0;
        const active = bots.some((b) => b.is_running);
        const configured = connected && Object.keys(bot?.commands || {}).length > 0;
        app().className = "";
        const steps = `
          <div class="steps">
            <div class="step ${connected ? "done" : "act"}" id="s1">
              <div class="num">${connected ? ic("check") : "1"}</div>
              <div class="c"><b>${connected ? "ربات متصل است" : "اتصال ربات"}</b>
              <small>${connected ? `@${esc(bots[0].bot_username)} — ${n(bots.length)} ربات فعال در استودیو.` : "توکن ربات را از @BotFather بگیر و همین‌جا وصلش کن."}</small>
              ${connected ? "" : `<div class="in pfx" style="margin-top:10px"><b>@</b><input class="mono ltr" id="tk" placeholder="123456789:AAH…" oninput="th()"></div><div class="err" id="tke"></div><div class="foot"><button class="btn" style="height:42px" id="mk" onclick="mkBot()">${ic("bolt")} اتصال و ساخت</button></div>`}

              <svg class="flow-svg" id="fs" xmlns="http://www.w3.org/2000/svg"></svg>
            </div>
            <div class="flow-hint" id="fhint"></div>
          </div>
          <div style="color:var(--mu);font-size:11.5px;margin:8px 4px 12px">ساختار به مدل <b class="mono">commands + callbacks</b> فعلی کامپایل می‌شود — همان چیزی که الان روی ربات اجرا می‌شود. اتصال دکمه به تصویر/تیکت نیازمند «پچِ بک‌اند» است و پس از فعال‌سازی آزاد می‌شود.</div>
          <div style="color:var(--mu);font-size:11.5px;margin:2px 4px 8px">راهنما: یک کارت را بگیر و جابه‌جا کن. برای اتصال، از نقطهٔ سمتِ چپ کارتِ مبدأ شروع کن و روی مقصد رها کن. چرخ ماوس = جابه‌جایی، <kbd>Ctrl</kbd> + چرخ = زوم.</div>
        `;
        tMapRedraw();
        requestAnimationFrame(() => { flowFit(); const c = $("fc"); if (c) c.addEventListener("wheel", flowWheel, { passive: false }); });
      });

      /* ── کاربران ── */
      let allUsers = [];
      const tUsers = guard(async () => {
        const d = await api(`/api/bots/${botId}/users`); allUsers = d.users || [];
        $("tb").innerHTML = `<div style="display:flex;align-items:center;gap:10px;margin:2px 2px 12px"><span style="color:var(--mu);font-size:13px" class="mono">${n(allUsers.length)} users</span></div>
          <div class="item static" style="margin-bottom:12px;padding:4px 12px"><span style="color:var(--mu)">${ic("search")}</span><input class="in" placeholder="جست‌وجوی نام، آیدی یا شماره" oninput="fu(this.value)" style="border:0;background:transparent;box-shadow:none;padding:11px 8px"></div>
          <div id="ul">${allUsers.length ? allUsers.map(userRow).join("") : empty("کاربری نیست", "وقتی کسی /start بزند اینجا می‌آید.", "", "users")}</div>`;
      });
      function userRow(u) { const nm = u.name || u.username || ("#" + u.uid); const at = u.username ? "@" + u.username : "#" + u.uid; const day = (u.joined || "").slice(0, 10);
        return `<div class="item static"><span class="av2" style="width:36px;height:36px">${esc(nm.charAt(0))}</span><div class="g"><b>${esc(nm)}</b><small class="mono">${esc(at)} · ${esc(day)}</small></div>${u.username ? `<a class="badge" href="https://t.me/${esc(u.username)}" target="_blank" rel="noopener" style="text-decoration:none">telegram</a>` : ""}</div>`; }
      const fu = (q) => { const t = q.trim().toLowerCase(); const list = allUsers.filter((u) => !t || String(u.uid).includes(t) || (u.name || "").toLowerCase().includes(t) || (u.username || "").toLowerCase().includes(t)); $("ul").innerHTML = list.length ? list.map(userRow).join("") : `<div class="empty" style="padding:22px"><div style="color:var(--mu)">موردی یافت نشد.</div></div>`; };

      /* ── مدیریت (تنظیمات) ── */
      const tSet = guard(async () => {
        const g = bot.daily_stats || {}; const days = Object.keys(g).sort().slice(-7); const mx = Math.max(...days.map((d) => g[d].new_users || 0), 1);
        const backup = JSON.stringify(bot.commands || {});
        $("tb").innerHTML =
          (days.length ? `<h2 style="margin-top:4px">رشد کاربران · ۷ روز</h2><div class="card"><div class="chart">${days.map((d) => `<div class="col"><div class="cbar" style="height:${Math.max(6, ((g[d].new_users || 0) / mx) * 100)}%"></div><span class="clab">${d.slice(8)}</span></div>`).join("")}</div></div>` : "") +
          `<h2>منوی تلگرام</h2><div class="card" style="margin-bottom:10px"><p style="color:var(--mu);font-size:13px;margin-bottom:12px">دستورها را به منوی رسمی ربات اضافه می‌کند.</p><button class="btn line" id="syncb" onclick="syncMenu()">${ic("sync")} همگام‌سازی منو</button></div>
           <h2>پشتیبان / توسعه‌دهنده</h2><div class="card" style="margin-bottom:10px"><p style="color:var(--mu);font-size:13px;margin-bottom:10px">JSON دستورها را برون‌بَر یا درون‌ریزی کن.</p><div style="display:flex;gap:8px"><button class="btn line sm" style="flex:1" onclick="expJson()">${ic("download")} خروجی</button><button class="btn line sm" style="flex:1" onclick="impJson()">${ic("code")} ورودی</button></div></div>
           <h2>حذف</h2><div class="card"><p style="color:var(--mu);font-size:13px;margin-bottom:12px">حذف ربات برگشت‌ناپذیر است.</p><button class="btn red" onclick="delBot()">${ic("trash")} حذف ربات</button></div>`;
        window.__backup = backup;
      });
      function expJson() { navigator.clipboard?.writeText(window.__backup || "{}").then(() => toast("JSON کپی شد")) || toast("در دسترس نیست", 1); }
      function impJson() { const s = prompt("JSON دستورها را بچسبان:"); if (!s) return; let o; try { o = JSON.parse(s); } catch (e) { return toast("JSON نامعتبر", 1); } guard(async () => { for (const [name, c] of Object.entries(o)) { await api(`/api/bots/${botId}/commands/${name}`, { method: "PUT", body: { response: c.response || "", description: c.description || "", buttons: c.buttons || null, photo: c.photo || null, media: c.media || null } }); if (c.callbacks) for (const [id, r] of Object.entries(c.callbacks)) await api(`/api/bots/${botId}/commands/${name}/callbacks/${encodeURIComponent(id)}`, { method: "PUT", body: { response: r } }); } toast("بازیابی شد"); tSet(); tCmds(); })(); }
      const syncMenu = guard(async () => { const b = $("syncb"); b.disabled = true; b.textContent = "در حال همگام‌سازی…"; try { const r = await api(`/api/bots/${botId}/sync-menu`, { method: "POST" }); toast(r.message || "همگام شد"); } finally { b && ((b.disabled = false), (b.innerHTML = ic("sync") + " همگام‌سازی منو")); } });
      const delBot = () => sure("ربات برای همیشه حذف شود؟", guard(async () => { await api("/api/bots/" + botId, { method: "DELETE" }); toast("حذف شد"); go("dev"); }));

      /* ── ویرایشگر دستور (منطق دست‌نخوردهٔ پنل خودت) ── */
      const nb = () => ({ text: "", id: "", r: "", o: 0, url: "", t: "cb" });
      function openCmd(i) { const k = i < 0 ? "" : ck[i], c = i < 0 ? {} : cmds[k], cb = c.callbacks || {};
        ed = { name: k, isNew: i < 0, response: c.response || "", description: c.description || "", cb, m: c.media?.url ? { ...c.media } : c.photo ? { type: "photo", url: c.photo } : { type: "photo", url: "" }, b: (c.buttons || []).map((r) => r.map((x) => ({ ...x, t: x.url ? "url" : "cb", r: cb[x.id] || "", o: 0 }))) };
        drawCmd(); $("scrim").classList.add("on"); }
      const closeSheet = () => $("scrim").classList.remove("on");
      function prev() { const p = $("pv"); if (!p) return; const rows = ed.b.map((r) => r.filter((x) => x.text.trim())).filter((r) => r.length); p.innerHTML = (ed.m.url ? `<div style="color:var(--mu);font-size:11.5px;margin-bottom:6px">${ic("image")} ${MT[ed.m.type]}</div>` : "") + `<div class="bub">${esc(ed.response) || '<span style="color:var(--mu)">پیش‌نمایش پاسخ…</span>'}</div>` + rows.map((r) => `<div class="bubrow">${r.map((x) => `<i>${x.t === "url" ? "🔗 " : ""}${esc(x.text)}</i>`).join("")}</div>`).join(""); }
      const rmBtn = (r, b) => { ed.b[r].splice(b, 1); if (!ed.b[r].length) ed.b.splice(r, 1); drawCmd(); };
      function setBType(ri, bi, t) { ed.b[ri][bi].t = t; if (t === "url") ed.b[ri][bi].o = 0; drawCmd(); }
      function drawCmd() { const top = $("shb")?.scrollTop || 0, m = ed.m; const canDel = !ed.isNew && ed.name !== "start"; const orph = Object.keys(ed.cb).filter((id) => !ed.b.flat().some((x) => x.id === id));
        $("sheet").innerHTML = `<div class="sh-h"><span class="mono">${ed.isNew ? "دستور جدید" : "/" + esc(ed.name)}</span><div class="ib" onclick="closeSheet()">${ic("x")}</div></div>
          <div class="sh-b" id="shb">
            ${ed.isNew ? `<label>نام دستور</label><div class="pfx"><b>/</b><input class="mono" placeholder="help" value="${esc(ed.name)}" oninput="ed.name=this.value"></div><div class="chips">${["help", "about", "contact", "rules", "support"].map((x) => `<span onclick="ed.name='${x}';drawCmd()">/${x}</span>`).join("")}</div>` : ""}
            <label>توضیح (منوی تلگرام)</label><input class="in" placeholder="مثلاً راهنمای ربات" value="${esc(ed.description)}" oninput="ed.description=this.value">
            <label>متن پاسخ</label><textarea class="in" oninput="ed.response=this.value;prev()">${esc(ed.response)}</textarea>
            <label>پیش‌نمایش</label><div class="pv" id="pv"></div>
            <label style="display:flex;justify-content:space-between;align-items:center">دکمه‌ها <span class="lnk" onclick="ed.b.push([nb()]);drawCmd()">+ ردیف</span></label>
            ${ed.b.length ? ed.b.map((row, ri) => `<div class="brow">${row.map((x, bi) => `<div class="r"><input class="in" placeholder="متن دکمه" value="${esc(x.text)}" oninput="ed.b[${ri}][${bi}].text=this.value;prev()"><div class="btype" style="flex:0 0 116px"><button class="${x.t === "cb" ? "on" : ""}" onclick="setBType(${ri},${bi},'cb')">پاسخ</button><button class="${x.t === "url" ? "on" : ""}" onclick="setBType(${ri},${bi},'url')">لینک</button></div><span class="del" onclick="rmBtn(${ri},${bi})">${ic("trash")}</span></div>${x.t === "url" ? `<div class="r" style="margin-bottom:0"><input class="in ltr mono" placeholder="https://…" value="${esc(x.url)}" oninput="ed.b[${ri}][${bi}].url=this.value;prev()"></div>` : `<div class="r" style="margin-bottom:0"><input class="in id mono ltr" placeholder="شناسه" value="${esc(x.id)}" oninput="ed.b[${ri}][${bi}].id=this.value"><span class="del ${x.r ? "on" : ""}" onclick="toggleR(${ri},${bi})">${ic("msg")}</span></div>${x.o ? `<textarea class="in" style="min-height:52px;margin-top:6px" placeholder="پاسخ این دکمه" oninput="ed.b[${ri}][${bi}].r=this.value">${esc(x.r)}</textarea>` : ""}`}`).join("")}${row.length < 3 ? `<span class="lnk" onclick="ed.b[${ri}].push(nb());drawCmd()">+ دکمه</span>` : ""}</div>`).join("") + `<p style="color:var(--mu);font-size:12.5px;margin-top:4px">«پاسخ» متن برمی‌گرداند؛ «لینک» کاربر را به آدرس می‌برد.</p>` : `<p style="color:var(--mu);font-size:13px">دکمه‌ای اضافه نشده.</p>`}
            <details class="med" ${m.url ? "open" : ""}><summary>${ic("image")} رسانه (اختیاری)</summary><div style="display:flex;gap:6px;margin-bottom:8px"><select class="in" style="flex:0 0 96px" onchange="ed.m.type=this.value;prev()">${Object.entries(MT).map(([k, t]) => `<option value="${k}" ${m.type === k ? "selected" : ""}>${t}</option>`).join("")}</select><input class="in mono ltr" placeholder="https://…" value="${esc(m.url)}" oninput="ed.m.url=this.value;prev()"></div><input type="file" id="mf" hidden onchange="up(this.files[0])"><button class="btn line sm" onclick="$('mf').click()">آپلود فایل</button></details>
            ${orph.length ? `<label>پاسخ‌های بدون دکمه</label>${orph.map((id) => `<div class="item static"><div class="g"><b class="mono ltr" style="text-align:right;font-size:12px">${esc(id)}</b><small>${esc(ed.cb[id])}</small></div><span class="del" onclick="cbDel('${esc(id)}')">${ic("trash")}</span></div>`).join("")}` : ""}
          </div>
          <div class="sh-f">${canDel ? `<div class="ib" style="width:46px;color:var(--red)" onclick="delCmd()">${ic("trash")}</div>` : ""}<button class="btn" onclick="saveCmd()">ذخیره</button></div>`;
        prev(); $("shb").scrollTop = top; }
      function toggleR(ri, bi) { const x = ed.b[ri][bi]; x.o = x.o ? 0 : 1; if (!x.o) x.r = ""; drawCmd(); }
      async function _upload(f) { const fd = new FormData(); fd.append("file", f); const h = {}; if (token) h.Authorization = "Bearer " + token; if (initData) h["X-Init-Data"] = initData; const r = await fetch(API + "/api/upload-media", { method: "POST", headers: h, body: fd }); const d = await r.json(); if (!r.ok) throw new Error(d.error || "خطا در آپلود"); return d; }
      const up = guard(async (f) => { if (!f) return; toast("در حال آپلود…"); const d = await _upload(f); ed.m = { type: d.type, url: d.url }; drawCmd(); toast("آپلود شد"); });
      const cbUrl = (id) => `/api/bots/${botId}/commands/${ed.name}/callbacks/${encodeURIComponent(id)}`;
      const refreshTab = () => { if (tab === "map") tMap(); else if (tab === "plug") tPlug(); else if (tab === "users") tUsers(); else if (tab === "set") tSet(); else tCmds(); };
      const saveCmd = guard(async () => { const name = ed.name.trim().toLowerCase().replace(/^\//, "").replace(/\s+/g, "_"); if (!name) return toast("نام دستور خالی است", 1); if (!ed.response.trim()) return toast("متن پاسخ خالی است", 1); const rows = ed.b.map((r) => r.filter((x) => x.text.trim())).filter((r) => r.length); rows.flat().forEach((x) => { x.text = x.text.trim(); if (x.t === "url") { x.url = (x.url || "").trim(); if (x.url && !/^https?:\/\//.test(x.url)) x.url = "https://" + x.url; } else { x.id = x.id.trim().replace(/\s+/g, "_") || "btn_" + Math.random().toString(36).slice(2, 8); } }); const u = (ed.m.url || "").trim(), ok = /^https?:\/\//.test(u);
        const payload = { response: ed.response.trim(), description: ed.description.trim(), buttons: rows.length ? rows.map((r) => r.map((x) => x.t === "url" ? { text: x.text, url: x.url } : { text: x.text, id: x.id })) : null, photo: ok && ed.m.type === "photo" ? u : null, media: ok ? { type: ed.m.type, url: u } : null };
        await api(`/api/bots/${botId}/commands/${name}`, { method: "PUT", body: payload }); ed.name = name;
        await Promise.all(rows.flat().filter((x) => x.t !== "url").map((x) => { const v = (x.r || "").trim(), old = ed.cb[x.id]; if (v && v !== old) return api(cbUrl(x.id), { method: "PUT", body: { response: v } }); if (!v && old !== undefined) return api(cbUrl(x.id), { method: "DELETE" }); }));
        toast("ذخیره شد"); closeSheet(); if (bot.auto_menu !== false) { try { await api(`/api/bots/${botId}/sync-menu`, { method: "POST" }); } catch (e) {} } refreshTab(); });
      const delCmd = () => sure("این دستور حذف شود؟", guard(async () => { await api(`/api/bots/${botId}/commands/${ed.name}`, { method: "DELETE" }); toast("حذف شد"); closeSheet(); refreshTab(); }));
      const cbDel = guard(async (id) => { await api(cbUrl(id), { method: "DELETE" }); delete ed.cb[id]; drawCmd(); refreshTab(); });

      /* ── پروفایل / پنل ادمین ── */
      const vMe = guard(async () => { const nm = user.full_name || user.username || String(user.uid); let rf = ""; try { const r = await api("/api/coins/referral"); rf = `<div class="strip" style="margin-top:14px"><div class="ac"><b>${n(r.coins)}</b><span>سکه</span></div><div><b>${n(r.referral_count)}</b><span>دعوت موفق</span></div></div><h2>دعوت دوستان · هر دعوت ۱۰۰ سکه</h2><div style="display:flex;gap:8px"><input class="in ltr mono" id="rl" readonly value="${esc(WEBAPP + "?ref=" + (r.referral_code || ""))}" style="margin:0"><div class="ib" style="width:46px;height:46px" onclick="navigator.clipboard.writeText($('rl').value).then(()=>toast('کپی شد'))">${ic("copy")}</div></div>`; } catch (e) {}
        app().className = "fade"; app().innerHTML = `<div class="bar"><div><b style="font-size:20px">پروفایل</b></div></div><div class="card" style="display:flex;align-items:center;gap:13px"><span class="ava">${esc(nm.charAt(0))}</span><div style="min-width:0"><b style="font-size:16px;font-weight:600">${esc(nm)}</b><div class="mono ltr" style="color:var(--mu);font-size:13px;text-align:right">#${n(user.uid)}</div></div></div>${rf}<h2>تنظیمات</h2><div class="item" onclick="toggleTheme()"><span class="sq">${ic("moon")}</span><div class="g"><b>تم روشن / تاریک</b></div></div>${user.is_admin ? `<div class="item" onclick="go('admin')"><span class="sq">${ic("shield")}</span><div class="g"><b>آمار سیستم</b></div>${ic("next")}</div>` : ""}<button class="btn red" style="margin-top:16px" onclick="logout()">${ic("logout")} خروج از حساب</button><p style="color:var(--mu);text-align:center;font-size:12px;margin-top:16px">ربات‌ساز · استودیو</p>`; });
      const vAdmin = guard(async () => { const d = await api("/api/admin/full-stats"); const o = d.overview || {}, g = (d.daily_growth || []).slice(-7), mx = Math.max(...g.map((x) => x.new_users), 1); const list = (t, a, f) => `<h2>${t}</h2>` + ((a || []).length ? a.map(f).join("") : `<p style="color:var(--mu);font-size:13px;padding:2px">—</p>`);
        app().className = "fade"; app().innerHTML = `<div class="bar"><div class="idn"><div class="ib" onclick="go('me')">${ic("back")}</div><div><b>آمار سیستم</b></div></div></div><div class="strip"><div class="ac"><b>${n(o.total_users)}</b><span>کاربر</span></div><div><b>${n(o.total_registered)}</b><span>ثبت‌نام</span></div><div><b>${n(o.total_bots)}</b><span>ربات</span></div><div><b>${n(o.total_active_bots)}</b><span>فعال</span></div></div><div class="strip" style="margin-top:9px"><div><b>${n(o.total_messages_received)}</b><span>دریافتی</span></div><div><b>${n(o.total_messages_sent)}</b><span>ارسالی</span></div><div><b>${n(o.total_coins)}</b><span>سکه</span></div><div><b>${n(o.total_referrals)}</b><span>دعوت</span></div></div>` + (g.length ? `<h2>رشد ۷ روز اخیر</h2><div class="card"><div class="chart">${g.map((x) => `<div class="col"><div class="cbar" style="height:${Math.max(6, (x.new_users / mx) * 100)}%"></div><span class="clab">${x.date.slice(8)}</span></div>`).join("")}</div></div>` : "") + list("برترین ربات‌ها", d.top_bots, (b) => `<div class="item static"><span class="av2 grad" style="width:36px;height:36px">${esc((b.username || "?").slice(0, 1).toUpperCase())}<i class="live ${b.is_active ? "on" : ""}"></i></span><div class="g"><b class="mono">@${esc(b.username || "—")}</b><small>${esc(b.owner_name || "")} · ${n(b.users)} کاربر</small></div></div>`) + list("برترین کاربران", d.top_users, (u) => `<div class="item static"><div class="g"><b>${esc(u.name !== "—" ? u.name : u.username || "—")}</b><small>${n(u.bots_count)} ربات · ${n(u.referrals)} دعوت</small></div><span class="badge">${n(u.coins)} سکه</span></div>`) + list("برترین دعوت‌کننده‌ها", d.top_referrers, (r) => `<div class="item static"><div class="g"><b>${esc(r.name)}</b><small class="mono">@${esc(r.username || "—")}</small></div><span class="badge">${n(r.referral_count)}</span></div>`); });

      async function boot(manual) { if (tg?.initData) initData = tg.initData; if (!initData && !token) return showAuth(); try { user = await api(manual ? "/api/auth/me" : initData ? "/api/me" : "/api/auth/me"); go("home"); } catch (e) { if (!token && !initData) return; toast("خطا: " + e.message, 1); if (/401|نامعتبر|unauthor/i.test(e.message)) showAuth(); } }
      if (tg) { tg.ready(); tg.expand(); }
      applyTheme(localStorage.getItem("gs_theme") || (tg?.colorScheme === "light" ? "light" : "dark"));
      boot(false);
    </script>
  </body>
</html>
